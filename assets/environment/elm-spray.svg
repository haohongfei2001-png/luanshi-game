  <path id="openlight" d="M.5-2 Q1-18 1-41 Q6-32 8-29 Q12-18 8-10 Q5-5 .5-2Z"/>
  <path id="foldlight" d="M0-2 Q-1-15 3-34 Q0-22 2-17 Q3-9 0-2Z"/>
</defs>
