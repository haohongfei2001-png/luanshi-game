name: Upload bounded recoverable artifact groups
description: Upload each pre-validated group separately, never aggregate raw capture frames
inputs:
  path:
    required: true
    description: Staged group directory
  prefix:
    required: true
    description: Unique artifact namespace
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      if: ${{ always() && hashFiles(format('{0}/group-00/**', inputs.path)) != '' }}
      with:
        name: ${{ inputs.prefix }}-${{ github.sha }}-00
        path: ${{ inputs.path }}/group-00/
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ always() && hashFiles(format('{0}/group-01/**', inputs.path)) != '' }}
      with:
