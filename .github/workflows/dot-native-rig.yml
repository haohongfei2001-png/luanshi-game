name: Dot intact rig GPU parity
on:
  push:
    branches: ['dot/native-rig-adapter']
    paths: ['scripts/field/experimental/native_rig*', 'tests/native_rig*', '.github/workflows/dot-native-rig.yml']
permissions:
  contents: read
jobs:
  gpu-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned official engine
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Test intact weights then compare native Skin and GPU palette
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-rig-gpu
          touch artifacts/.gdignore
          timeout 60s godot --headless --path . --script tests/native_rig_palette.gd >artifacts/native-rig-gpu/math.log 2>&1
          timeout 120s xvfb-run -a -s '-screen 0 1024x768x24' godot --path . --display-driver x11 --rendering-method gl_compatibility --resolution 1024x768 --audio-driver Dummy --script tests/native_rig_gpu.gd >artifacts/native-rig-gpu/gpu.log 2>&1 || { cat artifacts/native-rig-gpu/gpu.log; exit 1; }
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/native-rig-gpu/*.log; then exit 1; fi
          cat artifacts/native-rig-gpu/math.log artifacts/native-rig-gpu/gpu.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intact-rig-parity-${{ github.sha }}
          path: artifacts/native-rig-gpu/
          if-no-files-found: error
          retention-days: 30
