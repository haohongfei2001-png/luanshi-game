name: Verify the complete person and anatomically registered clothing
on:
  push:
    branches: [codex/river-rc23-hm08-body]
    paths: ['.github/workflows/hm08-field-figure.yml','tools/art/bake_field_anatomy.py','tests/bridgehead_clothing_window.gd']
permissions:
  contents: write
  actions: read
concurrency:
  group: costume-codex/river-rc23-hm08-body
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the actual previous full-person windows
        run: |
          mkdir -p docs/evidence/river-gate-v1-rc23/character-master-sewn-neck
          cp -a docs/evidence/river-gate-v1-rc23/character-master/after docs/evidence/river-gate-v1-rc23/character-master-sewn-neck/before
      - name: Install the pinned runtime and known upstream clothing tools
        run: |
          set -eu
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/editor
          sudo install /tmp/editor/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          if ! command -v blender >/dev/null || ! command -v xdotool >/dev/null || ! /usr/bin/python3 -c 'import PIL,numpy'; then sudo apt-get update -qq && sudo apt-get install -y -qq xdotool python3-numpy python3-pil blender ffmpeg; fi
          ./tools/prepare-font.sh
          mkdir -p artifacts/bridge-window docs/evidence/river-gate-v1-rc23/character-master-sewn-neck
          touch artifacts/.gdignore
          cat >override.cfg <<'CFG'
          [display]
          window/size/window_width_override=2560
          window/size/window_height_override=1600
          CFG
      - name: Reuse the already captured pre-rebuild original-speed film
        uses: actions/download-artifact@v4
        with:
          name: complete-person-original-speed
          run-id: 43559829760
          github-token: ${{ github.token }}
          path: /tmp/previous-person
      - name: Keep evidence outside Godot's resource import
        run: |
          touch docs/evidence/river-gate-v1-rc23/character-master-sewn-neck/.gdignore
      - name: Photograph both complete 2560 x 1600 windows on matching soldiers
        shell: bash
        run: |
          set -euo pipefail
          proof=docs/evidence/river-gate-v1-rc23/character-master-sewn-neck
          cp scripts/field/company_art.gd /tmp/complete-company.gd
          for side in after; do
            mkdir -p "$proof/$side"
            if [ "$side" = after ]; then
              /usr/bin/python3 tools/art/mature_field_company.py /tmp/complete-issue | tee "$proof/coat-bake.log"
              cp /tmp/complete-company.gd scripts/field/company_art.gd
            fi
            godot --headless --audio-driver Dummy --editor --path . --import > "$proof/$side/import.log" 2>&1
            if grep -n -C3 -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/$side/import.log"; then exit 1; fi
            timeout 5m xvfb-run -a -s '-screen 0 2560x1600x24' godot --path . --audio-driver Dummy --display-driver x11 --resolution 2560x1600 --disable-vsync --fixed-fps 24 --script tests/bridgehead_clothing_window.gd > "$proof/$side/window.log" 2>&1
            if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/$side/window.log"; then exit 1; fi
            grep ROBE_GAME_WINDOW "$proof/$side/window.log"
            cp artifacts/bridge-window/line-*.jpg artifacts/bridge-window/reverse-*.jpg artifacts/bridge-window/kit*.jpg artifacts/bridge-window/field.json "$proof/$side/"
          done
          git add assets/river_gate/figures/field_company_master.glb assets/third_party/wildfire_garments/field_colours.png tools/art/source/field_anatomy.json reports/hm08
          git diff --exit-code -- assets/river_gate/figures/company_motion.png assets/river_gate/figures/river_company.glb
          git -c user.name='River Gate costume art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake continuous high-detail people, fitted full clothes and unified cloth dye'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          import pathlib,json,numpy as np
          root=pathlib.Path("docs/evidence/river-gate-v1-rc23/character-master-sewn-neck")
          assert json.loads((root/"before"/"field.json").read_bytes())==json.loads((root/"after"/"field.json").read_bytes())
          out={}
          for name in ("line-055","line-105","line-135","line-185","reverse-135","kit3-135","kit5-135","kit7-135"):
              a=root/"before"/(name+".jpg")
              pair=[]
              for side in ("before","after"):
                  path=root/side/a.name
                  im=Image.open(path).convert("RGB")
                  assert im.size==(2560,1600)
                  pair.append(np.array(im,dtype=np.int16))
                  im.save(root/side/(name+"-native-preview.jpg"),quality=78,subsampling=2)
                  im.thumbnail((1280,800));im.save(root/side/(name+"-window.jpg"),quality=91,subsampling=0)
              delta=np.max(abs(pair[0]-pair[1]),axis=-1)
              out[name]={"pixels_changed_12":int((delta>12).sum()),"pixels_changed_25":int((delta>25).sum())}
          (root/"compare.json").write_text(json.dumps(out,indent=2))
          PY

          git add "$proof"
          git -c user.name='River Gate costume art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive matched 2K windows after complete person continuity correction'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Photograph the fitted neckline in the same live pose
        shell: bash
        run: |
          set -euo pipefail
          proof=docs/evidence/river-gate-v1-rc23/character-master-sewn-neck/diagnostic
          mkdir -p "$proof"
          timeout 4m xvfb-run -a -s '-screen 0 2560x1600x24' godot --path . --audio-driver Dummy --display-driver x11 --resolution 2560x1600 --disable-vsync --fixed-fps 24 --script tests/person_surface_diagnostic.gd >"$proof/window.log" 2>&1
          grep PERSON_DIAGNOSTIC "$proof/window.log"
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/window.log"; then exit 1; fi
          cp artifacts/person-diagnostic/* "$proof/"
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path("docs/evidence/river-gate-v1-rc23/character-master-sewn-neck/diagnostic")
          for mode in ("actual","clay","normal","unlit"):
              im=Image.open(p/(mode+".jpg"))
              im.save(p/(mode+"-native-preview.jpg"),quality=78,subsampling=2)
          PY
          git add "$proof"
          git -c user.name='River Gate costume art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Check the anatomically fitted neck and garment under the actual fighting pose'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Record the complete people at the original battle speed
        shell: bash
        run: |
          set -euo pipefail
          proof=docs/evidence/river-gate-v1-rc23/character-master-sewn-neck
          mkdir -p "$proof/motion" /tmp/person-after
          touch "$proof/.gdignore"
          files=(scripts/field/company_art.gd scripts/field/company_skin.gdshader assets/river_gate/figures/field_company_master.glb assets/third_party/wildfire_garments/field_colours.png)
          cp /tmp/previous-person/docs/evidence/river-gate-v1-rc23/character-master-motion/motion/before-* "$proof/motion/"
          printf '%s\n' "$GITHUB_SHA" > "$proof/motion/authoring-sha.txt"
          sha256sum "${files[@]}" scripts/field/field_person_pigment.gdshaderinc scripts/field/field_person_light.gdshaderinc > "$proof/motion/production-sha256.txt"
          for take in after-normal after-reverse after-close; do
            args=()
            if [ "$take" = after-close ]; then args=(--close-dress); fi
            if [ "$take" = after-reverse ]; then args=(--reverse-dress); fi
            timeout 12m xvfb-run -a -s '-screen 0 2560x1600x24' godot --path . --audio-driver Dummy --display-driver x11 --resolution 2560x1600 --disable-vsync --fixed-fps 20 --script tests/person_master_motion.gd -- "${args[@]}" >"$proof/motion/$take.log" 2>&1
            grep FIELD_COAT_MOTION_PASS "$proof/motion/$take.log"
            if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/motion/$take.log"; then exit 1; fi
            ffmpeg -y -hide_banner -loglevel error -framerate 20 -start_number 0 -i artifacts/bridge-window/frame-%03d.jpg -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -movflags +faststart "$proof/motion/$take.mp4"
            ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames,duration -of json "$proof/motion/$take.mp4" >"$proof/motion/$take-stream.json"
            cp artifacts/bridge-window/recording.json "$proof/motion/$take.json"
            /usr/bin/python3 - "$take" "$proof" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys
          proof=Path(sys.argv[2])/"motion"
          strip=Image.new("RGB",(1280,800))
          for i,frame in enumerate((0,14,32,59)):
              im=Image.open(Path("artifacts/bridge-window")/f"frame-{frame:03d}.jpg")
              im.save(proof/f"{sys.argv[1]}-{frame:03d}-native-preview.jpg",quality=78,subsampling=2)
              im.thumbnail((640,400));strip.paste(im,((i%2)*640,(i//2)*400))
          strip.save(proof/(sys.argv[1]+"-four-times.jpg"),quality=88,subsampling=2)
          PY
          done
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          proof=Path("docs/evidence/river-gate-v1-rc23/character-master-sewn-neck")
          records=[]
          for take in ("before-normal","after-normal","after-reverse","after-close"):
              doc=json.loads((proof/"motion"/(take+".json")).read_text())
              assert doc["frames"]==60 and doc["fps"]==20 and doc["size"]==[2560,1600] and doc["scale"]==1.0
              records.append([{k:v for k,v in r.items() if k!="view"} for r in doc["index"]])
              stream=json.loads((proof/"motion"/(take+"-stream.json")).read_text())["streams"][0]
              assert stream["nb_frames"]=="60" and stream["avg_frame_rate"]=="20/1"
          assert all(r==records[0] for r in records)
          (proof/"motion"/"verification.json").write_text(json.dumps({"all_four_gameplay_sequences_equal":True,"frames":60,"duration":3,"playback_fps":20,"measurement_kind":"deterministic original-speed capture, not a realtime FPS benchmark"},indent=2))
          PY
          git diff --exit-code -- "${files[@]}" assets/river_gate/figures/company_motion.png
          git add "$proof"
          git -c user.name='River Gate costume art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive complete person motion with source-matched seam fitting and original-speed comparison'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Show the actual import and window errors
        if: failure()
        run: |
          for f in docs/evidence/river-gate-v1-rc23/character-master-sewn-neck/*/*.log; do if test -f "$f"; then tail -n 28 "$f"; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-character-master-2k
          path: |
            docs/evidence/river-gate-v1-rc23/character-master-sewn-neck
            artifacts/bridge-window
            assets/river_gate/figures/field_company_master.glb
            tools/art/source/field_anatomy.json
          retention-days: 7
