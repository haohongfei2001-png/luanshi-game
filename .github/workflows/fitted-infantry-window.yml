name: Compare the fitted shoulders and a full-speed infantry march
on:
  push:
    branches: ['codex/river-fitted-shoulders']
    paths-ignore: ['docs/**','assets/river_gate/figures/company_motion.png','assets/river_gate/figures/river_company.glb','assets/river_gate/figures/field_garments.gltf','assets/third_party/wildfire_garments/field_issues.glb']
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bake the fitted mesh, unchanged weapons, and shoulder shell
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get -yq install python3-numpy python3-pil ffmpeg
          node tools/art/bake_field_garments.mjs
          node tools/art/bake_field_garments.mjs --check
          /usr/bin/python3 tools/art/bake_river_company.py --geometry-only
          /usr/bin/python3 -c "import sys;sys.path.insert(0,'tools/art');from company_motion import bake_motion;from pathlib import Path;bake_motion(Path('assets/river_gate/figures'))"
          git show 01bcdb90a1edbc41d8cb43de61abe37b0461f357:assets/river_gate/figures/company_motion.png > "$RUNNER_TEMP/old.png"
          /usr/bin/python3 tools/art/check_company_motion.py
          /usr/bin/python3 tools/art/check_field_carries.py
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          a=Image.open(Path(os.environ["RUNNER_TEMP"])/"old.png").convert("RGBA")
          b=Image.open("assets/river_gate/figures/company_motion.png").convert("RGBA")
          changes=[]
          for i in range(a.height//4):
              box=(0,i*4,a.width,4*(i+1))
              if a.crop(box).tobytes()!=b.crop(box).tobytes(): changes.append(i)
          allowed={5*31+j for j in [0,12,*range(16,31)]}
          assert set(changes)==allowed,(changes,allowed)
          print("LEGACY_ATTACK_ROWS_EXACT",a.height//4-len(allowed),"BOW_TRAVEL_ROWS",len(changes))
          PY
          /usr/bin/python3 tools/art/import_garrison_issues.py "$RUNNER_TEMP/garrison"
          # No face, hand, bracer, dye, or other pre-existing asset may have changed.
          git diff --exit-code -- assets/river_gate/figures/garrison_bodies.glb assets/third_party/wildfire_garments/field_colours.png
          git add -- assets/river_gate/figures/company_motion.png assets/river_gate/figures/river_company.glb assets/third_party/wildfire_garments/field_issues.glb assets/river_gate/figures/field_garments.gltf
          if ! git diff --cached --quiet; then
            git -c user.name='River Gate field art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake the shouldered cuirasses, fitted sleeves and suspended skirts'
          fi
          git rev-parse HEAD
      - name: Render two identical live battles and an equal-speed field march
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 1 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/g.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/g.zip' | sha512sum -c -
          unzip -q /tmp/g.zip -d /tmp/g
          ./tools/prepare-font.sh
          proof=docs/evidence/river-gate-v1-rc19/fitted-infantry
          mkdir -p "$proof"
          for side in before after; do
            rev=HEAD
            if test "$side" = before; then rev=01bcdb90a1edbc41d8cb43de61abe37b0461f357; fi
            root="$RUNNER_TEMP/shoulder-$side"
            mkdir -p "$root" "$proof/$side"
            git archive "$rev" | tar -x -C "$root"
            cp -a assets/fonts/. "$root/assets/fonts/"
            cp tests/field_fitted_march.gd "$root/tests"
            godot=/tmp/g/Godot_v4.6.3-stable_linux.x86_64
            "$godot" --headless --editor --path "$root" --import > "$proof/$side/import.log" 2>&1
            if grep -E 'ERROR:|Parse Error' "$proof/$side/import.log"; then exit 1; fi
            for tool in field_fitted_march rc7_personal_contact; do
              xvfb-run -a -s '-screen 0 1920x1200x24' "$godot" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script "tests/$tool.gd" -- --field-size=512 > "$proof/$side/$tool.log" 2>&1
              if grep -E 'ERROR:|Parse Error' "$proof/$side/$tool.log"; then exit 1; fi
            done
            cp "$root"/artifacts/fitted-march/{line.png,reverse.png,spear-fit.png,line.json} "$proof/$side"
            cp "$root"/artifacts/personal-contact/{personal-contact.png,input.json} "$proof/$side/"
            xvfb-run -a -s '-screen 0 1280x800x24' "$godot" --path "$root" --resolution 1280x800 --disable-vsync --fixed-fps 20 --write-movie "$RUNNER_TEMP/$side.avi" --script tests/field_fitted_march.gd -- --field-size=512 --march-film > "$proof/$side/movie.log" 2>&1
            grep -F 'FITTED_MARCH true' "$proof/$side/movie.log"
            cp "$root/artifacts/fitted-march/film.json" "$proof/$side"
            ffmpeg -loglevel error -y -i "$RUNNER_TEMP/$side.avi" -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac "$proof/$side/march.mp4"
          done
          ffmpeg -loglevel error -y -i "$proof/before/march.mp4" -i "$proof/after/march.mp4" -filter_complex '[0:v]scale=640:400[l];[1:v]scale=640:400[r];[l][r]hstack[v]' -map '[v]' -map 1:a:0 -c:v libx264 -crf 19 -pix_fmt yuv420p -c:a copy "$proof/equal-speed.mp4"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          root=Path('docs/evidence/river-gate-v1-rc19/fitted-infantry')
          for name in ('input','line','film'):
              assert json.loads((root/'before'/(name+'.json')).read_text())==json.loads((root/'after'/(name+'.json')).read_text()),name
          for name in ('line','reverse','personal-contact','spear-fit'):
              pair=Image.new('RGB',(1600,500) if name!='spear-fit' else (830,310))
              for i,side in enumerate(('before','after')):
                  im=Image.open(root/side/(name+'.png')).convert('RGB')
                  assert im.size==(1920,1200)
                  im.resize((1152,720),Image.Resampling.LANCZOS).save(root/side/(name+'-window.jpg'),quality=91,subsampling=0)
                  if name=='spear-fit':
                      im=im.crop((735,292,1185,629))
                  cell=pair.width//2,pair.height
                  pair.paste(im.resize(cell,Image.Resampling.LANCZOS),(i*cell[0],0))
              pair.save(root/(name+'-pair.jpg'),quality=94,subsampling=0)
          PY
          for view in before after; do
            mkdir -p "$RUNNER_TEMP/film-$view"
            ffmpeg -loglevel error -i "$proof/$view/march.mp4" -vf 'fps=5,scale=800:500' "$RUNNER_TEMP/film-$view/f%03d.jpg"
          done
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          root=Path('docs/evidence/river-gate-v1-rc19/fitted-infantry')
          temp=Path(os.environ['RUNNER_TEMP'])
          for kind in ('window','motion'):
              size=(390,244) if kind=='window' else (335,240)
              plate=Image.new('RGB',(size[0]*3,size[1]*2))
              for row,side in enumerate(('before','after')):
                  frames=sorted((temp/('film-'+side)).glob('f*.jpg'))
                  assert len(frames)>=22
                  for col,j in enumerate((4,10,18)):
                      im=Image.open(frames[j]).convert('RGB')
                      if kind=='motion': im=im.crop((270,135,525,318))
                      plate.paste(im.resize(size,Image.Resampling.LANCZOS),(col*size[0],row*size[1]))
              plate.save(root/(kind+'-time.jpg'),quality=95,subsampling=0)
          PY
          git add -- "$proof"
          git -c user.name='River Gate field art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record equal-speed fitted infantry and the native 22 metre game windows'
          git push origin HEAD:refs/heads/codex/river-fitted-shoulders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-shoulder-fit-game
          path: docs/evidence/river-gate-v1-rc19/fitted-infantry
