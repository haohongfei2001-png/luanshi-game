name: Dot bounded native Mac evidence baseline
on:
  push:
    branches: ['dot/river-native-review-source']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dot-bounded-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Old-save migrations archive historical committed fixtures.
          fetch-depth: 0
      - name: Install verified official Godot and export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo 'da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68  /tmp/templates.tpz' | sha512sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/macos.zip' 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Verify actual source and complete gameplay regression before export
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-export
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          ./tools/prepare-font.sh
          timeout 240s godot --headless --editor --path . --import >artifacts/native-export/import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/native-export/import.log; then exit 1; fi
          for test in tests/*_test.py; do python3 "$test"; done >artifacts/native-export/python.log 2>&1
          timeout 1200s ./tools/test.sh >artifacts/native-export/aggregate.log 2>&1
          timeout 120s godot --headless --path . --script tests/whole_input_calibration.gd >artifacts/native-export/input.log 2>&1
          timeout 120s godot --headless --path . --script tests/whole_input_calibration.gd -- --real-time-profile >artifacts/native-export/input-profile.log 2>&1
          timeout 120s godot --headless --path . --script tests/whole_input_calibration.gd -- --wall-clock-capture --wall-clock-action >artifacts/native-export/input-wall-clock.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/native-export/*.log; then exit 1; fi
      - name: Export the actual complete package and legal notices
        run: ./tools/export.sh >artifacts/native-export/export.log 2>&1
      - name: Stage separate bounded source-package artifacts
        run: |
          mkdir -p artifacts/package-source
          cp builds/Luanshi-macOS.zip builds/SHA256SUMS builds/THIRD_PARTY_NOTICES.txt artifacts/package-source/
          python3 tools/bounded_artifact_groups.py stage artifacts/package-source artifacts/source-groups
      - uses: ./.github/actions/upload-bounded
        if: always()
        with:
          path: artifacts/source-groups
          prefix: dot-native-source-package
      - name: Preserve export failures and test logs
        if: always()
        run: |
          mkdir -p artifacts/native-export
          printf '%s\n' '${{ github.sha }}' >artifacts/native-export/SOURCE_SHA.txt
          python3 tools/bounded_artifact_groups.py stage artifacts/native-export artifacts/export-log-groups
      - uses: ./.github/actions/upload-bounded
        if: always()
        with:
          path: artifacts/export-log-groups
          prefix: dot-native-export-logs
  native:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dot-native-source-package-${{ github.sha }}-*
          path: source-parts
          merge-multiple: true
      - name: Restore and verify every exported package byte
        run: python3 tools/bounded_artifact_groups.py restore source-parts package
      - name: Restore the pinned native engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: patch
          key: macos-arm64-godot-35e80b3-angle-7578-mobile-mutex-v1
      - uses: actions/download-artifact@v4
        id: engine-artifact
        if: steps.engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          name: mobile-mutex-angle-template
          path: patch
          run-id: '43580708251'
          github-token: ${{ github.token }}
      - name: Rebuild the pinned source if its original artifact has expired
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.engine-artifact.outcome == 'failure'
        run: bash tools/build_macos_engine.sh patch
      - name: Prepare the native movie encoder and audit the hosted hardware
        run: |
          set -euo pipefail
          mkdir -p artifacts/whole-native
          uname -a > artifacts/whole-native/host.txt
          sw_vers >> artifacts/whole-native/host.txt
          system_profiler SPHardwareDataType SPDisplaysDataType >> artifacts/whole-native/host.txt
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 -m venv "$RUNNER_TEMP/review-python"
          "$RUNNER_TEMP/review-python/bin/pip" install Pillow
      - name: Profile no-readback QHD UHD and capture honest original-speed action
        id: native-run
        run: |
          set -euo pipefail
          mkdir -p artifacts/whole-native
          "$RUNNER_TEMP/review-python/bin/python" tools/whole_native_delivery.py package/Luanshi-macOS.zip patch artifacts/whole-native --profile-uhd --wall-clock-video --wall-clock-uhd --wall-clock-action --require-river-pass-master 2>&1 | tee artifacts/whole-native/delivery-driver.log
      - name: Preserve actual patched internal package separately
        if: always()
        run: |
          mkdir -p artifacts/native-package
          if test -f artifacts/whole-native/Luanshi-macOS-arm64-world-review.zip; then
            cp artifacts/whole-native/Luanshi-macOS-arm64-world-review.zip artifacts/native-package/
            echo CREATED >artifacts/native-package/PACKAGE_STATUS.txt
          else
            echo NOT_CREATED >artifacts/native-package/PACKAGE_STATUS.txt
          fi
          if test -f artifacts/whole-native/delivery.json; then cp artifacts/whole-native/delivery.json artifacts/native-package/; fi
          python3 tools/bounded_artifact_groups.py stage artifacts/native-package artifacts/native-package-groups
      - uses: ./.github/actions/upload-bounded
        if: always()
        with:
          path: artifacts/native-package-groups
          prefix: dot-native-internal-package
      - name: Curate failures journals selected native frames and complete encoded movies
        if: always()
        run: |
          mkdir -p artifacts/whole-native
          printf '%s\n' '${{ github.sha }}' >artifacts/whole-native/SOURCE_SHA.txt
          printf '%s\n' 'ART_REBUILD_REQUIRED; M5 DEVICE_NOT_RUN; hosted baseline only' >artifacts/whole-native/LIMITATIONS.txt
          printf '%s\n' 'Native step outcome: ${{ steps.native-run.outcome }}' >artifacts/whole-native/WORKFLOW_STATUS.txt
          python3 tools/native_evidence_bundle.py artifacts/whole-native artifacts/native-curated
          python3 tools/bounded_artifact_groups.py stage artifacts/native-curated artifacts/evidence-groups
      - uses: ./.github/actions/upload-bounded
        if: always()
        with:
          path: artifacts/evidence-groups
          prefix: dot-native-curated-evidence
