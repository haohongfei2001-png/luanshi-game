name: Build and play the whole native horse with its real saddle
on:
  push:
    branches: ['codex/river-native-remount']
    paths: ['tools/art/bake_native_remount.py','scripts/field/mount_art.gd','scripts/field/mount_hide.gdshader','scripts/field/presentation.gd','tests/native_remount*.gd','.github/workflows/native-remount.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: river-whole-native-horse
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: field-verification-footage-666ae28814592dc1cb3212e736814122c4f7237b
          run-id: '43587148752'
          github-token: ${{ github.token }}
          path: /tmp/rc24-footage-failure
      - name: Read the preserved formal footage timeout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path("/tmp/rc24-footage-failure").rglob("*.log")):
              if path.name=="field-import.log":
                  continue
              print("PRESERVED_FAILURE_LOG",path.name,flush=True)
              print("\n".join(path.read_text(errors="replace").splitlines()[-12:]),flush=True)
          PY
      - name: Install the fixed renderer and source tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy python3-pil ffmpeg xdotool
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
      - name: Bake the full author skinning and socket curves
        run: |
          set -euo pipefail
          mkdir -p artifacts reports/remount
          touch artifacts/.gdignore
          /usr/bin/python3 tools/art/bake_native_remount.py "$RUNNER_TEMP/horse-source" | tee reports/remount/full-native.log
          git add assets/third_party/wildfire_remounts reports/remount
          git -c user.name='River Gate horse integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake full native horse joints and matching saddle and head attachments'
          git push origin HEAD:refs/heads/codex/river-native-remount
      - name: Validate the actual resource and shared saddle frames
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import > artifacts/native-remount-import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/native-remount-import.log; then exit 1; fi
          godot --headless --path . --script tests/native_remount_sockets.gd 2>&1 | tee artifacts/native-sockets.log
          grep -q NATIVE_SADDLE_PASS artifacts/native-sockets.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/native-sockets.log; then exit 1; fi
      - name: Record the same living cavalry before and after
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/river-horse-before 4f3c0819cf44a89c24bd825c90f241d8974fbbb6
          cp tests/native_remount_window.gd tests/native_remount_motion.gd /tmp/river-horse-before/tests/
          (cd /tmp/river-horse-before && ./tools/prepare-font.sh && godot --headless --editor --path . --import > /tmp/river-horse-import.log 2>&1)
          proof="$PWD/docs/evidence/river-whole-rebuild/native-horse"
          mkdir -p "$proof"
          for label in before after; do
            project="$PWD"
            if [ "$label" = before ]; then project=/tmp/river-horse-before; fi
            mkdir -p "$project/artifacts"
            touch "$project/artifacts/.gdignore"
            timeout 660s xvfb-run -a -s "-screen 0 2560x1600x24" godot --path "$project" --resolution 2560x1600 --audio-driver Dummy --disable-vsync --script tests/native_remount_motion.gd -- --field-size=512 > "$proof/$label.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "$proof/$label.log"; then exit 1; fi
            grep -q NATIVE_REMOUNT_MOTION "$proof/$label.log"
            cp "$project/artifacts/remount-motion/sequence.json" "$proof/$label-sequence.json"
            for view in normal close; do
              ffmpeg -v error -y -framerate 20 -i "$project/artifacts/remount-motion/$view/frame-%03d.png" -c:v libx264 -crf 17 -pix_fmt yuv420p -movflags +faststart "$proof/$label-$view.mp4"
              ffmpeg -v error -y -i "$proof/$label-$view.mp4" -vf "select=not(mod(n\,4)),scale=640:-2,tile=2x4" -frames:v 1 -q:v 2 "$proof/$label-$view-sheet.jpg"
              /usr/bin/python3 - "$project" "$proof" "$label" "$view" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          project,proof,label,view=sys.argv[1:]
          for frame in (0,8,20,31):
              image=Image.open(Path(project)/f"artifacts/remount-motion/{view}/frame-{frame:03d}.png").convert("RGB")
              image.save(Path(proof)/f"{label}-{view}-{frame:03d}.jpg",quality=94)
              image.thumbnail((1440,900),Image.Resampling.LANCZOS)
              image.save(Path(proof)/f"{label}-{view}-{frame:03d}-preview.jpg",quality=86)
          PY
            done
          done
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          out=Path("docs/evidence/river-whole-rebuild/native-horse")
          before=json.loads((out/"before-sequence.json").read_text())
          after=json.loads((out/"after-sequence.json").read_text())
          assert before==after,"Visual replacement changed authoritative replay"
          records={path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in out.glob("*.mp4")}
          (out/"sha256.json").write_text(json.dumps(records,indent=2)+"\n")
          PY
          git add "$proof"
          git -c user.name='River Gate horse review' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve complete real cavalry original-speed before and after'
          git push origin HEAD:refs/heads/codex/river-native-remount
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-native-horse-review
          path: |
            artifacts/
            reports/remount/
            docs/evidence/river-whole-rebuild/native-horse/
          retention-days: 7
