name: Archive genuine river-gate captures and the exported battle movie
on:
  push:
    branches: ['codex/river-rc19-library-worker']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 484e88b5fa46c55bea198ed9378b73bbb4187eb0
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: river-art-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/river-art
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-verification-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/river-mac
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: exported-game-window-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/river-film
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-journey-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/field-journey
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-macOS-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/apple-app
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-Linux-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/linux-game
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-footage-9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd
          path: /tmp/field-footage
          run-id: 43510132831
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: first-metal-same-rc19
          path: /tmp/cold-recheck
          run-id: 43513432464
          github-token: ${{ github.token }}
      - name: Copy the original captures, match the app hash and publish only this evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, plistlib, shutil, struct, tarfile, zipfile
          from pathlib import Path
          d=Path("docs/evidence/river-gate-v1-rc19")
          d.mkdir(parents=True,exist_ok=True)
          ri=Path("/tmp/river-art")
          root=next(ri.rglob("before-22m")).parent
          mac=Path("/tmp/river-mac")
          mov=Path("/tmp/river-film")
          rec=json.loads(next(mov.rglob("export-recording.json")).read_bytes())
          include={
              "normal-camera-before-after/before.png":root/"before-22m/personal-contact.png",
              "normal-camera-before-after/after.png":root/"normal-22m/personal-contact.png",
              "normal-camera-before-after/windup-before.png":root/"before-22m/personal-windup.png",
              "metal-renderer-comparison.json":next(mac.rglob("renderer-comparison.json")),
              "metal-window-frames.json":next(mac.rglob("shipping-metal-frames.json")),
              "normal-camera-before-after/windup.png":root/"normal-22m/personal-windup.png",
              "close.png":root/"after/hero.png","mid.png":root/"after/formation.png",
              "wide.png":root/"after/ranks.png",
              "player-nine-weapons.mp4":next(Path("/tmp/field-footage").rglob("player-nine-weapons.mp4")),
              "full-siege.mp4":next(Path("/tmp/field-footage").rglob("river-gate-full-siege.mp4")),
              "metal-window.png":next(mac.rglob("shipping-metal.png")),
              "playthrough-review.mp4":next(Path("/tmp/field-journey").rglob("river-gate-review.mp4")),
              "playthrough-full.mp4":next(Path("/tmp/field-journey").rglob("river-gate-journey.mp4")),
              "journey-frames.jpg":next(Path("/tmp/field-journey").rglob("journey-frames.jpg")),
              "normal-review.jpg":root/"normal-22m/normal-review.jpg",
              "normal-native.jpg":root/"normal-22m/normal-full.jpg",
              "normal-pair.jpg":root/"normal-22m/normal-pair.jpg",
              "combat-normal-speed.mp4":next(mov.rglob("combat-normal-speed.mp4")),
              "macos-codesign.log":next(mac.rglob("codesign.log")),
              "macos-host.log":next(mac.rglob("host.log")),
              "export-sequence.jpg":next(mov.rglob("export-sequence.jpg")),
              "export-recording.json":next(mov.rglob("export-recording.json")),
          }
          assert rec["export"]=="9357483bc54c28e0c5d3c04b42dbe5c7e41b4bfd" and rec["package_sha256"]=="6ed2c548cf3db300005385f4e9d3741661b2d4a29893b3daa36c4665bdbc8fdf"
          assert max(r["end_tick"] for r in rec["samples"])>=570
          native=json.loads(next(mac.rglob("renderer-comparison.json")).read_bytes())
          assert native["archive_sha256"]=="16ee9ef10b0b2ce62fcf49451567b08d2cefe5ab787e26a865e5c1e210bd4491" and native["shipping_window"]["validated"]
          apple=next(Path("/tmp/apple-app").rglob("Luanshi-macOS.zip"))
          linux=next(Path("/tmp/linux-game").rglob("Luanshi-linux.tar.gz"))
          assert hashlib.sha256(apple.read_bytes()).hexdigest()==native["archive_sha256"]
          assert hashlib.sha256(linux.read_bytes()).hexdigest()==rec["package_sha256"]
          with zipfile.ZipFile(apple) as app:
              names=app.namelist()
              notes=app.read("THIRD_PARTY_NOTICES.txt")
              info=plistlib.loads(app.read(next(k for k in names if k.endswith(".app/Contents/Info.plist"))))
              assert str(info["CFBundleVersion"])=="16019" and info["CFBundleIdentifier"]=="com.luanshi.prototype"
              loader=next(k for k in names if k.endswith(".app/Contents/MacOS/"+info["CFBundleExecutable"]))
              assert len(app.read(loader))>1000000
          with tarfile.open(linux) as package:
              linux_notes=package.extractfile(next(k for k in package if k.name.endswith("THIRD_PARTY_NOTICES.txt"))).read()
          assert notes==linux_notes and all(k in notes for k in (b"Wildfire Games", b"Attribution-ShareAlike 3.0",b"creativecommons.org/licenses/by-sa/3.0/",b"Quaternius",b"MakeHuman",b"River Gate remount studies",b"River Gate watchhall"))
          # Distribute the exact unsigned-for-Developer-ID test candidate, without repackaging or a public Release.
          assert apple.stat().st_size < 100*1024**2, "Git artifact exceeds the per-file storage limit"
          destination = Path("candidate/River-Gate-RC19-macOS.zip")
          destination.parent.mkdir(exist_ok=True)
          shutil.copyfile(apple, destination)
          (destination.parent/"SHA256SUMS").write_text(native["archive_sha256"]+"  "+destination.name+"\n")
          launch_labels = [entry["label"] for entry in native["samples"]] + [native["focus_control"]["label"], native["shipping_window"]["label"]]
          assert len(set(launch_labels))==9
          # Preserve the first recorded failure from the initial unmodified suite.
          first=next(x for x in native["samples"] if x["label"]=="default-metal-1")
          assert not first["validated"] and first["returncode"]==124 and first["last_boot_stage"]=="scene_ready"
          assert first["launch_milestones_ms"].keys()=={"scene_ready"}
          for label in launch_labels:
              for suffix in (".log","-boot.json","-focus.log","-before-scene.sample.txt"):
                  path=next(mac.rglob(label+suffix),None)
                  if path is not None:
                      include["startup/"+label+suffix]=path
          trace=Path("/tmp/cold-recheck")
          traced=json.loads(next(trace.rglob("renderer-comparison.json")).read_bytes())
          assert traced["archive_sha256"]==native["archive_sha256"]
          assert sum(r["validated"] for r in traced["samples"])==2 and len(traced["samples"])==3
          for relative in ("renderer-comparison.json","default-metal-1.log","default-metal-1-boot.json","default-metal-1-before-frame.sample.txt","default-metal-2-boot.json","default-metal-2-before-frame.sample.txt","startup-focus-control-boot.json"):
              include["startup/same-package-fresh-host/"+relative]=next(trace.rglob(relative))
          provenance={"bundle_version":info["CFBundleVersion"],"identifier":info["CFBundleIdentifier"],"archive_sha256":native["archive_sha256"],"linux_archive_sha256":rec["package_sha256"],"archive_bytes":apple.stat().st_size,"initial_macos_validated":sum(x["validated"] for x in [*native["samples"],native["focus_control"],native["shipping_window"]]),"equal_notices":True,"notices_sha256":hashlib.sha256(notes).hexdigest(),"export_commit":rec["export"]}
          (d/"shipping-packages.json").write_text(json.dumps(provenance,indent=2)+"\n")
          timings=json.loads(next(mac.rglob("shipping-metal-frames.json")).read_bytes())["raw_wall_ms"]
          assert len(timings)==native["shipping_window"]["frames"]
          assert abs(max(timings)-native["shipping_window"]["max_ms"])<.001
          (d/"native-frame-times.json").write_text(json.dumps(timings,separators=(",",":"))+"\n")
          before,after=[json.loads((root/k/"input.json").read_text()) for k in ("before-22m","normal-22m")]
          assert before==after and len(after)==2
          (d/"normal-camera-before-after").mkdir(exist_ok=True)
          (d/"normal-camera-before-after/input.json").write_text(json.dumps(after,ensure_ascii=False,indent=2)+"\n")
          sums={}
          for name,path in include.items():
              raw=path.read_bytes()
              if name.endswith(".png"):
                  assert raw[:8]==b"\x89PNG\r\n\x1a\n"
                  w,h=struct.unpack(">II",raw[16:24])
                  if name!="metal-window.png": assert (w,h)==(1920,1200),(name,w,h)
              dest=d/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path,dest)
              sums[name]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          assert sums["combat-normal-speed.mp4"]["sha256"]==rec["movie_sha256"]
          assert sums["playthrough-full.mp4"]["sha256"]=="d93dc9974a60d255453143dd3c1383431ce2b13b19546c57c20b3216df948c4b"
          assert sums["playthrough-review.mp4"]["sha256"]=="86110e15d46cc1a81d6985e2da0888a7142454038d27440fd26c6c150adfce0a"
          (d/"capture-files.json").write_text(json.dumps(sums,indent=2)+"\n")
          print("ARCHIVED_ORIGINALS",json.dumps(sums))
          import base64
          print("EXPORT_CONTACT_SHEET",base64.b64encode((d/"export-sequence.jpg").read_bytes()).decode())
          PY
          git add -- docs/evidence/river-gate-v1-rc19/
          git add -f -- candidate/River-Gate-RC19-macOS.zip candidate/SHA256SUMS
          git -c user.name='River Gate build evidence' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Archive native camera PNGs, Metal timings and the played export"
          git push origin HEAD:refs/heads/codex/river-rc19-original-windows
