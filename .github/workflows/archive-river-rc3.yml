    steps:
      - uses: actions/checkout@v4
        with:
          path: packer
      - uses: actions/checkout@v4
        with:
          ref: 799e1e41a098bf534b63f699ea6f683e4707306f
          path: game
      - name: Read exact, independent main-run outputs
        working-directory: game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq '[.head_sha,.head_branch,.conclusion]|join(" ")')
          test "$state" = "$VERIFIED_SHA main success"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/receipts/artifacts.json"
          download() { gh run download "$VERIFIED_RUN" -R "$GITHUB_REPOSITORY" -n "$1-$VERIFIED_SHA" -D "$RUNNER_TEMP/receipts/$2"; }
          download verification engineering
          download field-verification field
          download macos-verification mac
          download river-art visual
          download gameplay gameplay
          download Luanshi-macOS package
      - name: Resume a breach save written by the original RC2 game
        working-directory: game
        run: |
          set -euo pipefail
          engine_base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$engine_base/Godot_v4.6.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/rc2-engine.zip"
          echo "a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  $RUNNER_TEMP/rc2-engine.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/rc2-engine.zip" -d "$RUNNER_TEMP/rc2-engine"
          engine="$RUNNER_TEMP/rc2-engine/Godot_v4.6.3-stable_linux.x86_64"
          old=71889537db0d74b9cf6f372d50c830e9e5e32278
          git fetch -q --depth=1 origin "$old"
          for role in previous current; do
            ref="$old"
            if [[ $role == current ]]; then ref="$VERIFIED_SHA"; fi
            mkdir -p "$RUNNER_TEMP/$role-field"
            git archive "$ref" scripts | tar -x -C "$RUNNER_TEMP/$role-field"
            cp tests/field_history_probe.gd "$RUNNER_TEMP/$role-field/probe.gd"
            printf 'config_version=5\n[application]\nconfig/name="River-gate compatibility check"\n' > "$RUNNER_TEMP/$role-field/project.godot"
          done
          export LUANSHI_HISTORY_DIR="$RUNNER_TEMP/previous-field"
          "$engine" --headless --path "$LUANSHI_HISTORY_DIR" --script res://probe.gd -- --write-original --gate-replay
          "$engine" --headless --path "$RUNNER_TEMP/current-field" --script res://probe.gd -- --gate-replay | tee "$RUNNER_TEMP/receipts/rc2-resume.log"
          grep -q '^FIELD_HISTORY_PASS ' "$RUNNER_TEMP/receipts/rc2-resume.log"
      - name: Verify the game ZIP and preserve actual graphics and measurements
        working-directory: game
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'from PIL import Image' || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          /usr/bin/python3 "$GITHUB_WORKSPACE/packer/tools/collect-verified-rc3.py"
          git add docs/evidence/river-gate-v1-rc3
          git config user.name 'Luanshi acceptance archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive the verified RC3 game film, matched live screenshots and raw frame times'
          git push origin HEAD:refs/heads/codex/river-gate-rc3-evidence
