name: Inspect open scanned soil sources
on:
  push:
    branches: [codex/river-gate-painted-landscape-review]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect primary CC0 and capture candidate material samples
        run: |
          set -euo pipefail
          python3 -m pip -q install --target /tmp/river-image-tools Pillow==11.3.0
          export PYTHONPATH=/tmp/river-image-tools
          curl -fsSL --max-time 20 https://polyhaven.com/license -o /tmp/terrain-license
          python3 - <<'PY'
          import re
          s=open('/tmp/terrain-license').read()
          for pattern in ('Creative Commons','CC0','public domain'):
              m=re.search(pattern,s,re.I)
              if m: print('SOURCE_LICENSE',re.sub('<[^>]+>',' ',s[max(0,m.start()-125):m.end()+185]))
          PY
          curl -fsSL -A 'LuanshiGame-MaterialAuthoring (https://github.com/haohongfei2001-png/luanshi-game)' --max-time 20 'https://api.polyhaven.com/assets?t=textures' -o /tmp/terrain-catalog.json
          python3 - <<'PY'
          import json,re,urllib.request,concurrent.futures,base64,io
          from PIL import Image
          catalog=json.load(open('/tmp/terrain-catalog.json'))
          ids=[k for k in catalog if re.search('grass|forest_floor|muddy|rocky_trail|sandy|brown_mud|dirt_floor',k)]
          for stem in ['grass','forest_floor','brown_mud','rocky_trail','sandy','muddy','dirt_floor']:
              print('SOURCE_IDS',stem,[k for k in ids if stem in k][:36])
          chosen=['grass_ground','leafy_grass','sparse_grass','withered_grass','dirt_floor','brown_mud_dry','rocky_trail','sandy_gravel','sandy_gravel_02']
          def public(path):
              req=urllib.request.Request(path,headers={'User-Agent':'LuanshiGame-MaterialAuthoring (https://github.com/haohongfei2001-png/luanshi-game)'})
              try: return urllib.request.urlopen(req,timeout=18).read()
              except urllib.error.HTTPError as exc: raise ValueError((path,exc.status,exc.read(160)))
          def fetch(k):
              try:
                  f=json.loads(public('https://api.polyhaven.com/files/'+k))
                  channel=f.get('Diffuse') or f.get('diff') or f.get('col') or f.get('albedo') or {}
                  if not channel:return k,list(f),None
                  variants=channel.get('1k') or channel.get('2k') or {}
                  imagefile=variants.get('jpg') or variants.get('png')
                  if not imagefile:return k,list(variants),None
                  body=public(imagefile['url'])
                  pic=Image.open(io.BytesIO(body)).convert('RGB');pic.thumbnail((124,124))
                  return k,[imagefile,catalog[k].get('authors'),catalog[k].get('tags')],pic
              except Exception as e:return k,str(e),None
          items=list(concurrent.futures.ThreadPoolExecutor(max_workers=8).map(fetch,chosen))
          from PIL import ImageDraw
          board=Image.new('RGB',(144*5,155*((len(items)+4)//5)),(33,37,34));d=ImageDraw.Draw(board)
          for i,(k,row,pic) in enumerate(items):
              print('SOURCE_FILE',k,json.dumps(row)[:570])
              if pic:board.paste(pic,(i%5*144,i//5*155))
              d.text((i%5*144,i//5*155+125),k,fill=(245,243,229))
          dest=io.BytesIO();board.save(dest,'JPEG',quality=82);print('MATERIAL_BOARD',base64.b64encode(dest.getvalue()).decode())
          PY
