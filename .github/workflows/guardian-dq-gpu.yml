name: Guardian complete DQ cage GPU experiment
on:
  push:
    branches: ['dot/guardian-fold-runtime']
    paths: ['tools/art/sintel_guard/**', '.github/workflows/guardian-dq-gpu.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dq-cage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p evidence
      - name: Official tools and retained isolated patched engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -fsSL https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          curl -fsSL https://download.blender.org/release/Blender4.3/blender-4.3.2.sha256 -o /tmp/blender.sha256
          EXPECTED=$(grep 'blender-4.3.2-linux-x64.tar.xz' /tmp/blender.sha256 | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  /tmp/blender.tar.xz" | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo /tmp/blender-4.3.2-linux-x64 >> "$GITHUB_PATH"
          gh api repos/haohongfei2001-png/luanshi-game/actions/artifacts/14124017040/zip > /tmp/engine.zip
          echo '86a1d627854559bbed35f6a360cea05fac0c9572bb165f1ed43c4984a0979909  /tmp/engine.zip' | sha256sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          echo '16cd16ae2a2f7f5fd9ca18ba9f68a0ef0d043cdfbb3b51df2cec2183def26f5a  /tmp/engine/bin/godot-patched' | sha256sum -c -
          chmod +x /tmp/engine/bin/godot-patched
          cp /tmp/engine/{BUILD_COMMAND,PATCH_SHA256,BINARY_SHA256,patched-version.txt} evidence/
      - name: Rebuild original full source and independent pose oracle
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python tools/art/sintel_guard/fetch_source.py --output /tmp/guardian-source | tee evidence/source.log
          SOURCE=/tmp/guardian-source/guardians_r854/guardian_lao_tseu.blend
          blender -b --disable-autoexec -t 2 --python-exit-code 1 --python tools/art/sintel_guard/cage_coefficients.py -- "$SOURCE" /tmp/response > evidence/response.log 2>&1
          blender -b --disable-autoexec -t 2 --python-exit-code 1 --python tools/art/sintel_guard/fold_runtime_probe.py -- "$SOURCE" /tmp/response/fixed-cage-response.npz /tmp/reference > evidence/cpu.log 2>&1
          cp /tmp/reference/report.json evidence/cpu-report.json
          python -c "import json; assert all(json.load(open('evidence/cpu-report.json'))['gates'].values())"
          blender -b --disable-autoexec -t 2 --python-exit-code 1 --python tools/art/sintel_guard/gpu_fixture.py -- /tmp/reference/complete-cage-runtime-reference.npz /tmp/response/fixed-cage-response.npz /tmp/fixture > evidence/fixture.log 2>&1
          cp /tmp/reference/complete-cage-runtime-reference.npz evidence/
          cp /tmp/response/fixed-cage-response.npz evidence/
      - name: Actual GPU two-stage arithmetic and exact sparse response
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GUARDIAN_GPU_FIXTURE: /tmp/fixture
          GUARDIAN_GPU_OUTPUT: ${{ github.workspace }}/evidence/gpu
        run: |
          set -euo pipefail
          uname -a > evidence/host.txt
          /tmp/engine/bin/godot-patched --version >> evidence/host.txt
          xvfb-run -a -s '-screen 0 1600x900x24' /tmp/engine/bin/godot-patched --path tools/art/sintel_guard/dq_gpu_probe --rendering-method gl_compatibility --audio-driver Dummy > evidence/gpu.log 2>&1
          ! grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' evidence/gpu.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-complete-dq-gpu-${{ github.sha }}
          path: evidence/
          retention-days: 30
