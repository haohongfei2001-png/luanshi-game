name: Diagnose continuous person at unchanged battle pose
on:
  push:
    branches: [codex/river-rc23-hm08-body]
    paths: ['.github/workflows/person-surface-diagnostic.yml','tests/person_surface_diagnostic.gd']
permissions:
  contents: write
concurrency:
  group: costume-codex/river-rc23-hm08-body
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned runtime and known upstream clothing tools
        run: |
          set -eu
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/editor
          sudo install /tmp/editor/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          if ! command -v xdotool >/dev/null || ! command -v ffmpeg >/dev/null || ! /usr/bin/python3 -c 'from PIL import Image'; then sudo apt-get update -qq && sudo apt-get install -y -qq xdotool ffmpeg python3-pil; fi
          ./tools/prepare-font.sh
          mkdir -p artifacts/bridge-window docs/evidence/river-gate-v1-rc23/field-coats
          touch artifacts/.gdignore
          cat >override.cfg <<'CFG'
          [display]
          window/size/window_width_override=2560
          window/size/window_height_override=1600
          CFG
      - name: Inspect the live posed surface under isolated materials
        shell: bash
        run: |
          set -euo pipefail
          proof=docs/evidence/river-gate-v1-rc23/person-surface-diagnostic
          mkdir -p "$proof" artifacts/person-diagnostic
          touch "$proof/.gdignore"
          godot --headless --audio-driver Dummy --editor --path . --import >"$proof/import.log" 2>&1
          timeout 5m xvfb-run -a -s '-screen 0 2560x1600x24' godot --path . --audio-driver Dummy --display-driver x11 --resolution 2560x1600 --disable-vsync --fixed-fps 24 --script tests/person_surface_diagnostic.gd >"$proof/diagnostic.log" 2>&1
          grep PERSON_DIAGNOSTIC "$proof/diagnostic.log"
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/diagnostic.log"; then exit 1; fi
          cp artifacts/person-diagnostic/* "$proof/"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("docs/evidence/river-gate-v1-rc23/person-surface-diagnostic")
          for mode in ("actual","clay","normal","unlit"):
              im=Image.open(p/(mode+".jpg"))
              im.save(p/(mode+"-native-preview.jpg"),quality=78,subsampling=2)
          PY
          git add "$proof"
          git -c user.name='River Gate costume art' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Inspect original live character geometry without colour and without lighting'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Show diagnostic failures
        if: failure()
        run: |
          for log in docs/evidence/river-gate-v1-rc23/person-surface-diagnostic/*.log; do if test -f "$log"; then tail -n 28 "$log"; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: person-material-diagnostic
          path: docs/evidence/river-gate-v1-rc23/person-surface-diagnostic
          retention-days: 7
