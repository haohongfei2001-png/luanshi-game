name: Same-source representation control (not art acceptance)
on:
  push:
    branches: ['dot/character-representation-compare']
    paths: ['tools/representation_compare/**', 'scripts/field/experimental/**', '.github/workflows/representation-control.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controlled-battle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare provenance and official graphics dependencies
        run: |
          mkdir -p evidence
          echo '${{ github.sha }}' > evidence/source-sha.txt
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri fonts-noto-cjk
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc assets/fonts/NotoSansSC-Regular.otf
          sha256sum assets/fonts/NotoSansSC-Regular.otf > evidence/import-font-sha.txt
      - name: Verify retained fixed engine and official importer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/haohongfei2001-png/luanshi-game/actions/artifacts/14124017040/zip > /tmp/engine.zip
          echo '86a1d627854559bbed35f6a360cea05fac0c9572bb165f1ed43c4984a0979909  /tmp/engine.zip' | sha256sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          echo '16cd16ae2a2f7f5fd9ca18ba9f68a0ef0d043cdfbb3b51df2cec2183def26f5a  /tmp/engine/bin/godot-patched' | sha256sum -c -
          chmod +x /tmp/engine/bin/godot-patched
          cp /tmp/engine/{BUILD_COMMAND,PATCH_SHA256,BINARY_SHA256,patched-version.txt} evidence/
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/editor
          chmod +x /tmp/editor/Godot_v4.6.3-stable_linux.x86_64
          /tmp/editor/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . > evidence/import.log 2>&1
      - name: Bake actual Godot full-source 16-direction atlas and exact 8-direction subset
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          COMPARE_ASSETS: ${{ runner.temp }}/control-atlas
        run: |
          set -euo pipefail
          mkdir -p "$COMPARE_ASSETS"
          timeout 1500s xvfb-run -a -s '-screen 0 2560x1440x24' /tmp/engine/bin/godot-patched --path . --resolution 2560x1440 --disable-vsync --rendering-method gl_compatibility --audio-driver Dummy --script tools/representation_compare/bake_control.gd > evidence/bake.log 2>&1
          cp "$COMPARE_ASSETS/atlas.json" evidence/atlas.json
          ! grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' evidence/bake.log
      - name: Independent native-resolution captures and real combat timings
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          COMPARE_ASSETS: ${{ runner.temp }}/control-atlas
        run: |
          set -euo pipefail
          uname -a > evidence/hardware.txt
          lscpu >> evidence/hardware.txt
          for SIZE in 2560x1440 3840x2160; do
            IFS=x read -r W H <<< "$SIZE"
            printf '[display]\nwindow/size/viewport_width=%s\nwindow/size/viewport_height=%s\nwindow/size/window_width_override=%s\nwindow/size/window_height_override=%s\n' "$W" "$H" "$W" "$H" > override.cfg
            for CAMERA in 22 16; do
              for MODE in shared3d sprite8 sprite16 hybrid; do
                OUT="$PWD/evidence/capture-$SIZE-$CAMERA-$MODE"
                COMPARE_MODE=$MODE COMPARE_COUNT=100 COMPARE_CAMERA_SIZE=$CAMERA COMPARE_CAPTURE=1 COMPARE_OUTPUT="$OUT" timeout 180s xvfb-run -a -s "-screen 0 ${SIZE}x24" /tmp/engine/bin/godot-patched --path . --resolution "$SIZE" --disable-vsync --rendering-method gl_compatibility --audio-driver Dummy --script tools/representation_compare/battle_control.gd > "$OUT.log" 2>&1
              done
            done
          done
          printf '[display]\nwindow/size/viewport_width=2560\nwindow/size/viewport_height=1440\nwindow/size/window_width_override=2560\nwindow/size/window_height_override=1440\n' > override.cfg
          for COUNT in 20 100 250 512; do
            for MODE in shared3d sprite8 sprite16 hybrid; do
              OUT="$PWD/evidence/perf-$COUNT-$MODE"
              COMPARE_MODE=$MODE COMPARE_COUNT=$COUNT COMPARE_CAMERA_SIZE=16 COMPARE_CAPTURE=0 COMPARE_OUTPUT="$OUT" timeout 180s xvfb-run -a -s '-screen 0 2560x1440x24' /tmp/engine/bin/godot-patched --path . --resolution 2560x1440 --disable-vsync --rendering-method gl_compatibility --audio-driver Dummy --script tools/representation_compare/battle_control.gd > "$OUT.log" 2>&1
            done
          done
          ! grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' evidence/*.log
          python tools/representation_compare/check_outcomes.py evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representation-control-${{ github.sha }}
          path: evidence/
          retention-days: 30
