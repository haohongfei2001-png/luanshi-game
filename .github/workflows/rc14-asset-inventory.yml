name: Inspect the licensed free author archive for the riverbank
on:
  push:
    branches: ['codex/river-asset-ingest-study']
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inventory actual redistributable meshes and materials
        run: |
          set -euo pipefail
          curl -fsSL --retry 1 'https://store.godotengine.org/asset/quaternius/stylized-nature-megakit/download/31/?source=luanshi-asset-review' -o "$RUNNER_TEMP/nature.zip"
          python3 - "$RUNNER_TEMP/nature.zip" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          print("AUTHOR_ZIP",p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          with zipfile.ZipFile(p) as archive:
              for i in archive.infolist():
                  if i.filename.lower().endswith((".zip",".png",".glb",".gltf",".txt",".md",".blend")):
                      print("AUTHOR_MEMBER",i.filename, i.file_size)
              for i in archive.infolist():
                  if i.filename.lower().endswith(".zip"):
                      import io
                      with zipfile.ZipFile(io.BytesIO(archive.read(i))) as sub:
                          for n in sub.infolist():
                              if n.filename.lower().endswith((".png",".glb",".gltf",".txt",".md")): print("NEST_MEMBER",i.filename,n.filename,n.file_size)
          PY
