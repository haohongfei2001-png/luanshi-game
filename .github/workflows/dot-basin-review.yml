name: Dot complete basin actual camera study
on:
  push:
    branches: ['dot/river-basin-camera-integration']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LUANSHI_AUTHORED_LANDFORM: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43627776697
          name: new-architecture-editable-source
          path: /tmp/verified-architecture
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43627776697
          pattern: reusable-region-derivatives-*
          merge-multiple: true
          path: /tmp/derivative-groups
          github-token: ${{ github.token }}
      - name: Restore only the exact verified runtime assets
        run: |
          set -euo pipefail
          mkdir -p artifacts/basin-study assets/river_authored/architecture
          touch artifacts/.gdignore
          python tools/bounded_artifact_groups.py restore /tmp/derivative-groups /tmp/restored
          cp /tmp/verified-architecture/architecture.glb assets/river_authored/architecture/
          echo '9590b664efb4316d1374c79f517d4f52e6b1a17d5a04a5eaa220fd4a021f4692  assets/river_authored/architecture/architecture.glb' | sha256sum -c -
          echo '8a87880eadd3448bbc4c5fdd5c9a29e9304ba098db83c32f14eb1d34dade1513  /tmp/restored/assets/river_authored/ground/continuous-region.scn' | sha256sum -c -
          echo '9ba916f6270af9264aa5ca24c5b4da28cb6057be568585464ac3be0b85b5e10f  /tmp/restored/assets/river_authored/woodland/region.scn' | sha256sum -c -
          cp /tmp/restored/recovery-source.json artifacts/basin-study/
      - name: Install unchanged official Godot and display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz || curl -fLsS --retry 2 https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
          ./tools/prepare-font.sh
          { uname -a; lscpu; free -m; godot --version; } >artifacts/basin-study/host.txt
          godot --headless --editor --path . --import >artifacts/basin-study/import.log 2>&1
          if grep -E "SCRIPT ERROR|SHADER ERROR|ERROR:" artifacts/basin-study/import.log; then exit 1; fi
      - name: Build new native woodland and low-grass sources once
        run: |
          set -euo pipefail
          python tools/art/gate_structure/check_evidence_dependencies.py --workflow .github/workflows/dot-basin-review.yml >artifacts/basin-study/preflight.json
          python tools/art/gate_structure/fetch_sprite_source.py /tmp/luanshi-sprite >artifacts/basin-study/source-fetch.log 2>&1
          SOURCE_ROOT=$(cat /tmp/luanshi-sprite/source-root.txt)
          BLENDER=/tmp/blender-4.3.2-linux-x64/blender
          $BLENDER -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python tools/art/sprite_source/author_field_oak.py -- "$SOURCE_ROOT" /tmp/field-oak .20 96 1.0 >artifacts/basin-study/tree-author.log 2>&1
          $BLENDER -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python tools/art/sprite_source/bake_reusable_collection.py -- /tmp/field-oak/field-oak-source-study.blend FIELD-oak-source-study-01 /tmp/field-oak/realtime tools/art/sprite_source/field_oak_lod_study.json >artifacts/basin-study/tree-bake.log 2>&1
          $BLENDER -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python tools/art/sprite_source/author_low_grass_source.py -- "$SOURCE_ROOT" /tmp/low-grass >artifacts/basin-study/grass-author.log 2>&1
          $BLENDER -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python tools/art/sprite_source/bake_reusable_collection.py -- /tmp/low-grass/low-grass-source.blend FIELD-five-blade-low-grass /tmp/low-grass/realtime tools/art/sprite_source/low_grass_lod_study.json >artifacts/basin-study/grass-bake.log 2>&1
      - name: Assemble the entire version-matched basin
        run: |
          set -euo pipefail
          python tools/art/continuous_landform/fetch_earth.py /tmp/earth-source >artifacts/basin-study/earth-source.log 2>&1
          mkdir -p assets/river_authored/ground assets/river_authored/woodland assets/river_authored/shore assets/river_authored/grass
          godot --headless --path . --script tools/art/continuous_landform/build_region.gd -- assets/river_authored/ground/continuous-region.scn /tmp/earth-source >artifacts/basin-study/terrain-build.log 2>&1
          godot --headless --path . --script tools/art/continuous_landform/build_native_shore.gd -- assets/river_authored/shore/region.scn >artifacts/basin-study/shore-build.log 2>&1
          godot --headless --path . --script tools/art/continuous_landform/build_grass_shoulders.gd -- /tmp/low-grass/realtime/derived.glb assets/river_authored/grass/region.scn >artifacts/basin-study/grass-build.log 2>&1
          godot --headless --path . --script tools/art/sprite_source/assemble_woodland_region.gd -- /tmp/field-oak/realtime/derived.glb /tmp/restored/bush/derived-EN-bush.01.glb assets/river_authored/woodland/region.scn >artifacts/basin-study/woodland-build.log 2>&1
          for test in continuous_landform_mesh earth_material surveyed_water_depth; do python tools/art/gate_structure/run_capture_checked.py artifacts/basin-study/$test.log 100 -- godot --headless --path . --script tests/art_reset/$test.gd -- assets/river_authored/ground/continuous-region.scn; done
          python tools/art/gate_structure/run_capture_checked.py artifacts/basin-study/grass-support.log 100 -- godot --headless --path . --script tests/art_reset/grass_shoulder_support.gd -- assets/river_authored/grass/region.scn
          godot --headless --editor --path . --import >artifacts/basin-study/assembled-import.log 2>&1
          if grep -E "SCRIPT ERROR|SHADER ERROR|ERROR:" artifacts/basin-study/*build.log artifacts/basin-study/assembled-import.log; then exit 1; fi
      - name: Preserve all successfully generated runtime and editable derivatives
        if: always()
        run: python tools/art/gate_structure/preserve_basin_assets.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/basin-groups/group-00/**') != '' }}
        with:
          name: basin-recovery-00
          path: artifacts/basin-groups/group-00
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/basin-groups/group-01/**') != '' }}
        with:
          name: basin-recovery-01
          path: artifacts/basin-groups/group-01
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/basin-groups/group-02/**') != '' }}
        with:
          name: basin-recovery-02
          path: artifacts/basin-groups/group-02
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/basin-groups/group-03/**') != '' }}
        with:
          name: basin-recovery-03
          path: artifacts/basin-groups/group-03
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/basin-groups/group-04/**') != '' }}
        with:
          name: basin-recovery-04
          path: artifacts/basin-groups/group-04
          retention-days: 30
          if-no-files-found: error
      - name: Verify the actual new camera scene before graphics
        run: |
          set -euo pipefail
          python tools/art/gate_structure/check_evidence_dependencies.py --require-generated --workflow .github/workflows/dot-basin-review.yml >artifacts/basin-study/dependencies.json
          python tools/art/gate_structure/run_capture_checked.py artifacts/basin-study/setup.log 100 -- godot --headless --path . --script tests/authored_architecture_capture.gd -- --camera-study --basin-study --validate-pairs
          python tools/art/gate_structure/run_capture_checked.py artifacts/basin-study/camera-contract.log 90 -- godot --headless --path . --script tests/review_camera_contract.gd
      - name: Verify actual GPU grass instance transforms
        run: python tools/art/gate_structure/run_capture_checked.py artifacts/basin-study/grass-gpu.log 90 -- xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/art_reset/grass_gpu_layout.gd -- assets/river_authored/grass/region.scn
      - name: Capture the complete basin in actual Godot
        env:
          ARCHITECTURE_CAPTURE_OUT: ${{ github.workspace }}/artifacts/basin-study/pixels
        run: |
          set -euo pipefail
          export CONTROLLER_BLOB=$(git hash-object scripts/field/controller.gd)
          python tools/art/gate_structure/run_capture_checked.py artifacts/basin-study/graphics.log 300 -- xvfb-run -a -s '-screen 0 3840x2160x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/authored_architecture_capture.gd -- --camera-study --basin-study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-basin-camera-evidence
          path: artifacts/basin-study
          retention-days: 30
          if-no-files-found: error
