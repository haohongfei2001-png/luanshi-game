name: Dot HF08 complete mother native capture (internal not art acceptance)
on:
  workflow_dispatch:
  push:
    branches: ['dot/production-v2-native-run']
permissions:
  contents: read
  actions: read
concurrency:
  group: dot-production-v2-native
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      LUANSHI_PRODUCTION_V2: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse unready transport; verify exact existing source artifact
        id: inputs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const input=JSON.parse(fs.readFileSync('tools/production_v2/native_input_artifact.json','utf8'));
            if(input.status!=='READY_EXACT_EXISTING_ARTIFACT' || input.mother_run_id<=0 || input.mother_artifact_id<=0 || input.actor_license_original_bytes!=='VERIFIED') throw new Error('Frozen mother transport or original actor license bytes not ready; do not run graphics');
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:input.mother_run_id})).data;
            if(run.status!=='completed'||run.conclusion!=='success'||run.repository.full_name!==`${context.repo.owner}/${context.repo.repo}`) throw new Error('Unexpected source run');
            const artifact=(await github.rest.actions.getArtifact({...context.repo,artifact_id:input.mother_artifact_id})).data;
            if(artifact.expired||artifact.name!==input.mother_artifact_name||artifact.workflow_run.id!==input.mother_run_id) throw new Error('Unexpected exact source artifact');
            core.setOutput('run',input.mother_run_id);core.setOutput('artifact',input.mother_artifact_name);core.setOutput('actor_ref',input.actor_source_ref);
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.artifact }}
          run-id: ${{ steps.inputs.outputs.run }}
          github-token: ${{ github.token }}
          path: .pipeline/mother-input
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.actor_ref }}
          path: .pipeline/actor-source
          sparse-checkout: experiments/environment25d/assets
          persist-credentials: false
      - name: Restore exact current mother and original source18 only
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-native .pipeline
          touch artifacts/.gdignore .pipeline/.gdignore
          python3 tools/production_v2/prepare_native_inputs.py "$PWD" .pipeline/mother-input/production-v2-valley-hf08-runtime-input.zip .pipeline/actor-source/experiments/environment25d/assets > artifacts/production-native/source-restoration.json
          ./tools/prepare-font.sh
          python3 tests/production_v2_native_tools_test.py
      - name: Install verified official import editor and encoder
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip -o "$RUNNER_TEMP/editor.zip"
          echo "0155bbc8dcf179edab4ef08e3dbbd4480d7434ab1990cb3fb25517d453b1b65787c7fe6dfc8824b15ff25e1fdcec59e8584f765054106894fee00311868c3964  $RUNNER_TEMP/editor.zip" | shasum -a 512 -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/editor"
          echo "GODOT_EDITOR=$RUNNER_TEMP/editor/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          { uname -a; sw_vers; system_profiler SPHardwareDataType SPDisplaysDataType; } > artifacts/production-native/hardware.txt
      - name: Import exact source on this Mac and validate native entry
        run: |
          set -euo pipefail
          python3 tools/art/gate_structure/run_capture_checked.py artifacts/production-native/import.log 240 -- "$GODOT_EDITOR" --headless --editor --path . --import
          python3 tools/art/gate_structure/run_capture_checked.py artifacts/production-native/entry-parse.log 60 -- "$GODOT_EDITOR" --headless --path . --check-only --script scripts/review/production_v2_native_capture.gd
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: patch
          key: macos-arm64-godot-35e80b3-angle-7578-mobile-mutex-v1
      - uses: actions/download-artifact@v4
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          name: mobile-mutex-angle-template
          path: patch
          run-id: '43580708251'
          github-token: ${{ github.token }}
      - name: Export protected normal MainLoop and verify in empty cwd
        run: python3 tools/production_v2/export_native_pack.py "$GODOT_EDITOR" "$PWD" "$PWD/patch" "$PWD/artifacts/production-native"
      - name: Actual native Metal stills and normal physics input
        run: |
          set -euo pipefail
          clang -fobjc-arc -framework AppKit -o "$RUNNER_TEMP/production-focus" tools/macos_probe_focus.m
          chmod +x patch/godot.macos.template_release.arm64
          python3 tools/production_v2/run_native.py "$PWD" "$PWD/patch" "$PWD/artifacts/production-native" "$RUNNER_TEMP/production-focus"
          python3 tools/production_v2/validate_native.py artifacts/production-native/pixels --material-control > artifacts/production-native/native-integrity.json
      - name: Preserve real wall-clock movie, including missing-action failures
        if: always()
        run: |
          set -euo pipefail
          RAW=artifacts/production-native/pixels/action
          if [ ! -f "$RAW/frames.jsonl" ]; then echo 'GRAPHICS_OR_RECORDING_NOT_RUN'; exit 0; fi
          python3 tools/encode_wall_clock_capture.py "$RAW" "$RAW/normal-speed.mp4" > "$RAW/encode.log"
      - name: Preserve hashes of every original frame even if encoding failed
        if: always()
        run: python3 tools/production_v2/hash_original_evidence.py artifacts/production-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-native-hf08-${{ github.sha }}
          path: |
            artifacts/production-native/
          if-no-files-found: warn
          retention-days: 30
