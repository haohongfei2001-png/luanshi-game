name: Verify the isolated corpse grounding in actual game frames
on:
  push:
    branches: [codex/river-rc23-ground-contact]
    paths: ['tests/ground_contact_film.gd','.github/workflows/ground-contact-film.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: clean-ground-contact-film
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grounded-equipment-original-speed
          run-id: 43575555706
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/recorded-ground-contact
      - name: Install pinned Godot and reuse the identical baseline recording
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdotool ffmpeg python3-pil
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/editor
          sudo install /tmp/editor/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          proof=docs/evidence/river-gate-v1-rc23/ground-contact/movie
          prior=/tmp/recorded-ground-contact/docs/evidence/river-gate-v1-rc23/native-combat/grounded-equipment
          test -f "$prior/before.json"
          mkdir -p artifacts/grounded-equipment-film "$proof"
          cp -R "$prior"/before* "$proof/"
          touch artifacts/.gdignore docs/evidence/river-gate-v1-rc23/ground-contact/.gdignore
          cat >override.cfg <<'CFG'
          [display]
          window/size/window_width_override=2560
          window/size/window_height_override=1600
          CFG
      - name: Record the clean production palette at the original simulation rate
        shell: bash
        run: |
          set -euo pipefail
          proof=docs/evidence/river-gate-v1-rc23/ground-contact/movie
          sha256sum assets/river_gate/figures/company_motion.png scripts/field/company_skin.gdshader > "$proof/after-runtime-sha256.txt"
          godot --headless --audio-driver Dummy --editor --path . --import > "$proof/after-import.log" 2>&1
          if grep -n -C3 -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/after-import.log"; then exit 1; fi
          timeout 10m xvfb-run -a -s '-screen 0 2560x1600x24' godot --path . --audio-driver Dummy --display-driver x11 --resolution 2560x1600 --disable-vsync --fixed-fps 20 --script tests/ground_contact_film.gd > "$proof/after.log" 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$proof/after.log"; then exit 1; fi
          grep GROUNDED_EQUIPMENT_MOTION "$proof/after.log"
          cp artifacts/grounded-equipment-film/sequence.json "$proof/after.json"
          mkdir -p "$proof/after"
          cp artifacts/grounded-equipment-film/side-*.jpg artifacts/grounded-equipment-film/back-*.jpg artifacts/grounded-equipment-film/seated-*.jpg "$proof/after/"
          ffmpeg -v error -y -framerate 20 -i "artifacts/grounded-equipment-film/normal/frame-%03d.jpg" -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p -movflags +faststart "$proof/after-normal.mp4"
          ffprobe -v error -count_frames -show_entries stream=width,height,r_frame_rate,nb_read_frames,duration -of json "$proof/after-normal.mp4" > "$proof/after-normal-stream.json"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,os
          p=Path("docs/evidence/river-gate-v1-rc23/ground-contact/movie")
          frames=(0,4,8,12,18,31)
          sheet=Image.new("RGB",(1280,1200))
          for n,k in enumerate(frames):
              im=Image.open(Path("artifacts/grounded-equipment-film/normal")/f"frame-{k:03d}.jpg").convert("RGB")
              assert im.size==(2560,1600)
              im.save(p/f"after-normal-{k:03d}-native.jpg",quality=78,subsampling=2)
              sheet.paste(im.resize((640,400),Image.Resampling.LANCZOS),((n%2)*640,(n//2)*400))
          sheet.save(p/"after-normal-times.jpg",quality=86)
          for side in ("before","after"):
              sheet=Image.new("RGB",(1280,1200))
              for n,k in enumerate((44,48,52,56,62,75)):
                  im=Image.open(p/side/f"side-{k:03d}.jpg").convert("RGB")
                  assert im.size==(2560,1600)
                  sheet.paste(im.resize((640,400),Image.Resampling.LANCZOS),((n%2)*640,(n//2)*400))
              sheet.save(p/f"{side}-side-times.jpg",quality=86)
          a=json.loads((p/"before.json").read_text())
          b=json.loads((p/"after.json").read_text())
          assert a==b,(a,b)
          assert [x["tick"] for x in a["index"]]==list(range(44,76))
          assert a["index"][0]["hp"]>0 and a["index"][-1]["hp"]==0 and a["index"][-1]["timer"]==0
          assert all(x["scale"]==1. and x["ordinary"]==[512,512] for x in a["index"])
          assert any(x["state"]==7 and x["timer"]>0 for x in a["index"])
          for path in p.glob("*-stream.json"):
              stream=json.loads(path.read_text())["streams"][0]
              assert (stream["width"],stream["height"],int(stream["nb_read_frames"]))==(2560,1600,32)
              assert stream["r_frame_rate"]=="20/1"
          (p/"verification.json").write_text(json.dumps({
              "physics_sequences_equal":True,"consecutive_steps":32,"fps":20,"duration":1.6,
              "dimensions":[2560,1600],"realtime_performance_measurement":False,"casualty":80,"death_tick":48,
              "before_source":"aa6623fab538de37cfb92ff18f0c37bb5e443e93",
              "before_run":43575555706,"before_artifact":14106546372,
              "after_source":os.environ["GITHUB_SHA"],"mounted_sample":a["mounted"],
              "mounted_officers_in_this_roster":a["mounted_officers_in_this_roster"]
          },indent=2)+"\n")
          PY
          git diff --exit-code -- assets/river_gate/figures/company_motion.png scripts/field/company_skin.gdshader
          sha256sum "$proof"/*.mp4 > "$proof/video-sha256.txt"
          git add "$proof"
          git -c user.name='River Gate corpse grounding proof' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive isolated corpse grounding at the original game speed'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve actual errors
        if: failure()
        run: find docs/evidence/river-gate-v1-rc23/ground-contact -name '*.log' -exec tail -n 100 '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-ground-contact-original-speed
          path: |
            docs/evidence/river-gate-v1-rc23/ground-contact
            artifacts/grounded-equipment-film
          retention-days: 7
