name: Integrate and play the whole replacement battlefield
on:
  push:
    branches: ['codex/river-whole-rebuild']
    paths: ['scripts/field/river_master*','scripts/field/controller.gd','tools/art/import_ground_masters.py','tools/art/build_river_architecture.py','tools/art/source/river_architecture.json','.github/workflows/whole-rebuild.yml']
permissions:
  contents: write
  actions: write
jobs:
  playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Stop the superseded invalid-index render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/haohongfei2001-png/luanshi-game/actions/runs/43553508581/cancel || true
      - name: Prepare the ground and complete gate library
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil python3-numpy xdotool
          mkdir -p "$RUNNER_TEMP/art-sources" artifacts/world-rebuild
          touch artifacts/.gdignore
          python3 tools/art/import_ground_masters.py "$RUNNER_TEMP/art-sources"
          python3 tools/art/build_river_architecture.py "$RUNNER_TEMP/art-sources"
          git add assets/river_gate/world/ground assets/river_gate/world/architecture
          git -c user.name='River Gate world authoring' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake native ground surfaces and the complete gate leaf bind geometry' || test -z "$(git status --porcelain assets/river_gate/world)"
          git push origin HEAD:refs/heads/codex/river-whole-rebuild
      - name: Import the actual Godot game
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 2 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/g
          ./tools/prepare-font.sh
          /tmp/g/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import > artifacts/world-rebuild/import.log 2>&1
          if grep -E 'ERROR:|Parse Error|SHADER ERROR' artifacts/world-rebuild/import.log; then exit 1; fi
          /tmp/g/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/field_bridgehead.gd > artifacts/world-rebuild/bridgehead.log 2>&1
          cat artifacts/world-rebuild/bridgehead.log
      - name: Render the rebuilt full scene before its continuous-input run
        run: |
          set -euo pipefail
          printf '[display]\\nwindow/size/window_width_override=2560\\nwindow/size/window_height_override=1440\\n' > override.cfg
          timeout 480s xvfb-run -a -s "-screen 0 2560x1440x24" /tmp/g/Godot_v4.6.3-stable_linux.x86_64 --path . --display-driver x11 --resolution 2560x1440 --audio-driver Dummy --script tests/world_master_review.gd > artifacts/world-rebuild/stills.log 2>&1 || { cat artifacts/world-rebuild/stills.log; exit 1; }
          cat artifacts/world-rebuild/stills.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/world-rebuild/stills.log; then exit 1; fi
          git add docs/evidence/river-whole-rebuild/review
          git -c user.name='River Gate visual verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve full-map and reference-camera actual game frames for review'
          git push origin HEAD:refs/heads/codex/river-whole-rebuild
      - name: Play the complete replacement map through the normal bridgehead menu
        run: |
          set -euo pipefail
          dst=docs/evidence/river-whole-rebuild/2560x1440
          mkdir -p "$dst"
          printf '[display]\nwindow/size/window_width_override=2560\nwindow/size/window_height_override=1440\n' > override.cfg
          timeout 1800s xvfb-run -a -s "-screen 0 2560x1440x24" /tmp/g/Godot_v4.6.3-stable_linux.x86_64 --path . --display-driver x11 --resolution 2560x1440 --audio-driver Dummy --disable-vsync --fixed-fps 24 --script tests/bridgehead_window.gd -- --bridge-stills --native-plates > "$dst/window.log" 2>&1 || { tail -c 6000 "$dst/window.log"; exit 1; }
          grep -F 'BRIDGE_WINDOW true' "$dst/window.log"
          cp artifacts/bridge-window/input-and-camera.json artifacts/bridge-window/view-0050.png artifacts/bridge-window/view-0145.png "$dst/"
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          from PIL import Image
          dst=Path("docs/evidence/river-whole-rebuild/2560x1440")
          src=Path("artifacts/bridge-window")
          data=json.loads((dst/"input-and-camera.json").read_bytes())
          assert data["internal"]==1. and data["ordinary"]==[512,512] and not data["different_lens"]
          for name in ("view-0050.jpg","view-0105.jpg","view-0145.jpg"):
              im=Image.open(src/name)
              assert im.size==(2560,1440),im.size
              shutil.copyfile(src/name,dst/name)
              im.thumbnail((1500,844));im.save(dst/(Path(name).stem+"-preview.jpg"),quality=93,subsampling=0)
          print("WHOLE_WORLD_INPUT_REPLAY",data["last"],"Art acceptance remains pending self-review and owner review.")
          PY
          git add "$dst"
          git -c user.name='River Gate visual verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record native QHD gameplay of the whole replacement map at the reference camera'
          git push origin HEAD:refs/heads/codex/river-whole-rebuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-battlefield-first-play
          path: |
            docs/evidence/river-whole-rebuild/
            artifacts/world-rebuild/
            artifacts/bridge-window/
