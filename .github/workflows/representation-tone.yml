name: One-pose HDR headroom diagnostic (not art acceptance)
on:
  push:
    branches: ['dot/representation-tone-probe']
    paths: ['tools/representation_compare/**', 'scripts/field/experimental/**', '.github/workflows/representation-tone.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controlled-battle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare provenance and official graphics dependencies
        run: |
          mkdir -p evidence
          echo '${{ github.sha }}' > evidence/source-sha.txt
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri fonts-noto-cjk
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc assets/fonts/NotoSansSC-Regular.otf
          sha256sum assets/fonts/NotoSansSC-Regular.otf > evidence/import-font-sha.txt
      - name: Verify retained fixed engine and official importer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/haohongfei2001-png/luanshi-game/actions/artifacts/14124017040/zip > /tmp/engine.zip
          echo '86a1d627854559bbed35f6a360cea05fac0c9572bb165f1ed43c4984a0979909  /tmp/engine.zip' | sha256sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          echo '16cd16ae2a2f7f5fd9ca18ba9f68a0ef0d043cdfbb3b51df2cec2183def26f5a  /tmp/engine/bin/godot-patched' | sha256sum -c -
          chmod +x /tmp/engine/bin/godot-patched
          cp /tmp/engine/{BUILD_COMMAND,PATCH_SHA256,BINARY_SHA256,patched-version.txt} evidence/
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/editor
          chmod +x /tmp/editor/Godot_v4.6.3-stable_linux.x86_64
          /tmp/editor/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . > evidence/import.log 2>&1
      - name: Single-pose actual GPU tone recovery diagnostic
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TONEMAP_OUTPUT: ${{ github.workspace }}/evidence/tonemap
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/engine/bin/godot-patched --path . --resolution 1280x720 --disable-vsync --rendering-method gl_compatibility --audio-driver Dummy --script tools/representation_compare/tonemap_probe.gd > evidence/tonemap.log 2>&1
          python tools/representation_compare/assert_clean_logs.py evidence/tonemap.log
          test -s evidence/tonemap/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representation-tone-${{ github.sha }}
          path: evidence/
          retention-days: 30
