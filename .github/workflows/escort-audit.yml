name: Play both escort deliveries in the Godot window
on:
  push:
    branches: [codex/river-gate-escort-window-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  doorway:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Install the repository-pinned Godot 4.6.3 editor
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/river-editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/river-editor.zip' | sha512sum -c -
          unzip -q /tmp/river-editor.zip -d /tmp/river-editor
          sudo install /tmp/river-editor/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          godot --headless --editor --import --path .
      - name: Play the default and vanguard-first convoy through the real muster and camp
        run: |
          set -euo pipefail
          if ! command -v xdotool >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xdotool; fi
          mkdir -p artifacts
          touch artifacts/.gdignore
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 180s xvfb-run -a -s "-screen 0 960x600x24" godot --path . --resolution 960x600 --disable-vsync --audio-driver Dummy --fixed-fps 10 --script tests/field_escort_gui.gd -- --field-size=512 2>&1 | tee /tmp/river-escort-audit.log
          grep -q "^FIELD_ESCORT_GUI_PASS" /tmp/river-escort-audit.log
          if grep -Eq "SCRIPT ERROR|SHADER ERROR|ERROR:" /tmp/river-escort-audit.log; then exit 1; fi
