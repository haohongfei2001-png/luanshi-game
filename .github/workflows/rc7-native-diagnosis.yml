name: Diagnose default Metal startup on an exported candidate
on:
  push:
    branches: ['codex/river-rc7-native-startup-diagnosis']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verified editor and macOS templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo 'da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68  /tmp/templates.tpz' | sha512sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/macos.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Import game and build the native diagnostics package
        run: |
          set -euo pipefail
          ./tools/prepare-font.sh
          mkdir -p builds
          godot --headless --editor --path . --import > /tmp/import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/import.log; then exit 1; fi
          godot --headless --path . --export-release macOS builds/Luanshi-macOS.zip >/tmp/export.log 2>&1
          test -s builds/Luanshi-macOS.zip
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/export.log; then exit 1; fi
          sha256sum builds/Luanshi-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostic-app
          path: builds/Luanshi-macOS.zip
  native:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: startup-diagnostic-app
          path: package
      - name: Two natural cold launches and a deliberate pre-tick foreground interruption
        run: |
          set -euo pipefail
          mkdir -p proof
          sw_vers | tee proof/host.txt
          ditto -x -k package/Luanshi-macOS.zip package/unpacked
          app=$(find package/unpacked -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict "$app"
          python3 tools/rc3_native_probe.py package/Luanshi-macOS.zip package/unpacked proof --startup-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-focus-run
          path: proof/
