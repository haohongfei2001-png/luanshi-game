name: Compare the licensed broadleaf meshes in the playable River Gate
on:
  push:
    branches: ['codex/river-licensed-grove-workshop']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import the artist's glTF meshes through Blender
        run: |
          set -euo pipefail
          curl -fsSL --retry 1 'https://store.godotengine.org/asset/quaternius/stylized-nature-megakit/download/31/?source=luanshi-asset-review' -o "$RUNNER_TEMP/nature.zip"
          sudo apt-get update -qq
          sudo apt-get install -qq -y blender python3-numpy python3-pil
          PYTHONPATH=/usr/lib/python3/dist-packages blender --python-use-system-env -b --factory-startup --python-exit-code 7 --python tools/art/import_valley_grove.py -- "$RUNNER_TEMP/nature.zip" assets/environment/quaternius
          mkdir -p proof/author-meshes
          cp assets/environment/quaternius/{grove.glb,bark.png,leaves.png,License_Standard.txt,sources.json} proof/author-meshes/
          /usr/bin/python3 - <<'PY'
          import json, struct
          from PIL import Image
          from pathlib import Path
          root=Path("proof/author-meshes")
          im=Image.open(root/"leaves.png").convert("RGBA")
          print("AUTHOR_LEAF_ALPHA",im.size,im.getchannel("A").getextrema())
          assert im.getchannel("A").getextrema()==(0,255), "Missing cutout on artist's leaf texture"
          data=(root/"grove.glb").read_bytes()
          n=struct.unpack_from("<I",data,12)[0]
          g=json.loads(data[20:20+n])
          for mesh in g["meshes"]:
              attrs=mesh["primitives"][0]["attributes"]
              assert "TEXCOORD_1" in attrs, (mesh["name"],attrs)
          PY
      - name: Replay the same input on the package source and the imported grove
        run: |

          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/engine.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/engine.zip' | sha512sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          g=/tmp/engine/Godot_v4.6.3-stable_linux.x86_64
          mkdir -p proof
          node tools/env_cartway.mjs --check
          node tools/art/bake_mounts.mjs --check
          node tools/env_survey.mjs --check
          ./tools/prepare-font.sh
          for side in before after; do
            rev=HEAD
            if [[ $side == before ]]; then rev=5174644f92908a887f4e2ba8d92077af26d5d263; fi
            root=/tmp/river-road-$side
            mkdir -p "$root"
            git archive "$rev" | tar -x -C "$root"
            if [[ $side == after ]]; then cp -a assets/environment/quaternius "$root/assets/environment/"; fi
            cp -a assets/fonts/. "$root/assets/fonts/"
            cp tests/valley_colour_study.gd "$root/tests/"
            "$g" --headless --editor --path "$root" --import >"proof/$side-import.log" 2>&1
            if grep -E -A3 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side-import.log"; then "$g" --headless --path "$root" --check-only --script scripts/field/env_foothills.gd; exit 1; fi
            xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script tests/rc7_personal_contact.gd -- --field-size=512 2>&1 | tee "proof/$side.log"
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side.log"; then exit 1; fi
            grep -q '^RC7_PERSONAL_PASS' "proof/$side.log"
            mv "$root/artifacts/personal-contact" "proof/$side"
            xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script tests/valley_colour_study.gd -- --field-size=512 2>&1 | tee "proof/$side-terrain.log"
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side-terrain.log"; then exit 1; fi
            grep -q "^VALLEY_PASS" "proof/$side-terrain.log"
            mv "$root/artifacts/river-art" "proof/$side/valley"
          done
          python3 -c 'from PIL import Image' || python3 -m pip install --user Pillow
          python3 tools/valley_picture_study.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-valley-game-windows
          path: proof/
          retention-days: 14
