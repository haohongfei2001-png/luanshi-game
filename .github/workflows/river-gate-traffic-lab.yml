name: River gate traffic replay
on:
  push:
    branches: [codex/river-gate-lane-lab]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install the verified Godot binary
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Apply the integration points only in this runner checkout
        run: |
          set -euo pipefail
          cp scripts/field/formation_traffic.gd tests/field_traffic.gd tests/field_traffic_capture.gd /tmp/
          git fetch --no-tags --depth=1 origin aa517095c9c92c46630866f90af7e4bb8c3b3440
          git archive FETCH_HEAD | tar -x
          cp /tmp/formation_traffic.gd scripts/field/
          cp /tmp/field_traffic.gd /tmp/field_traffic_capture.gd tests/
          python3 .github/traffic-lab-hooks.py
      - name: Compare a full siege with and without formation traffic
        run: |
          set -euo pipefail
          mkdir -p artifacts
          touch artifacts/.gdignore
          godot --headless --version
          ./tools/prepare-font.sh
          godot --headless --path . --editor --import > /tmp/traffic-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/traffic-import.log; then exit 1; fi
          timeout 4m godot --headless --path . --script tests/field_traffic.gd 2>&1 | tee artifacts/formation-traffic.log
          grep -q '^FIELD_TRAFFIC_PASS' artifacts/formation-traffic.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/formation-traffic.log; then exit 1; fi
      - name: Record matched gate approaches in the actual rendered game
        if: always() && !cancelled()
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          timeout 145s xvfb-run -a -s '-screen 0 960x600x24' godot --path . --resolution 960x600 --disable-vsync --audio-driver Dummy --fixed-fps 20 --script tests/field_traffic_capture.gd -- --field-size=512 2>&1 | tee artifacts/formation-traffic-camera.log
          grep -q '^FIELD_TRAFFIC_CAMERA_PASS' artifacts/formation-traffic-camera.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/formation-traffic-camera.log; then exit 1; fi
          ffmpeg -nostdin -v error -y -framerate 10 -i artifacts/formation-traffic/original/frame-%03d.jpg -framerate 10 -i artifacts/formation-traffic/with-lanes/frame-%03d.jpg -filter_complex "[0:v][1:v]hstack=inputs=2,drawtext=text='Original':x=12:y=h-th-12:fontsize=22:fontcolor=white:box=1:boxcolor=black@0.65,drawtext=text='Formation lanes':x=w/2+12:y=h-th-12:fontsize=22:fontcolor=white:box=1:boxcolor=black@0.65" -c:v libx264 -crf 21 -preset veryfast -pix_fmt yuv420p -movflags +faststart artifacts/formation-traffic-comparison.mp4
          ffmpeg -nostdin -v error -y -ss 5 -i artifacts/formation-traffic-comparison.mp4 -frames:v 1 -q:v 2 artifacts/formation-traffic-comparison.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-gate-traffic-evidence
          path: |
            artifacts/formation-traffic.log
            artifacts/formation-traffic-camera.log
            artifacts/formation-traffic-comparison.mp4
            artifacts/formation-traffic-comparison.jpg
