name: Inspect the archived playable frame sheet
on:
  push:
    branches: [codex/river-gate-lane-lab]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35dfb086ddf3048b973aaf58b9cc66ed134c7b69
      - name: Read the existing JPEG for visual inspection
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          path = pathlib.Path("docs/evidence/river-gate-formation-traffic/soft-density/traffic-review-sheet.jpg")
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == "89924e852e178bfa03b42edfa5ae3360316b07766f6bff691b6bde07bab1c262"
          encoded = base64.b64encode(data).decode("ascii")
          for index in range(0, len(encoded), 1800):
              print("SHEET_BYTES", encoded[index:index+1800])
          PY
