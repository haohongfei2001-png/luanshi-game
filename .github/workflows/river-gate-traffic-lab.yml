name: Inspect paired river gate footage
on:
  push:
    branches: [codex/river-gate-lane-lab]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: river-gate-traffic-evidence
          run-id: 43119328109
          github-token: ${{ github.token }}
          path: evidence
      - name: Extract three matched frames from the existing capture
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -nostdin -v error -i evidence/formation-traffic-comparison.mp4 -frames:v 1 -vf "select='eq(n,0)+eq(n,48)+eq(n,88)',scale=1440:-2,tile=1x3" -q:v 3 evidence/traffic-review-sheet.jpg
          python3 - <<'PY'
          import base64, hashlib, pathlib
          p = pathlib.Path("evidence/traffic-review-sheet.jpg")
          data = p.read_bytes()
          print("SHEET_SHA256", hashlib.sha256(data).hexdigest(), len(data))
          encoded = base64.b64encode(data).decode("ascii")
          for i in range(0, len(encoded), 1800):
              print("SHEET_BYTES", encoded[i:i+1800])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: river-gate-reviewed-frames
          path: evidence/traffic-review-sheet.jpg
