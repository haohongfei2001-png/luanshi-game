name: Rebuild licensed river pass and capture the actual game
on:
  push:
    branches: ['dot/river-pass-seed']
    paths: ['.github/workflows/dot-river-pass-seed.yml', 'tools/art/source_rebuild/**']
permissions:
  contents: write
concurrency:
  group: dot-river-pass-first-source
  cancel-in-progress: false
jobs:
  build-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to overwrite any existing integration branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/dot/river-pass-integration >/tmp/existing-pass-ref; then
            echo 'Integration branch already exists; refusing overwrite.'; exit 1
          else
            result=$?; test "$result" = 2 || exit "$result"
          fi
      - name: Install checksum-pinned official Godot and Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          mkdir -p artifacts/pass-rebuild
          touch artifacts/.gdignore
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
          ./tools/prepare-font.sh
          { uname -a; lscpu; free -m; godot --version; /tmp/blender-4.3.2-linux-x64/blender --version; } >artifacts/pass-rebuild/host.txt
      - name: Restore verified redistributable raw assets without account or payment
        run: |
          set -euo pipefail
          python3 tools/art/source_rebuild/restore_sources.py /tmp/pass-source-cache | tee artifacts/pass-rebuild/raw-source-hashes.log
          /tmp/blender-4.3.2-linux-x64/blender --background --factory-startup --disable-autoexec --python tools/art/source_rebuild/convert_pavilion.py -- "$PWD/assets/river_pass/pavilion/pavilion-source.fbx" "$PWD/assets/river_pass/pavilion/pavilion" >artifacts/pass-rebuild/pavilion-conversion.log 2>&1
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('assets/river_pass/pavilion')
          r=json.loads((p/'pavilion.json').read_text())
          assert (r['meshes'],r['vertices'],r['triangles'])==(70,40029,76926),r
          print('PAVILION_GLTF_ACTUAL_SHA256',hashlib.sha256((p/'pavilion.glb').read_bytes()).hexdigest())
          PY
      - name: Build the frozen editable scene and verify actual lifecycle before publication
        run: |
          set -euo pipefail
          timeout 180s godot --headless --editor --path . --import >artifacts/pass-rebuild/import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/pass-rebuild/import.log; then exit 1; fi
          timeout 180s godot --headless --path . --script tools/art/build_river_pass_master.gd >artifacts/pass-rebuild/build.log 2>&1
          for test in river_pass_master river_pass_entry river_pass_lifecycle world_terrain_compat field_bridgehead; do
            timeout 120s godot --headless --path . --script "tests/$test.gd" >"artifacts/pass-rebuild/$test.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/pass-rebuild/*.log; then exit 1; fi
          grep -q RIVER_PASS_LIFECYCLE_PASS artifacts/pass-rebuild/river_pass_lifecycle.log
          grep -q RIVER_PASS_ENTRY_PASS artifacts/pass-rebuild/river_pass_entry.log
      - name: Save actual generated source to the new integration branch only
        run: |
          set -euo pipefail
          # Restore tracked engine import metadata changed by this Linux importer.
          git diff --name-only -z -- '*.import' | xargs -0 -r git restore --worktree --
          python3 tools/art/source_rebuild/record_build.py | tee artifacts/pass-rebuild/reconstruction.log
          git config user.name 'Dot development'
          git config user.email 'dot-development@users.noreply.github.com'
          git commit -m 'Build editable whole-pass master from verified redistributable sources' -m 'Experimental art, not owner accepted. Exact raw asset hashes verified. Derived bytes and actual source are recorded; no claim of identity with the local reference tree. Codex remains paused.'
          if git ls-remote --exit-code --heads origin refs/heads/dot/river-pass-integration >/tmp/existing-pass-ref; then
            echo 'Integration branch appeared during build; refusing overwrite.'; exit 1
          else
            result=$?; test "$result" = 2 || exit "$result"
          fi
          git push origin HEAD:refs/heads/dot/river-pass-integration
          actual="$(git rev-parse HEAD)"
          test "$(git ls-remote --heads origin refs/heads/dot/river-pass-integration | cut -f1)" = "$actual"
          printf '%s\n' "$actual" >artifacts/pass-rebuild/ACTUAL_SOURCE_SHA
          printf 'WORLD_SOURCE_SHA=%s\n' "$actual" >> "$GITHUB_ENV"
      - name: Immediately capture real same-camera native 2K and 4K before aggregate tests
        run: |
          set -euo pipefail
          printf '[display]\nwindow/size/window_width_override=2560\nwindow/size/window_height_override=1440\n' >override.cfg
          rm -rf docs/evidence/river-whole-rebuild/review
          mkdir -p docs/evidence/river-whole-rebuild/review
          timeout 1800s xvfb-run -a -s '-screen 0 3840x2160x24' godot --path . --display-driver x11 --rendering-method gl_compatibility --resolution 2560x1440 --audio-driver Dummy --script tests/world_master_review.gd >artifacts/pass-rebuild/stills.log 2>&1 || { cat artifacts/pass-rebuild/stills.log; exit 1; }
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/pass-rebuild/stills.log; then exit 1; fi
          cp docs/evidence/river-whole-rebuild/review/frames.json artifacts/pass-rebuild/
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads(Path('artifacts/pass-rebuild/frames.json').read_text())
          assert {tuple(r['pixels']) for r in rows}=={(2560,1440),(3840,2160)}
          assert all(r['internal']==1 and r['source_sha']==os.environ['WORLD_SOURCE_SHA'] for r in rows)
          assert all(r['ordinary']==[512,512] and not r['world_audit'] for r in rows)
          assert all(r['zoom']==22 and r['tick']==135 for r in rows if r['frame'] in ('bridgehead-0135','bridgehead-0135-uhd'))
          print('RECONSTRUCTED_ACTUAL_NATIVE_FRAMES',len(rows),os.environ['WORLD_SOURCE_SHA'])
          PY
      - name: Deliver actual pixels immediately while later regression continues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-pass-first-real-pixels-${{ github.sha }}
          path: |
            artifacts/pass-rebuild/
            docs/evidence/river-whole-rebuild/review/bridgehead-0050.*
            docs/evidence/river-whole-rebuild/review/bridgehead-0135*
            docs/evidence/river-whole-rebuild/review/whole-war-0135*
            docs/evidence/river-whole-rebuild/review/grove-0135*
            docs/evidence/river-whole-rebuild/review/gate-architecture*
          if-no-files-found: error
          retention-days: 30
      - name: Verify complete gameplay and previous saves after initial pixel delivery
        run: |
          set -euo pipefail
          timeout 1200s ./tools/test.sh >artifacts/pass-rebuild/aggregate.log 2>&1 || { tail -150 artifacts/pass-rebuild/aggregate.log; exit 1; }
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/pass-rebuild/aggregate.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-pass-reconstruction-and-regression-${{ github.sha }}
          path: artifacts/pass-rebuild/
          if-no-files-found: error
          retention-days: 30
