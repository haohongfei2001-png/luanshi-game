name: Verify and package playable game
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Legacy profile parity materializes its preserved source commit.
      - name: Install verified official Godot and export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo 'da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68  /tmp/templates.tpz' | sha512sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/macos.zip' 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Test simulation and real scene lifecycle
        env:
          XDG_DATA_HOME: /home/runner/.local/share
        run: timeout 5m ./tools/test.sh
      - name: Measure contact at four army sizes and record a separate 512v512 run
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ./tools/test-field-render.sh
      - name: Verify youth narrative interface and real input path
        env:
          XDG_DATA_HOME: /home/runner/.local/share
        run: ./tools/test-youth-ui.sh
      - name: Verify finite hero calibration and legacy parity
        env:
          XDG_DATA_HOME: /home/runner/.local/share
        run: ./tools/calibrate-combat.sh
      - name: Exercise rendered scene with software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --audio-driver Dummy --fixed-fps 60 -- --smoke-scene --capture-proof 2>&1 | tee artifacts/visual-smoke.log
          test -s artifacts/battle-proof.png
          grep -q SCENE_SMOKE_PASS artifacts/visual-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/visual-smoke.log; then exit 1; fi
      - name: Exercise strategic map with real GUI events
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --audio-driver Dummy --fixed-fps 60 --script tests/strategy_visual.gd 2>&1 | tee artifacts/strategy-visual.log
          test -s artifacts/strategy-proof.png
          test -s artifacts/economy-local-proof.png
          test -s artifacts/condition-shortage-proof.png
          grep -q STRATEGY_VISUAL_PASS artifacts/strategy-visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/strategy-visual.log; then exit 1; fi
      - name: Exercise world-sourced combat with real graphics
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --audio-driver Dummy --fixed-fps 60 -- --campaign-smoke --capture-campaign 2>&1 | tee artifacts/campaign-visual.log
          test -s artifacts/campaign-battle-proof.png
          grep -q CAMPAIGN_SMOKE_PASS artifacts/campaign-visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/campaign-visual.log; then exit 1; fi
      - name: Exercise actual save and checkpoint interface
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --audio-driver Dummy --fixed-fps 60 --script tests/campaign_save_visual.gd 2>&1 | tee artifacts/save-visual.log
          for image in save-slots life-checkpoints battle-load saved-result; do test -s "artifacts/$image-proof.png"; done
          grep -q CAMPAIGN_SAVE_VISUAL_PASS artifacts/save-visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/save-visual.log; then exit 1; fi
      - name: Exercise youth life with real graphics and Chinese glyphs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --audio-driver Dummy --fixed-fps 60 --script tests/youth_visual.gd 2>&1 | tee artifacts/youth-visual.log
          for image in enlistment first-battle injustice active-save withdrawal endpoint records; do test -s "artifacts/youth-$image-proof.png"; done
          grep -q YOUTH_VISUAL_PASS artifacts/youth-visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/youth-visual.log; then exit 1; fi
      - name: Build macOS and verify exported Linux game
        run: ./tools/export.sh
      - name: Upload macOS playable
        uses: actions/upload-artifact@v4
        with:
          name: Luanshi-macOS-${{ github.sha }}
          path: builds/Luanshi-macOS.zip
          if-no-files-found: error
      - name: Upload Linux playable
        uses: actions/upload-artifact@v4
        with:
          name: Luanshi-Linux-${{ github.sha }}
          path: builds/Luanshi-linux.tar.gz
          if-no-files-found: error
      - name: Upload gameplay footage
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-${{ github.sha }}
          path: |
            artifacts/river-gate-512.mp4
            artifacts/player-nine-weapons.mp4
          if-no-files-found: error
      - name: Upload evidence and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            artifacts/
            builds/SHA256SUMS
            !artifacts/field-film/**
            !artifacts/kit-film/**
            !artifacts/*.mp4
          if-no-files-found: warn
  macos-runtime:
    needs: verify-and-export
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-macOS-${{ github.sha }}
          path: package
      - name: Verify bundle and run native macOS headless smoke
        run: |
          set -euo pipefail
          mkdir -p mac-evidence
          uname -a | tee mac-evidence/host.log
          sw_vers | tee -a mac-evidence/host.log
          ditto -x -k package/Luanshi-macOS.zip package/unpacked
          APP=$(find package/unpacked -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee mac-evidence/codesign.log
          BIN=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")
          "$APP/Contents/MacOS/$BIN" --headless --fixed-fps 60 -- --smoke-scene --campaign-save-id="native_${GITHUB_RUN_ID}" 2>&1 | tee mac-evidence/runtime.log
          grep -q SCENE_SMOKE_PASS mac-evidence/runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' mac-evidence/runtime.log; then exit 1; fi
          "$APP/Contents/MacOS/$BIN" --headless --fixed-fps 60 -- --campaign-smoke --campaign-save-id="native_${GITHUB_RUN_ID}" 2>&1 | tee mac-evidence/campaign.log
          grep -q CAMPAIGN_SMOKE_PASS mac-evidence/campaign.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' mac-evidence/campaign.log; then exit 1; fi
          "$APP/Contents/MacOS/$BIN" --headless --quit-after 1100 --fixed-fps 60 -- --field-check 2>&1 | tee mac-evidence/field.log
          grep -q '^FIELD_PACKAGE_PASS' mac-evidence/field.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' mac-evidence/field.log; then exit 1; fi
          for phase in prepare resume; do
            "$APP/Contents/MacOS/$BIN" --headless -- --persistence-smoke-$phase --persistence-smoke-id="native_${GITHUB_RUN_ID}" 2>&1 | tee "mac-evidence/persistence-$phase.log"
          done
          grep -q PERSISTENCE_SMOKE_PREPARE_PASS mac-evidence/persistence-prepare.log
          grep -q PERSISTENCE_SMOKE_RESUME_PASS mac-evidence/persistence-resume.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' mac-evidence/persistence-*.log; then exit 1; fi
          for phase in prepare resume; do
            "$APP/Contents/MacOS/$BIN" --headless -- --youth-smoke-$phase --youth-smoke-id="native_${GITHUB_RUN_ID}" 2>&1 | tee "mac-evidence/youth-$phase.log"
          done
          grep -q YOUTH_RUNTIME_PREPARE_PASS mac-evidence/youth-prepare.log
          grep -q YOUTH_RUNTIME_RESUME_PASS mac-evidence/youth-resume.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' mac-evidence/youth-*.log; then exit 1; fi
      - name: Render the exported siege in a hosted arm64 macOS window
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, subprocess
          app = next(pathlib.Path("package/unpacked").glob("*.app"))
          exe = plistlib.loads((app / "Contents/Info.plist").read_bytes())["CFBundleExecutable"]
          evidence = pathlib.Path("mac-evidence").resolve()
          args = [str(app / "Contents/MacOS" / exe), "--audio-driver", "Dummy", "--resolution", "1280x800", "--disable-vsync", "--", "--field-check", "--field-profile", f"--field-proof={evidence}/field.png"]
          with (evidence / "field-window.log").open("w") as out:
              result = subprocess.run(args, stdout=out, stderr=subprocess.STDOUT, timeout=75)
          log = (evidence / "field-window.log").read_text()
          print(log[-3500:])
          assert result.returncode == 0 and "FIELD_PACKAGE_PASS" in log and (evidence / "field.png").stat().st_size > 4096
          assert not any(marker in log for marker in ("ERROR:", "SCRIPT ERROR", "Parse Error", "SHADER ERROR"))
          PY
      - name: Upload native macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-${{ github.sha }}
          path: mac-evidence/
