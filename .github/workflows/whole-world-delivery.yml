name: Package and play the complete replacement world on hosted macOS
on:
  push:
    branches: ['codex/river-whole-rebuild', 'dot/river-terrain-rebuild']
    paths: ['docs/evidence/river-whole-rebuild/candidate-request.json','.github/workflows/whole-world-delivery.yml','tests/whole_battle_replay.gd','tools/whole_native_delivery.py','tools/encode_whole_battle.py','tests/field_history_probe.gd','scripts/field/save.gd','scripts/field/ground.gd','scripts/field/battle.gd','scripts/game.gd','scripts/field/whole_battle_review.gd','tools/archive_native_world.py','tests/whole_input_calibration.gd']
permissions:
  contents: write
  actions: read
concurrency:
  group: whole-world-native-delivery
  cancel-in-progress: false
jobs:
  export:
    # Art iterations use the cheaper whole-scene review. A frozen candidate runs
    # this full export, native movie, scale matrix and repeated startup suite.
    if: startsWith(github.event.head_commit.message, 'Package ')
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified official Godot and export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo 'da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68  /tmp/templates.tpz' | sha512sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/macos.zip' 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Verify simulation, old saves, officers, world and scene lifecycle
        run: |
          set -euo pipefail
          python3 -m py_compile tools/whole_native_delivery.py tools/rc3_native_probe.py tools/backport_mobile_mutex.py
          bash -n tools/build_macos_engine.sh
          ./tools/prepare-font.sh
          timeout 90s godot --headless --editor --path . --import
          timeout 120s godot --headless --path . --script tests/whole_input_calibration.gd
          timeout 8m ./tools/test.sh
          timeout 30s godot --headless --path . --script tests/world_terrain_compat.gd
          godot --headless --path . --check-only --script tests/whole_battle_replay.gd
          godot --headless --path . --check-only --script scripts/field/whole_battle_review.gd
      - name: Verify the real deployment menu through embedded-window input
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-menu-routing
          export RIVER_CAPTURE_OUT="$PWD/artifacts/native-menu-routing"
          timeout 150s xvfb-run -a -s "-screen 0 1280x800x24" godot --path . --display-driver x11 --resolution 1280x800 --audio-driver Dummy -- --whole-battle-review --menu-only > artifacts/native-menu-routing/window.log 2>&1 || { cat artifacts/native-menu-routing/window.log; exit 1; }
          cat artifacts/native-menu-routing/window.log
          grep -q BRIDGE_MENU_INPUT_PASS artifacts/native-menu-routing/window.log
      - name: Export the complete game with full license notices
        run: ./tools/export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: whole-world-macOS-source-${{ github.sha }}
          path: builds/Luanshi-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: whole-world-linux-source-${{ github.sha }}
          path: builds/Luanshi-linux.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-world-export-verification-${{ github.sha }}
          path: |
            artifacts/
            builds/SHA256SUMS
            builds/THIRD_PARTY_NOTICES.txt
  native:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Keep all old RC24/RC25 evidence intact on its original branch.
      RIVER_EVIDENCE_BRANCH: ${{ startsWith(github.ref_name, 'dot/') && 'dot/river-native-evidence' || 'codex/river-whole-native-evidence' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whole-world-macOS-source-${{ github.sha }}
          path: package
      - name: Restore the pinned native engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: patch
          key: macos-arm64-godot-35e80b3-angle-7578-mobile-mutex-v1
      - uses: actions/download-artifact@v4
        id: engine-artifact
        if: steps.engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          name: mobile-mutex-angle-template
          path: patch
          run-id: '43580708251'
          github-token: ${{ github.token }}
      - name: Rebuild the pinned source if its original artifact has expired
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.engine-artifact.outcome == 'failure'
        run: bash tools/build_macos_engine.sh patch
      - name: Prepare the native movie encoder and audit the hosted hardware
        run: |
          set -euo pipefail
          mkdir -p artifacts/whole-native
          uname -a > artifacts/whole-native/host.txt
          sw_vers >> artifacts/whole-native/host.txt
          system_profiler SPHardwareDataType SPDisplaysDataType >> artifacts/whole-native/host.txt
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 -m venv "$RUNNER_TEMP/review-python"
          "$RUNNER_TEMP/review-python/bin/pip" install Pillow
      - name: Play and record the actual exported 512v512 game at native QHD
        run: |
          "$RUNNER_TEMP/review-python/bin/python" tools/whole_native_delivery.py package/Luanshi-macOS.zip patch artifacts/whole-native
      - name: Repeat cold-data Metal startup and pre-tick focus interruption
        if: success()
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            "$RUNNER_TEMP/review-python/bin/python" tools/rc3_native_probe.py artifacts/whole-native/Luanshi-macOS-arm64-world-review.zip artifacts/whole-native/unpacked "artifacts/whole-native/cold-$pass" --startup-regression
          done
      - name: Preserve viewable native pictures, movie and failure receipts
        if: always()
        run: |
          "$RUNNER_TEMP/review-python/bin/python" tools/archive_native_world.py artifacts/whole-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-world-native-window-${{ github.sha }}
          path: |
            artifacts/whole-native/
            !artifacts/whole-native/take/
            !artifacts/whole-native/unpacked/
            !artifacts/whole-native/focus
          if-no-files-found: error
          compression-level: 1
