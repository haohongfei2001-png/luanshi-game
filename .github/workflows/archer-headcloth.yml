name: Review the fitted archer headcloth across the actual firing line
on:
  push:
    branches: [codex/river-archer-headcloth-study]
permissions:
  contents: read
jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: write
      actions: read
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      BASE: d1ef98a1c7556eab1e80062ef80fb6c163c048c9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bake and render the fitted archer in the real battle
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          src=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$src/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/engine.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/engine.zip' | sha512sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          g=/tmp/engine/Godot_v4.6.3-stable_linux.x86_64
          dst="$PWD/artifacts/archer"
          mkdir -p "$dst"
          python3 tools/art/bake_river_company.py --geometry-only | tee "$dst/bake.log"
          node tools/art/bake_field_garments.mjs
          node tools/art/bake_field_garments.mjs --check
          git show "$BASE:assets/river_gate/figures/river_company.glb" > /tmp/before.glb
          python3 tests/archer_blob.py mesh /tmp/before.glb assets/river_gate/figures/river_company.glb
          ./tools/prepare-font.sh
          for side in before after; do
            rev=HEAD
            if test "$side" = before; then rev="$BASE"; fi
            dir="$RUNNER_TEMP/draw-$side"
            git worktree add --quiet --detach "$dir" "$rev"
            cp tests/archer_draw_review.gd "$dir/tests/"
            cp -a assets/fonts/. "$dir/assets/fonts/"
            if test "$side" = after; then cp assets/river_gate/figures/{river_company.glb,field_garments.gltf} "$dir/assets/river_gate/figures/"; fi
            (
              cd "$dir"
              mkdir -p artifacts
              touch artifacts/.gdignore
              "$g" --headless --editor --path . --import >"$dst/$side-import.log" 2>&1
              if grep -E -A3 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$dst/$side-import.log"; then exit 1; fi
              timeout 220s xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path . --resolution 1920x1200 --disable-vsync --audio-driver Dummy --fixed-fps 20 --script tests/archer_draw_review.gd -- --field-size=512 2>&1 | tee "$dst/$side.log"
              grep -q '^ARCHER_WINDOW true' "$dst/$side.log"
              if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$dst/$side.log"; then exit 1; fi
              cp -r artifacts/archers "$dst/$side"
              ffmpeg -loglevel error -y -framerate 20 -i "$dst/$side/film/%03d.jpg" -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart "$dst/$side.mp4"
            )
          done
          python3 -u tests/archer_picture.py
          ffmpeg -loglevel error -y -i "$dst/before.mp4" -i "$dst/after.mp4" -filter_complex '[0:v]scale=768:480[l];[1:v]scale=768:480[r];[l][r]hstack=inputs=2' -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart "$dst/equal-speed.mp4"
      - name: Preserve the baked assets and comparison
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tests/archer_blob.py blobs assets/river_gate/figures/{river_company.glb,field_garments.gltf} artifacts/archer/equal-speed.mp4 artifacts/archer/*-native-pair.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archer-headcloth-windows
          path: |
            artifacts/archer/
            !artifacts/archer/*/film/
