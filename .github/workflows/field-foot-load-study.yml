name: Measure and film infantry carrying their weight on foot
on:
  push:
    branches: [codex/river-foot-load-study]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      BASE: 5e12030486991d259c344b038605a13a70308ec7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bake just the palette and run the original wrist, plant and impact checks
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p artifacts/body-weight
          git show "$BASE:assets/river_gate/figures/company_motion.png" > "$RUNNER_TEMP/baseline-motion.png"
          PYTHONPATH=tools/art python3 - <<'PY'
          from company_motion import bake_motion
          from pathlib import Path
          bake_motion(Path('assets/river_gate/figures'))
          PY
          python3 tools/art/check_company_motion.py | tee artifacts/body-weight/grip.log
          python3 tools/art/check_field_carries.py | tee artifacts/body-weight/carries.log
          python3 tools/art/check_contact_motion.py | tee artifacts/body-weight/contact.log
          PYTHONPATH=tools/art python3 - <<'PY'
          from PIL import Image
          from math import dist
          from pathlib import Path
          import sys,json,base64,hashlib,subprocess,os
          from company_motion import FRAMES,CLIPS,CARRY_CLIPS,CARRY_KITS,LH,RH,LB,RB,CHEST,grip,trans
          from company_weapons import FRONT_GRIP
          from check_company_motion import decoded
          from figure_mesh import add
          file=Path('assets/river_gate/figures/company_motion.png')
          before=Image.open(Path(os.environ['RUNNER_TEMP'])/'baseline-motion.png').convert('RGBA')
          after=Image.open(file).convert('RGBA')
          assert before.size==after.size
          w,h=before.size
          changed=[]
          socket=0.
          stats={}
          for lane in range(h//4):
              box=(0,lane*4,w,lane*4+4)
              if before.crop(box).tobytes()==after.crop(box).tobytes():continue
              changed.append(lane)
              idx=lane-9*CLIPS
              assert idx>=0
              kit=CARRY_KITS[idx//(2*len(CARRY_CLIPS))]
              ci=idx%len(CARRY_CLIPS); v=1+(idx//len(CARRY_CLIPS))%2; clip=CARRY_CLIPS[ci]
              assert kit in (3,7) and clip in (0,1,16,17,18,19,20,21,22)
              for bone in (LB,RB):
                  left=bone*(FRAMES+1)
                  bb=(left,lane*4,left+FRAMES+1,lane*4+4)
                  assert before.crop(bb).tobytes()==after.crop(bb).tobytes()
              tip=add(grip(1 if kit==3 else -1),(0,0,1.62) if kit==3 else (0,.54,.115))
              for f in range(FRAMES):
                  if kit==3:
                      ecc=trans(decoded(after,RH,0,lane,f),add(grip(1),(0,0,FRONT_GRIP[3])))
                      hold=trans(decoded(after,LH,0,lane,f),grip(-1))
                      socket=max(socket,dist(ecc,hold))
              if clip in (0,1):
                  for key,mark,bone in [('point',tip,RH if kit==3 else LH),('shoulder',(-.225,1.405,-.012),CHEST)]:
                      ext=[]
                      for bank in (before,after):
                          positions=[trans(decoded(bank,bone,0,lane,f),mark) for f in range(FRAMES)]
                          ext.append(round(max(dist(p,q) for p in positions for q in positions),4))
                      stats[f'{kit}-{v}-{clip}-{key}']=ext
          assert len(changed)==36 and socket<.0025,(len(changed),socket)
          (Path('artifacts/body-weight')/'metrics.json').write_text(json.dumps(dict(changed=changed,shoulder_and_weapon_m=stats,support_grip_m=socket),indent=2))
          print('INFANTRY_METRICS',json.dumps(stats,sort_keys=True),'spear support',socket)
          data=file.read_bytes(); digest=subprocess.check_output(['git','hash-object',str(file)],text=True).strip()
          print('PACE_GEOMETRY',len(data),hashlib.sha256(data).hexdigest(),digest)
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),16000):print('PACE_ASSET',i,encoded[i:i+16000])
          PY
          cp assets/river_gate/figures/company_motion.png artifacts/body-weight/
      - name: Replay normal controls and two marching fronts in the game window
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/carry-godot
          godot=/tmp/carry-godot/Godot_v4.6.3-stable_linux.x86_64
          dst="$PWD/artifacts/body-weight"
          for side in before after; do
            rev=HEAD
            if test "$side" = before; then rev="$BASE"; fi
            dir="$RUNNER_TEMP/line-$side"
            git worktree add --quiet --detach "$dir" "$rev"
            cp tests/foot_load_{follow,line}.gd "$dir/tests/"
            if test "$side" = after; then cp "$dst/company_motion.png" "$dir/assets/river_gate/figures/"; fi
            (
              cd "$dir"
              ./tools/prepare-font.sh
              mkdir -p artifacts
              touch artifacts/.gdignore
              "$godot" --headless --editor --path . --import > "$dst/$side-import.log" 2>&1
              if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "$dst/$side-import.log"; then exit 1; fi
              for lens in follow line; do
                fps=20
                if test "$lens" = follow; then fps=30; fi
                timeout 260s xvfb-run -a -s '-screen 0 1920x1200x24' "$godot" --path . --disable-vsync --audio-driver Dummy --resolution 1920x1200 --fixed-fps "$fps" --script "tests/foot_load_$lens.gd" -- --field-size=512 > "$dst/$side-$lens.log" 2>&1
                grep -E '^RC7_PERSONAL_PASS|^LOAD_LINE_PASS' "$dst/$side-$lens.log"
                if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "$dst/$side-$lens.log"; then exit 1; fi
                movie="artifacts/foot-load/$lens"
                ffmpeg -v error -y -framerate "$fps" -i "$movie/%03d.jpg" -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart "$dst/$side-$lens.mp4"
              done
              cp -r artifacts/foot-load "$dst/$side"
              cp -r artifacts/personal-contact "$dst/$side/contact"
            )
          done
      - name: Match equal-time trajectories and publish original gameplay frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,base64,io
          root=Path('artifacts/body-weight')
          for kind in ('follow','line'):
              a,b=[json.loads((root/s/kind/'trajectory.json').read_text()) for s in ('before','after')]
              assert len(a)>=40 and a==b,(kind,len(a),len(b))
              if kind=='line':
                  counts=[sum(t[-2][i] for t in a) for i in range(4)]
                  print('LOAD_FILE_COUNTS',counts)
                  assert min(counts[:3])>0
              print('LOAD_TRAJECTORY_OK',kind,len(a),a[-1][0])
          a,b=[json.loads((root/s/'contact'/'input.json').read_text()) for s in ('before','after')]
          assert a==b and all(c['follow'] and c['lens']==22 and c['ordinary']==[512,512] for c in b)
          print('LOAD_PERSONAL_SAME',json.dumps(b))
          for lab,kind,number,coord in [
              ('advance','line',8,None),('waiting','line',17,None),('engage','line',41,None),('late','line',53,None),
              ('follow','follow',36,(940,620)),('first-blow','contact',0,(960,600))]:
              arr=[]
              for side in ('before','after'):
                  path=root/side/kind/(('snapshot-%03d.png'%number) if kind!='contact' else 'personal-contact.png')
                  im=Image.open(path).convert('RGB')
                  assert im.size==(1920,1200)
                  xy=coord or (960,540)
                  w,h=(560,340)
                  crop=im.crop((xy[0]-w//2,xy[1]-h//2,xy[0]+w//2,xy[1]+h//2))
                  arr.append(crop)
              sheet=Image.new('RGB',(w*2,h))
              for i,g in enumerate(arr):sheet.paste(g,(i*w,0))
              buf=io.BytesIO();sheet.save(buf,'JPEG',subsampling=0,quality=93)
              (root/(lab+'-pair.jpg')).write_bytes(buf.getvalue())
              print('PACE_IMAGE',lab,base64.b64encode(buf.getvalue()).decode())
          PY
          for kind in follow line; do
            ffmpeg -v error -y -i "artifacts/body-weight/before-$kind.mp4" -i "artifacts/body-weight/after-$kind.mp4" -filter_complex '[0:v]scale=800:500[x];[1:v]scale=800:500[y];[x][y]hstack=inputs=2' -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart "artifacts/body-weight/$kind-pair.mp4"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-infantry-load-512
          path: |
            artifacts/body-weight/
            !artifacts/body-weight/*/line/[0-9]*.jpg
            !artifacts/body-weight/*/follow/[0-9]*.jpg
