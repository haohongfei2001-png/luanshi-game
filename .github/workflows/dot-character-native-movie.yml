name: Dot intact character native movie validation
on:
  push:
    branches: [dot/character-native-seed]
    paths: [.github/workflows/dot-character-native-movie.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-movie:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      UBC_SOURCE_SHA: bf520c13aa393c2fdc4b5c2596cfe5cbdb0bd7d9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf520c13aa393c2fdc4b5c2596cfe5cbdb0bd7d9
      - name: Install verified Godot and recording tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1-mesa-dri libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          mkdir -p artifacts/native-movie-corrected
          { uname -a; lscpu; free -m; godot --version; } >artifacts/native-movie-corrected/host.txt
      - name: Set native viewport before MovieMaker initialization
        run: |
          set -euo pipefail
          # MovieMaker reads boot-time project viewport, before lab.setup().
          printf '[display]\nwindow/size/viewport_width=2560\nwindow/size/viewport_height=1440\nwindow/size/window_width_override=2560\nwindow/size/window_height_override=1440\n' >override.cfg
          cp override.cfg artifacts/native-movie-corrected/override.cfg.txt
          sha256sum override.cfg >artifacts/native-movie-corrected/CAPTURE_CONFIG_SHA256
          git rev-parse HEAD >artifacts/native-movie-corrected/ACTUAL_SOURCE_SHA
          timeout 240s godot --headless --editor --path . --import >artifacts/native-movie-corrected/import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/native-movie-corrected/import.log; then exit 1; fi
      - name: Actual native QHD close and gameplay-scale source clip review
        run: |
          set -euo pipefail
          for size in 3.4 22.0; do
            out="artifacts/native-movie-corrected/$size"
            mkdir -p "$out"
            UBC_VIEW_SIZE="$size" timeout 650s xvfb-run -a -s '-screen 0 2560x1440x24' godot --path . --display-driver x11 --rendering-method gl_compatibility --resolution 2560x1440 --audio-driver Dummy --script tests/ubc_character_lab.gd --fixed-fps 24 --write-movie /tmp/native.avi >"$out/window.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "$out/window.log"; then exit 1; fi
            grep -q UBC_LAB_DONE "$out/window.log"
            ffmpeg -nostdin -v error -y -i /tmp/native.avi -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "$out/native-simulation-time.mp4"
            ffprobe -v error -show_streams -show_format -of json "$out/native-simulation-time.mp4" >"$out/probe.json"
            PROBE="$out/probe.json" python3 -c 'import json,os; p=json.load(open(os.environ["PROBE"])); s=p["streams"][0]; assert (s["width"],s["height"])==(2560,1440); assert s["r_frame_rate"]=="24/1" and int(s["nb_frames"])>=552; assert float(p["format"]["duration"])>=23'
            sha256sum "$out/native-simulation-time.mp4" >"$out/SHA256SUMS"
            rm /tmp/native.avi
          done
          printf 'Actual Godot original intact character rig lab. Native 2560x1440 verified by ffprobe. 24fps SIMULATION TIME, not wall-clock performance or battlefield gameplay. Original source anatomy and shorts, no weapon. Not historical character art. Foot contact NOT_ACCEPTED. M5 DEVICE_NOT_RUN. override.cfg is the explicit boot-time capture configuration, preserved with hash. Prior run 43610264795 movie was only 1280x800 despite later viewport reporting 2560x1440; that video is rejected as native-QHD evidence. Prior 28 PNG stills have independently verified native pixels and remain valid.\n' >artifacts/native-movie-corrected/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intact-native-movie-corrected-${{ github.sha }}
          path: artifacts/native-movie-corrected/
          retention-days: 30
