name: Compare the bridgehead mount submission CPU cost
on:
  push:
    branches: [codex/river-rc23-cavalry-sync-bench]
    paths: ['.github/workflows/cavalry-sync.yml','tests/field_remount_sync_bench.gd']
concurrency:
  group: cavalry-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OUT: docs/evidence/river-gate-v1-rc23/loose-horses/SIDE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified official Godot
        run: |
          set -eu
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/editor
          sudo install /tmp/editor/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p artifacts/horse-cpu
          touch artifacts/.gdignore
          ./tools/prepare-font.sh
          godot --headless --editor --import --path . >/tmp/loose-mounts-import.log 2>&1
      - name: Alternate source on one runner
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3 4; do
            sides="before after"
            if [ "$round" = 2 ] || [ "$round" = 4 ]; then sides="after before"; fi
            for side in $sides; do
              if [ "$side" = before ]; then ref='48ace1db4ee1d807de28b67eba9cd4c546c67053'; else ref='aaa694176abdbf925193fc65dc7cc7dd74684ede'; fi
              git show "$ref:scripts/field/presentation.gd" > scripts/field/presentation.gd
              godot --headless --path . --script tests/field_remount_sync_bench.gd >"artifacts/horse-cpu/$side-$round.log" 2>&1
              if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "artifacts/horse-cpu/$side-$round.log"; then exit 1; fi
              grep '^MOUNT_SYNC' "artifacts/horse-cpu/$side-$round.log"
            done
          done
          python - <<'PY'
          import json, pathlib, statistics
          root=pathlib.Path("artifacts/horse-cpu"); report={}
          for side in ("before","after"):
              rows=[json.loads(next(l[11:] for l in p.read_text().splitlines() if l.startswith("MOUNT_SYNC "))) for p in sorted(root.glob(side+"-*.log"))]
              report[side]={"rounds":rows,"median_of_four":{metric:statistics.median(row[metric] for row in rows) for metric in ("p50_us","p95_us","p99_us")}}
          assert [r["damage"] for r in report["before"]["rounds"]]==[r["damage"] for r in report["after"]["rounds"]]
          print("HEADLESS_VIEW_CPU",json.dumps(report,sort_keys=True))
          (root/"comparison.json").write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: same-runner-horse-presentation
          path: artifacts/horse-cpu
          retention-days: 7
