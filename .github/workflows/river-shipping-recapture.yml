name: Verify unchanged RC15 export with host-speed-independent capture
on:
  push:
    branches: ['codex/river-rc15-recording']
permissions:
  contents: read
  actions: read
jobs:
  play-export:
    name: Play the exported Linux package through its normal inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-Linux-331ede4b126658da7cb4cae08edd05cd2b468c9b
          run-id: 43475734574
          github-token: ${{ github.token }}
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: verification-331ede4b126658da7cb4cae08edd05cd2b468c9b
          run-id: 43475734574
          github-token: ${{ github.token }}
          path: package-report
      - name: Record the shipped binary with real keyboard, pointer and engine audio
        env:
          EXPECTED_EXPORT: '331ede4b126658da7cb4cae08edd05cd2b468c9b'
        run: |
          set -euo pipefail
          sums=$(find package-report -name SHA256SUMS -print -quit)
          export PACKAGE_HASH=$(awk '/Luanshi-linux.tar.gz$/ {print $1}' "$sums")
          test "$PACKAGE_HASH" = "5f2b464ed24b36e0dc96f6719c7b8c321c3d7097d9c5b1bfb71b28ceb1510d56"
          echo "$PACKAGE_HASH  package/Luanshi-linux.tar.gz" | sha256sum --check
          tar -C package -xf package/Luanshi-linux.tar.gz Luanshi-linux.x86_64
          if ! command -v xdotool >/dev/null || ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xdotool ffmpeg; fi
          xvfb-run -a -s '-screen 0 1280x800x24' python3 tools/record_export_window.py records "$RUNNER_TEMP/river-frames" package/Luanshi-linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exported-game-window-331ede4b126658da7cb4cae08edd05cd2b468c9b
          path: records/
          if-no-files-found: warn

