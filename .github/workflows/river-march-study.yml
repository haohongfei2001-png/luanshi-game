name: Retarget footmen from the real CC0 walk and jog master and replay their approach
on:
  push:
    branches: ['codex/river-march-study']
permissions:
  contents: read
jobs:
  field:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sample the source joints and bake the unchanged runtime palette format
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y python3-numpy python3-pil ffmpeg
          curl -fLsS --retry 1 'https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/?source=river-march-v1' -o "$RUNNER_TEMP/motion.zip"
          /usr/bin/python3 tools/art/import_company_march.py "$RUNNER_TEMP/motion.zip" tools/art/source/march_curves.json
          /usr/bin/python3 -c "from pathlib import Path; import sys; sys.path.insert(0,'tools/art'); from company_motion import bake_motion; bake_motion(Path('assets/river_gate/figures'))"
          mkdir -p proof/motion
          cp tools/art/source/march_curves.json assets/river_gate/figures/company_motion.png proof/motion/
          /usr/bin/python3 tools/art/check_company_motion.py
          /usr/bin/python3 tools/art/check_field_carries.py
          /usr/bin/python3 tools/art/check_contact_motion.py
      - name: Record identical normal-speed soldier approaches in the actual game
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 1 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/engine.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/engine.zip' | sha512sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          godot=/tmp/engine/Godot_v4.6.3-stable_linux.x86_64
          ./tools/prepare-font.sh
          for side in before after; do
            code=HEAD
            if test "$side" = before; then code=05f0c7f1ff5ccea0f6cdba7da1b357111c1fcc09; fi
            root="$RUNNER_TEMP/field-$side"
            mkdir -p "$root"
            git archive "$code" | tar -x -C "$root"
            cp -a assets/fonts/. "$root/assets/fonts/"
            if test "$side" = after; then cp proof/motion/company_motion.png "$root/assets/river_gate/figures/"; fi
            "$godot" --headless --editor --path "$root" --import > "proof/$side-import.log" 2>&1
            if grep -E 'Parse Error|SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side-import.log"; then exit 1; fi
            xvfb-run -a -s '-screen 0 1280x800x24' "$godot" --path "$root" --resolution 1280x800 --disable-vsync --fixed-fps 30 --write-movie "$RUNNER_TEMP/$side.avi" --script tests/field_motion_review.gd -- --field-size=512 2>&1 | tee "proof/$side.log"
            grep -q FIELD_MOTION_RECEIPT "proof/$side.log"
            ffmpeg -loglevel error -y -i "$RUNNER_TEMP/$side.avi" -c:v libx264 -crf 20 -pix_fmt yuv420p -c:a aac "proof/$side.mp4"
          done
          ffmpeg -loglevel error -y -i proof/before.mp4 -i proof/after.mp4 -filter_complex '[0:v]scale=640:400[l];[1:v]scale=640:400[r];[l][r]hstack[v]' -map '[v]' -map 1:a:0 -c:v libx264 -crf 20 -pix_fmt yuv420p -c:a copy proof/march-pair.mp4
          ffmpeg -loglevel error -y -i proof/march-pair.mp4 -vf 'select=not(mod(n\,9)),scale=900:-2,tile=1x6' -frames:v 1 proof/march-sheet.jpg
          /usr/bin/python3 -c "from pathlib import Path; import base64; print('MARCH_SHEET',base64.b64encode(Path('proof/march-sheet.jpg').read_bytes()).decode())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retargeted-formation-field-records
          path: proof
