name: Dot new architecture actual Godot experiment
on:
  push:
    branches: ['dot/river-gate-structure-evidence']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LUANSHI_AUTHORED_LANDFORM: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed existing source bytes before building
        run: |
          mkdir -p artifacts/gate-structure
          touch artifacts/.gdignore
          python tools/art/gate_structure/check_evidence_dependencies.py >artifacts/gate-structure/dependency-preflight.json
          python tools/art/gate_structure/prepare_sources.py | tee artifacts/gate-structure/source-hashes.log
      - name: Install official pinned tools and virtual display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri ffmpeg
          # Official mirror list: https://projects.blender.org/infrastructure/mirror/wiki
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz || curl -fLsS --retry 2 https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          python -m pip install 'Pillow==11.1.0'
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          { uname -a; lscpu; free -m; godot --version; } >artifacts/gate-structure/host.txt
      - name: Build new editable architecture from verified professional source
        run: |
          set -euo pipefail
          /tmp/blender-4.3.2-linux-x64/blender -b --factory-startup --disable-autoexec --python tools/art/gate_structure/build_architecture.py -- assets/river_pass/pavilion/pavilion-source.fbx "$PWD/assets/river_authored/architecture" --no-preview >artifacts/gate-structure/build.log 2>&1
          sha256sum assets/river_authored/architecture/architecture.glb >artifacts/gate-structure/derived-sha256.txt
          godot --headless --editor --path . --import >artifacts/gate-structure/import.log 2>&1
          python tools/art/gate_structure/run_capture_checked.py artifacts/gate-structure/entry-parse.log 45 -- godot --headless --path . --check-only --script tests/authored_architecture_capture.gd
          python tests/bounded_artifact_groups_test.py
          python tests/native_evidence_bundle_test.py
          python tests/wall_clock_encoding_test.py
          python tests/traversal_result_test.py
          timeout 30s godot --headless --path . --script tests/art_reset/surface_front_face.gd >artifacts/gate-structure/surface-front-face.log 2>&1
          timeout 30s godot --headless --path . --script tests/authored_support_winding.gd >artifacts/gate-structure/support-winding.log 2>&1
          timeout 45s godot --headless --path . --script tests/authored_architecture.gd >artifacts/gate-structure/structure-test.log 2>&1
      - uses: actions/cache/restore@v4
        id: source_archive_cache
        with:
          path: /tmp/luanshi-sprite/sprite-source.zip
          key: luanshi-official-sprite-archive-21ee25dfffc76030770b644de5fe897559aead064b384fba77166b71a9337791
      - name: Verify official source and derive independent content keys
        id: sprite_keys
        run: |
          set -euo pipefail
          python tools/art/gate_structure/fetch_sprite_source.py /tmp/luanshi-sprite >artifacts/gate-structure/sprite-source.log 2>&1
          godot --headless --path . --script tools/art/sprite_source/export_ground_survey.gd -- /tmp/ground-survey.json >artifacts/gate-structure/ground-survey.log 2>&1
          python tools/art/gate_structure/bake_recipe_cache.py keys "$(cat /tmp/luanshi-sprite/source-root.txt)" /tmp/ground-survey.json /tmp/sprite-recipes >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: ${{ steps.source_archive_cache.outputs.cache-hit != 'true' }}
        with:
          path: /tmp/luanshi-sprite/sprite-source.zip
          key: luanshi-official-sprite-archive-21ee25dfffc76030770b644de5fe897559aead064b384fba77166b71a9337791
      - uses: actions/cache/restore@v4
        id: cache_tree
        with:
          path: /tmp/sprite-tree
          key: ${{ steps.sprite_keys.outputs.tree_key }}
      - uses: actions/cache/restore@v4
        id: cache_bush
        with:
          path: /tmp/sprite-bush
          key: ${{ steps.sprite_keys.outputs.bush_key }}
      - name: Verify or rebuild tree derivative only
        id: bake_tree
        run: |
          set -euo pipefail
          SOURCE_ROOT=$(cat /tmp/luanshi-sprite/source-root.txt)
          BLENDER=/tmp/blender-4.3.2-linux-x64/blender
          if ! python tools/art/gate_structure/bake_recipe_cache.py verify /tmp/sprite-recipes/tree.json /tmp/sprite-tree >artifacts/gate-structure/tree-cache.log 2>&1; then
            python tools/art/gate_structure/bake_recipe_cache.py quarantine /tmp/sprite-tree >>artifacts/gate-structure/tree-cache.log
            $BLENDER -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python tools/art/sprite_source/bake_reusable_collection.py -- "$SOURCE_ROOT/lib/env/trees.blend" EN-tree.1 /tmp/sprite-tree >artifacts/gate-structure/tree-bake.log 2>&1
            python tools/art/gate_structure/bake_recipe_cache.py stamp /tmp/sprite-recipes/tree.json /tmp/sprite-tree >>artifacts/gate-structure/tree-cache.log
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.bake_tree.outputs.verified == 'true' && steps.cache_tree.outputs.cache-hit != 'true' }}
        with:
          path: /tmp/sprite-tree
          key: ${{ steps.sprite_keys.outputs.tree_key }}
      - name: Verify or rebuild bush derivative only
        id: bake_bush
        run: |
          set -euo pipefail
          SOURCE_ROOT=$(cat /tmp/luanshi-sprite/source-root.txt)
          BLENDER=/tmp/blender-4.3.2-linux-x64/blender
          if ! python tools/art/gate_structure/bake_recipe_cache.py verify /tmp/sprite-recipes/bush.json /tmp/sprite-bush >artifacts/gate-structure/bush-cache.log 2>&1; then
            python tools/art/gate_structure/bake_recipe_cache.py quarantine /tmp/sprite-bush >>artifacts/gate-structure/bush-cache.log
            $BLENDER -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python tools/art/sprite_source/bake_native_collection.py -- "$SOURCE_ROOT/lib/env/bushes.blend" EN-bush.01 /tmp/sprite-bush >artifacts/gate-structure/bush-bake.log 2>&1
            python tools/art/gate_structure/bake_recipe_cache.py stamp /tmp/sprite-recipes/bush.json /tmp/sprite-bush >>artifacts/gate-structure/bush-cache.log
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.bake_bush.outputs.verified == 'true' && steps.cache_bush.outputs.cache-hit != 'true' }}
        with:
          path: /tmp/sprite-bush
          key: ${{ steps.sprite_keys.outputs.bush_key }}
      - name: Build complete matching terrain from verified CC0 earth
        run: |
          set -euo pipefail
          python tools/art/continuous_landform/fetch_earth.py /tmp/earth-source >artifacts/gate-structure/earth-source.log 2>&1
          mkdir -p assets/river_authored/ground
          godot --headless --path . --script tools/art/continuous_landform/build_region.gd -- assets/river_authored/ground/continuous-region.scn /tmp/earth-source >artifacts/gate-structure/continuous-build.log 2>&1
          LUANSHI_AUTHORED_LANDFORM=0 godot --headless --path . --script tests/art_reset/continuous_landform_contract.gd >artifacts/gate-structure/continuous-default-contract.log 2>&1
          godot --headless --path . --script tests/art_reset/continuous_landform_mesh.gd -- assets/river_authored/ground/continuous-region.scn >artifacts/gate-structure/continuous-mesh.log 2>&1
          godot --headless --path . --script tests/art_reset/earth_material.gd -- assets/river_authored/ground/continuous-region.scn >artifacts/gate-structure/earth-material.log 2>&1
      - name: Assemble verified family and validate actual scene
        run: |
          set -euo pipefail
          cp /tmp/sprite-recipes/*.json artifacts/gate-structure/
          mkdir -p assets/river_authored/woodland
          godot --headless --path . --script tools/art/sprite_source/assemble_woodland_region.gd -- /tmp/sprite-tree/derived.glb /tmp/sprite-bush/derived-EN-bush.01.glb assets/river_authored/woodland/region.scn >artifacts/gate-structure/woodland-build.log 2>&1
          timeout 60s godot --headless --path . --script tests/art_reset/woodland_region_lifecycle.gd -- assets/river_authored/woodland/region.scn >artifacts/gate-structure/woodland-lifecycle.log 2>&1
          cp /tmp/sprite-tree/complete.json artifacts/gate-structure/tree-bake.json
          cp /tmp/sprite-bush/complete.json artifacts/gate-structure/bush-bake.json
          mkdir -p assets/river_authored/ground
          godot --headless --editor --path . --import >artifacts/gate-structure/region-import.log 2>&1
          python tools/art/gate_structure/check_evidence_dependencies.py --require-generated >artifacts/gate-structure/dependency-complete.json
          timeout 160s godot --headless --path . --script tests/authored_architecture_capture.gd -- --validate-pairs >artifacts/gate-structure/region-setup.log 2>&1
          timeout 60s godot --headless --path . --script tests/authored_gate_gameplay_contract.gd >artifacts/gate-structure/gate-gameplay.log 2>&1
          if grep -E 'SCRIPT ERROR|ERROR:' artifacts/gate-structure/{woodland-build,region-setup,gate-gameplay}.log; then exit 1; fi
      - name: Preserve verified derivatives independently of later rendering
        if: always()
        run: python tools/art/gate_structure/preserve_derivatives.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/derived-groups/group-00/**') != '' }}
        with:
          name: reusable-region-derivatives-00
          path: artifacts/derived-groups/group-00
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/derived-groups/group-01/**') != '' }}
        with:
          name: reusable-region-derivatives-01
          path: artifacts/derived-groups/group-01
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/derived-groups/group-02/**') != '' }}
        with:
          name: reusable-region-derivatives-02
          path: artifacts/derived-groups/group-02
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/derived-groups/group-03/**') != '' }}
        with:
          name: reusable-region-derivatives-03
          path: artifacts/derived-groups/group-03
          retention-days: 30
          if-no-files-found: error
      - name: Capture actual game with new structures and unchanged battle systems
        env:
          ARCHITECTURE_CAPTURE_OUT: ${{ github.workspace }}/artifacts/gate-structure/pixels
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export CONTROLLER_BLOB=$(git hash-object scripts/field/controller.gd)
          export RIVER_SOURCE_SHA="$GITHUB_SHA"
          python tools/art/gate_structure/run_capture_checked.py artifacts/gate-structure/actual-game.log 600 -- xvfb-run -a -s '-screen 0 3840x2160x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/authored_architecture_capture.gd -- --wall-clock-action --traversal-review --shadow-diagnostic
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/gate-structure/actual-game.log; then exit 1; fi
      - name: Preserve real-speed traversal movie and bounded review bundle
        if: always()
        run: |
          set -uo pipefail
          RAW=artifacts/gate-structure/pixels/traversal-raw
          if [ ! -f "$RAW/frames.jsonl" ]; then echo 'TRAVERSAL_NOT_RUN'; exit 0; fi
          status=0
          python tools/encode_wall_clock_capture.py "$RAW" "$RAW/traversal.mp4" >"$RAW/encode.log" 2>&1 || status=1
          python tools/native_evidence_bundle.py "$RAW" artifacts/traversal-curated || status=1
          python -c "import sys;sys.path.insert(0,'tools');from bounded_artifact_groups import stage;stage('artifacts/traversal-curated','artifacts/traversal-groups',max_groups=4)" || status=1
          python tools/art/gate_structure/validate_traversal.py "$RAW/frames.jsonl" >"$RAW/route-acceptance.json" 2>&1 || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-architecture-real-game-evidence
          path: |
            artifacts/gate-structure
            !artifacts/gate-structure/pixels/traversal-raw/frame-*.jpg
            !artifacts/gate-structure/pixels/traversal-raw/*.mp4
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-architecture-editable-source
          path: |
            assets/river_authored/architecture/architecture.glb
            assets/river_authored/architecture/architecture-manifest.json
            assets/river_authored/architecture/source/architecture.blend
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/traversal-groups/group-00/**') != '' }}
        with:
          name: new-region-traversal-00
          path: artifacts/traversal-groups/group-00
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/traversal-groups/group-01/**') != '' }}
        with:
          name: new-region-traversal-01
          path: artifacts/traversal-groups/group-01
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/traversal-groups/group-02/**') != '' }}
        with:
          name: new-region-traversal-02
          path: artifacts/traversal-groups/group-02
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/traversal-groups/group-03/**') != '' }}
        with:
          name: new-region-traversal-03
          path: artifacts/traversal-groups/group-03
          retention-days: 30
          if-no-files-found: error
