name: Dot new architecture actual Godot experiment
on:
  push:
    branches: ['dot/river-gate-structure-evidence']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed existing source bytes before building
        run: |
          mkdir -p artifacts/gate-structure
          touch artifacts/.gdignore
          python tools/art/gate_structure/prepare_sources.py | tee artifacts/gate-structure/source-hashes.log
      - name: Install official pinned tools and virtual display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          { uname -a; lscpu; free -m; godot --version; } >artifacts/gate-structure/host.txt
      - name: Build new editable architecture from verified professional source
        run: |
          set -euo pipefail
          /tmp/blender-4.3.2-linux-x64/blender -b --factory-startup --disable-autoexec --python tools/art/gate_structure/build_architecture.py -- assets/river_pass/pavilion/pavilion-source.fbx "$PWD/assets/river_authored/architecture" --no-preview >artifacts/gate-structure/build.log 2>&1
          sha256sum assets/river_authored/architecture/architecture.glb >artifacts/gate-structure/derived-sha256.txt
          godot --headless --editor --path . --import >artifacts/gate-structure/import.log 2>&1
          timeout 45s godot --headless --path . --script tests/authored_architecture.gd >artifacts/gate-structure/structure-test.log 2>&1
          timeout 75s godot --headless --path . --script tests/authored_architecture_capture.gd -- --validate-setup >artifacts/gate-structure/setup-test.log 2>&1
          if grep -E 'SCRIPT ERROR|ERROR:' artifacts/gate-structure/setup-test.log; then exit 1; fi
      - name: Capture actual game with new structures and unchanged battle systems
        env:
          ARCHITECTURE_CAPTURE_OUT: ${{ github.workspace }}/artifacts/gate-structure/pixels
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python tools/art/gate_structure/run_capture_checked.py artifacts/gate-structure/actual-game.log 600 -- xvfb-run -a -s '-screen 0 3840x2160x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/authored_architecture_capture.gd
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/gate-structure/actual-game.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-architecture-real-game-evidence
          path: artifacts/gate-structure
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-architecture-editable-source
          path: |
            assets/river_authored/architecture/architecture.glb
            assets/river_authored/architecture/architecture-manifest.json
            assets/river_authored/architecture/source/architecture.blend
          if-no-files-found: warn
          retention-days: 30
