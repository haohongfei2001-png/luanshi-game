name: Dot native same-camera art review
on:
  push:
    branches: ['dot/river-terrain-rebuild']
    paths: ['scripts/field/**', 'assets/river_gate/**', 'tests/world_master_review.gd', 'tests/river_environment_slice.gd', '.github/workflows/dot-art-review.yml']
permissions:
  contents: read
concurrency:
  group: dot-native-art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-stills:
    strategy:
      fail-fast: false
      matrix:
        source: [rc25-baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'rc25-baseline' && 'd1c1895221c33386d471922807ed590a6987dbe1' || github.sha }}
      - name: Install the verified existing Godot version
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p artifacts/dot-art-review
          touch artifacts/.gdignore
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
      - name: Import and check actual terrain and battle compatibility
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import > artifacts/dot-art-review/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' artifacts/dot-art-review/import.log; then exit 1; fi
          timeout 90s godot --headless --path . --script tests/world_terrain_compat.gd | tee artifacts/dot-art-review/terrain.log
          timeout 90s godot --headless --path . --script tests/field_bridgehead.gd | tee artifacts/dot-art-review/bridgehead.log
          if test -f tests/river_environment_slice.gd; then
            timeout 90s godot --headless --path . --script tests/river_environment_slice.gd | tee artifacts/dot-art-review/environment.log
          fi
      - name: Capture untouched native 2K and 4K game frames at the same seed and ticks
        run: |
          set -euo pipefail
          printf '[display]\nwindow/size/window_width_override=2560\nwindow/size/window_height_override=1440\n' > override.cfg
          export WORLD_SOURCE_SHA="$(git rev-parse HEAD)"
          { uname -a; lscpu; free -m; godot --version; } > artifacts/dot-art-review/host.txt
          timeout 1200s xvfb-run -a -s '-screen 0 3840x2160x24' godot --path . --display-driver x11 --resolution 2560x1440 --audio-driver Dummy --script tests/world_master_review.gd > artifacts/dot-art-review/stills.log 2>&1 || { cat artifacts/dot-art-review/stills.log; exit 1; }
          cat artifacts/dot-art-review/stills.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/dot-art-review/stills.log; then exit 1; fi
          cp docs/evidence/river-whole-rebuild/review/frames.json artifacts/dot-art-review/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('artifacts/dot-art-review/frames.json').read_text())
          assert {tuple(r['pixels']) for r in rows} == {(2560, 1440), (3840, 2160)}
          assert all(r['internal'] == 1 and r['source_sha'] == os.environ['WORLD_SOURCE_SHA'] for r in rows)
          assert all(r['ordinary'] == [512, 512] and not r['world_audit'] for r in rows)
          assert all(r['zoom'] == 22 and r['tick'] == 135 for r in rows if r['frame'] in ('bridgehead-0135', 'bridgehead-0135-uhd'))
          print('DOT_NATIVE_FRAME_METADATA_PASS', len(rows))
          PY
      - name: Preserve pixels, logs and failures without committing generated assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-art-${{ matrix.source }}-${{ github.sha }}
          path: |
            artifacts/dot-art-review/
            docs/evidence/river-whole-rebuild/review/bridgehead-0050.*
            docs/evidence/river-whole-rebuild/review/bridgehead-0135*
            docs/evidence/river-whole-rebuild/review/whole-war-0135*
            docs/evidence/river-whole-rebuild/review/grove-0135*
            docs/evidence/river-whole-rebuild/review/gate-architecture*
            docs/evidence/river-whole-rebuild/review/native-crowns-full-geometry*
          if-no-files-found: error
          retention-days: 30
