name: Rebuild complete licensed character and inspect native Godot rig
on:
  push:
    branches: ['dot/character-native-seed']
    paths: ['.github/workflows/dot-character-native-seed.yml', 'tools/art/ubc_character/**', 'tests/ubc_character_lab.gd', 'scripts/experimental/intact_character_actor.gd']
permissions:
  contents: write
concurrency:
  group: dot-character-native-first-source
  cancel-in-progress: false
jobs:
  intact-rig:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace an existing experiment
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/dot/character-native-source; then exit 1; else r=$?; test "$r" = 2 || exit "$r"; fi
      - name: Install checksum-pinned official tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1-mesa-dri libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          mkdir -p artifacts/intact-native
          touch artifacts/.gdignore
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
          python3 -m venv /tmp/character-python
          /tmp/character-python/bin/pip install numpy scipy Pillow
          ./tools/prepare-font.sh
          { uname -a; lscpu; free -m; godot --version; } >artifacts/intact-native/host.txt
      - name: Reconstruct exact CC0 source and preserve original structures
        run: |
          set -euo pipefail
          /tmp/character-python/bin/python tools/art/ubc_character/fetch_verified.py /tmp/ubc-cache /tmp/ubc-extract >artifacts/intact-native/source-download.log 2>&1
          /tmp/character-python/bin/python tools/art/ubc_character/preserve_sources.py /tmp/ubc-extract assets/ubc_lab/source
          /tmp/character-python/bin/python tools/art/ubc_character/build.py /tmp/ubc-extract assets/ubc_lab >artifacts/intact-native/retarget.log 2>&1
          /tmp/blender-4.3.2-linux-x64/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/art/ubc_character/editable.py -- "$PWD/assets/ubc_lab" >artifacts/intact-native/editable.log 2>&1
          timeout 240s godot --headless --editor --path . --import >artifacts/intact-native/import.log 2>&1
          UBC_TEST=1 timeout 60s godot --headless --path . --script tests/ubc_character_lab.gd >artifacts/intact-native/import-test.log 2>&1
          timeout 180s godot --headless --path . --script tests/intact_character_state_adapter.gd >artifacts/intact-native/state-test.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' artifacts/intact-native/*.log; then exit 1; fi
          grep -q INTACT_CHARACTER_STATE_PASS artifacts/intact-native/state-test.log
      - name: Commit generated isolated source without changing the normal game
        run: |
          set -euo pipefail
          git diff --name-only -z -- '*.import' | xargs -0 -r git restore --worktree --
          python3 tools/art/ubc_character/record_hosted.py
          git config user.name 'Dot development'
          git config user.email 'dot-development@users.noreply.github.com'
          git commit -m 'Preserve complete CC0 native character source for isolated rig review'
          if git ls-remote --exit-code --heads origin refs/heads/dot/character-native-source; then exit 1; else r=$?; test "$r" = 2 || exit "$r"; fi
          git push origin HEAD:refs/heads/dot/character-native-source
          actual=$(git rev-parse HEAD)
          test "$(git ls-remote --heads origin refs/heads/dot/character-native-source | cut -f1)" = "$actual"
          echo "UBC_SOURCE_SHA=$actual" >> "$GITHUB_ENV"
          echo "$actual" >artifacts/intact-native/ACTUAL_SOURCE_SHA
      - name: Render genuine native QHD and UHD clip stills at close and gameplay distance
        id: stills
        run: |
          set -euo pipefail
          for mode in qhd uhd; do
            pixels=2560x1440; test "$mode" != uhd || pixels=3840x2160
            UBC_STILLS=1 UBC_CAPTURE_OUT="$PWD/artifacts/intact-native/$mode" timeout 600s xvfb-run -a -s '-screen 0 3840x2160x24' godot --path . --display-driver x11 --rendering-method gl_compatibility --resolution "$pixels" --audio-driver Dummy --script tests/ubc_character_lab.gd >"artifacts/intact-native/stills-$mode.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "artifacts/intact-native/stills-$mode.log"; then exit 1; fi
            grep -q UBC_NATIVE_STILLS_PASS "artifacts/intact-native/stills-$mode.log"
            MODE="$mode" PIXELS="$pixels" python3 -c 'import json,os; from pathlib import Path; r=json.loads((Path("artifacts/intact-native")/os.environ["MODE"]/"frames.json").read_text()); expected=list(map(int,os.environ["PIXELS"].split("x"))); assert len(r)==14 and {round(v["camera_size"],1) for v in r}=={3.4,22.0}; assert all(v["pixels"]==expected and v["internal_scale"]==1 and v["source_sha"]==os.environ["UBC_SOURCE_SHA"] for v in r)' 
          done
      - uses: actions/upload-artifact@v4
        if: steps.stills.outcome == 'success'
        with:
          name: intact-native-character-stills-${{ github.sha }}
          path: artifacts/intact-native/
          retention-days: 30
      - name: Record all nine source clips in actual Godot, simulation time only
        id: movie
        run: |
          set -euo pipefail
          mkdir -p artifacts/intact-native/movie
          timeout 1500s xvfb-run -a -s '-screen 0 2560x1440x24' godot --path . --display-driver x11 --rendering-method gl_compatibility --resolution 2560x1440 --audio-driver Dummy --script tests/ubc_character_lab.gd --fixed-fps 24 --write-movie /tmp/intact-native.avi >artifacts/intact-native/movie/window.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' artifacts/intact-native/movie/window.log; then exit 1; fi
          grep -q UBC_LAB_DONE artifacts/intact-native/movie/window.log
          ffmpeg -nostdin -v error -i /tmp/intact-native.avi -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart artifacts/intact-native/movie/native-simulation-time.mp4
          ffprobe -v error -show_streams -show_format -of json artifacts/intact-native/movie/native-simulation-time.mp4 >artifacts/intact-native/movie/probe.json
          printf 'Actual Godot native source-character lab. Fixed 24 fps simulation-time capture, not real-time FPS or battlefield play. Modern original source anatomy/clothes, not historical or owner-approved art. No equipped weapon. M5 DEVICE_NOT_RUN.\n' >artifacts/intact-native/movie/SCOPE.txt
          sha256sum artifacts/intact-native/movie/native-simulation-time.mp4 >artifacts/intact-native/movie/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intact-native-character-results-${{ github.sha }}
          path: artifacts/intact-native/
          retention-days: 30
          if-no-files-found: warn
