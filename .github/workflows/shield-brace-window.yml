name: Verify the infantry board at two live sided blocks
on:
  push:
    branches: ['codex/river-shield-brace']
    paths: ['tools/art/company_motion.py','tools/art/check_shield_brace.py','tests/field_shield_brace.gd','.github/workflows/shield-brace-window.yml']
permissions:
  contents: read
jobs:
  replays:
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild only the company bank and inspect its three board rows
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get -yq install python3-pil ffmpeg
          p=docs/evidence/river-gate-v1-rc22/shield-brace
          mkdir -p "$p"
          git show 73a57949a496c6e25a49223205eadde6f357b485:assets/river_gate/figures/company_motion.png > "$RUNNER_TEMP/advance.png"
          PYTHONPATH=tools/art /usr/bin/python3 -c 'from pathlib import Path; from company_motion import bake_motion; bake_motion(Path("assets/river_gate/figures"))'
          /usr/bin/python3 tools/art/check_contact_motion.py | tee "$p/contact.log"
          /usr/bin/python3 tools/art/check_company_motion.py | tee "$p/grips.log"
          /usr/bin/python3 tools/art/check_shield_brace.py "$RUNNER_TEMP/advance.png" assets/river_gate/figures/company_motion.png > "$p/board.json"
          git add -- assets/river_gate/figures/company_motion.png
          git -c user.name='River Gate animation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake the board grip and its two live sided catches'
      - name: Draw same-speed frontal and reverse shield impacts at the normal field lens
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 1 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/g.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/g.zip' | sha512sum -c -
          unzip -q /tmp/g.zip -d /tmp/g
          ./tools/prepare-font.sh
          p=docs/evidence/river-gate-v1-rc22/shield-brace
          for side in before after; do
            rev=HEAD
            if test "$side" = before; then rev=73a57949a496c6e25a49223205eadde6f357b485; fi
            root="$RUNNER_TEMP/boards-$side"
            mkdir -p "$root" "$p/$side"
            git archive "$rev" | tar -x -C "$root"
            cp -a assets/fonts/. "$root/assets/fonts/"
            cp tests/field_shield_brace.gd "$root/tests/"
            g=/tmp/g/Godot_v4.6.3-stable_linux.x86_64
            game="$root/artifacts/shield-brace"
            mkdir -p "$game"
            "$g" --headless --editor --path "$root" --import > "$p/$side/import.log" 2>&1
            if grep -E 'ERROR:|Parse Error' "$p/$side/import.log"; then exit 1; fi
            if test "$side" = before;then
              xvfb-run -a -s '-screen 0 1280x800x24' "$g" --path "$root" --resolution 1280x800 --audio-driver Dummy --disable-vsync --fixed-fps 20 --script tests/field_shield_brace.gd -- --field-size=512 --find-shield-events > "$p/plan.log" 2>&1
              grep -F 'SHIELD_BRACE_WINDOW true' "$p/plan.log"
              cp "$game/events.json" "$p/events.json"
            else
              cp "$p/events.json" "$game/"
            fi
            xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 20 --script tests/field_shield_brace.gd -- --field-size=512 > "$p/$side/render.log" 2>&1
            grep -F 'SHIELD_BRACE_WINDOW true' "$p/$side/render.log"
            cp "$game"/*.png "$game/states.json" "$p/$side/"
            for id in left-front right-front left-reverse right-reverse; do
              ffmpeg -y -loglevel error -framerate 20 -i "$game/$id-%02d.jpg" -frames:v 34 -c:v libx264 -preset veryfast -crf 16 -pix_fmt yuv420p "$p/$side/$id.mp4"
            done
          done
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          r=Path("docs/evidence/river-gate-v1-rc22/shield-brace")
          a,b=[json.loads((r/s/"states.json").read_text()) for s in ("before","after")]
          assert a==b and len(a)==136
          for e in json.loads((r/"events.json").read_text()):
              label=e["side"]
              entry=next(v for v in a if v["side"]==label and v["index"]==11 and v["dir"]==0)
              assert entry["blocked"] and entry["state"]==3 and entry["hit_side"]==e["sign"]
              assert entry["tick"]==entry["contact_tick"]==e["tick"] and entry["soldiers"]==[512,512]
              for d,view in enumerate(("front","reverse")):
                  sheet=Image.new("RGB",(3*290,2*180));win=Image.new("RGB",(1500,469))
                  for i,s in enumerate(("before","after")):
                      for j,when in enumerate((9,11,13)):
                          v=next(v for v in a if v["side"]==label and v["index"]==when and v["dir"]==d)
                          p=r/s/("%s-%s-%02d.png"%(label,view,when))
                          im=Image.open(p).convert("RGB");assert im.size==(1920,1200)
                          x,y=map(round,v["px"]);sheet.paste(im.crop((x-145,y-72,x+145,y+108)),(j*290,i*180))
                          if when==13:
                              im.save(r/s/(label+"-"+view+"-native.jpg"),quality=86,subsampling=0)
                              win.paste(im.resize((750,469),Image.Resampling.LANCZOS),(i*750,0))
                  sheet.save(r/(label+"-"+view+"-sequence.jpg"),quality=95,subsampling=0)
                  win.save(r/(label+"-"+view+"-windows.jpg"),quality=94,subsampling=0)
          PY
          for id in left-front right-reverse; do
            ffmpeg -y -loglevel error -i "$p/before/$id.mp4" -i "$p/after/$id.mp4" -filter_complex '[0:v]scale=960:600[a];[1:v]scale=960:600[b];[a][b]hstack[v]' -map '[v]' -c:v libx264 -preset veryfast -crf 16 -pix_fmt yuv420p "$p/$id-same-speed.mp4"
          done
          git add -- "$p"
          git -c user.name='River Gate animation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record two identical live blocks from both 22 metre field directions'
          git push origin HEAD:refs/heads/codex/river-shield-brace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-shield-brace
          path: docs/evidence/river-gate-v1-rc22/shield-brace
