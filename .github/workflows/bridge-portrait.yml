name: Check face and hand pixels on the posing RC22 soldier
on:
  push:
    branches: ['codex/river-rc22-portrait-socket']
    paths: ['.github/workflows/bridge-portrait.yml', 'tests/field_controls.gd', 'tests/bridge_portrait_socket.gd']
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Godot runtime and native input tool
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          if ! command -v xdotool >/dev/null || ! command -v ffmpeg >/dev/null || ! /usr/bin/python3 -c 'from PIL import Image'; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xdotool python3-pil; fi
          mkdir -p artifacts/bridge-window
          touch artifacts/.gdignore
          ./tools/prepare-font.sh
          godot --headless --editor --path . --import > artifacts/bridge-window/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' artifacts/bridge-window/import.log; then exit 1; fi
      - name: Inspect the same standing soldier with the shipping camera and shader
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --resolution 1280x800 --fixed-fps 30 --audio-driver Dummy --script tests/bridge_portrait_socket.gd -- --field-size=20 2>&1 | tee artifacts/portrait-socket.log
          grep '^PORTRAIT_SOCKET_OK' artifacts/portrait-socket.log
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' artifacts/portrait-socket.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standing-soldier-original-portrait
          path: |
            artifacts/portrait-socket.log
            artifacts/soldier-portrait.jpg
