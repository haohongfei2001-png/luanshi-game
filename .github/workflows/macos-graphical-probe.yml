name: Probe native macOS graphics (explicit, not M5 acceptance)

on:
  push:
    branches: [main]
    paths: ['.github/probes/native-macos-v06.json']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful verify.yml run containing the unchanged macOS export
        required: true
        type: string
      source_sha:
        description: Full 40-character head_sha of that successful workflow run
        required: true
        type: string

      artifact_sha:
        description: Full SHA suffix in Luanshi-macOS artifact name (PR merge SHA can differ)
        required: true
        type: string
      expected_archive_sha256:
        description: SHA-256 of the inner Luanshi-macOS.zip, not the artifact service wrapper
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: native-macos-graphical-probe
  cancel-in-progress: false

jobs:
  native-graphics-probe:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact successful source run before executing its artifact
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
        with:
          script: |
            await require('./tools/macos_probe_source.cjs')({
              github, context, core, fs: require('fs')
            });
      - name: Download the already verified exported application
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: package
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Run bounded native window and viewport probe
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ steps.source.outputs.expected_archive_sha256 }}
        run: >-
          python3 tools/probe_macos_graphics.py package/Luanshi-macOS.zip mac-graphics-evidence
          --expected-archive-sha256 "$EXPECTED_ARCHIVE_SHA256"
      - name: Upload evidence even when graphics are unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-graphics-${{ steps.source.outputs.artifact_sha || github.sha }}-${{ github.run_id }}
          path: mac-graphics-evidence/
          if-no-files-found: warn
          retention-days: 14
