name: Repeat cold Metal launches of the isolated upstream mutex fix
on:
  push:
    branches: ['codex/river-rc23-mobile-cold']
    paths: ['.github/workflows/mobile-cold.yml']
permissions:
  contents: read
  actions: read
jobs:
  cold:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-macOS-88bd036da5927c4699f176bf2f72633a6e45bbdb
          path: package
          run-id: '43547163844'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: mobile-mutex-native-probe
          path: patch
          run-id: '43550761384'
          github-token: ${{ github.token }}
      - name: Verify the prior binary and reconstruct the identical isolated app
        run: |
          set -euo pipefail
          ditto -x -k package/Luanshi-macOS.zip package/unpacked
          python3 - <<'PY'
          import hashlib,json,plistlib,shutil,subprocess
          from pathlib import Path
          receipt=json.loads((Path("patch")/"provenance.json").read_text())
          binary=Path("patch/godot.macos.template_release.arm64")
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==receipt["patched_binary_sha256"]
          app,=Path("package/unpacked").glob("*.app")
          exe=app/"Contents/MacOS"/plistlib.loads((app/"Contents/Info.plist").read_bytes())["CFBundleExecutable"]
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==receipt["original_binary_sha256"]
          shutil.copyfile(binary,exe);exe.chmod(0o755)
          subprocess.run(["codesign","--force","--deep","--sign","-",str(app)],check=True)
          subprocess.run(["codesign","--verify","--deep","--strict",str(app)],check=True)
          PY
          ditto -c -k --keepParent package/unpacked/*.app package/patched-macOS.zip
      - name: Repeat six independent empty-data Metal starts and three focus interruptions
        run: |
          set -euo pipefail
          status=0
          for pass in 1 2 3; do
            python3 tools/rc3_native_probe.py package/patched-macOS.zip package/unpacked "artifacts/cold-$pass" --startup-regression || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-mutex-cold-series
          path: |
            artifacts/
            patch/provenance.json
            patch/actual.patch
            patch/engine-version.txt
