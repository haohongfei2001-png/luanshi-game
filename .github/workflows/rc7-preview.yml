name: Review the current River Gate game window
on:
  push:
    branches: [codex/river-rc7-art-preview]
permissions:
  contents: read
jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot and import the project
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          godot --headless --editor --import --path . >/tmp/rg-import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/rg-import.log; then exit 1; fi
      - name: Play to a personal strike at normal zoom on the unmodified battlefield
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts && touch artifacts/.gdignore
          timeout 310s xvfb-run -a -s '-screen 0 1920x1200x24' godot --path . --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script tests/rc7_personal_contact.gd -- --field-size=512 2>&1 | tee /tmp/rg-window.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/rg-window.log; then exit 1; fi
          grep -q '^RC7_PERSONAL_PASS' /tmp/rg-window.log
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          import base64,io
          from PIL import Image
          for key in ('personal-windup','personal-contact'):
              im=Image.open('artifacts/personal-contact/'+key+'.png').convert('RGB')
              for width in [1280,1920]:
                  size=(width,int(im.height*width/im.width))
                  view=im.resize(size,Image.Resampling.LANCZOS) if width<im.width else im
                  buf=io.BytesIO();view.save(buf,'JPEG',quality=90,subsampling=0)
                  print('RC7_CONTACT',key,width,base64.b64encode(buf.getvalue()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-strike-full-windows
          path: |
            artifacts/personal-contact/
            /tmp/rg-window.log
          retention-days: 14
