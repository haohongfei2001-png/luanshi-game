name: Review the current River Gate game window
on:
  push:
    branches: [codex/river-rc7-art-preview]
permissions:
  contents: read
jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot and import the project
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          godot --headless --editor --import --path . >/tmp/rg-import.log 2>&1
          if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/rg-import.log; then exit 1; fi
      - name: Prove that only increasing milestones extend an idle budget
        run: |
          set -euo pipefail
          python3 tools/record-progress.py --idle 1 --limit 4 -- python3 -u -c "import time;print('JOURNEY_STAGE 01-muster tick=0');time.sleep(.65);print('JOURNEY_PROGRESS tick=100');time.sleep(.65);print('JOURNEY_STAGE 02-deploy tick=100')"
          set +e
          python3 tools/record-progress.py --idle 1 --limit 6 -- python3 -u -c "import time;print('JOURNEY_PROGRESS tick=100');[(print('JOURNEY_PROGRESS tick=100'),time.sleep(.25)) for _ in range(15)]"
          status=$?
          set -e
          test "$status" -eq 124
      - name: Record real battle and campaign return with the original quality
        run: |
          set -euo pipefail
          if ! command -v xdotool >/dev/null || ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xdotool ffmpeg; fi
          ./tools/test-field-journey.sh
          ./tools/test-field-render.sh journey
      - name: Keep the checked continuous recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-recovery
          path: |
            artifacts/journey*.log
            artifacts/journey*.json
            artifacts/field-escort*.log
            artifacts/field-outcomes.log
            artifacts/river-gate-journey.mp4
            artifacts/river-gate-review.mp4
          retention-days: 14
