name: Complete author nine-weight head on actual Metal (not art acceptance)
on:
  push:
    branches: ['dot/complete-source-runtime']
    paths: ['tools/art/soldier_runtime/**', 'scripts/review/complete_head/**', '.github/workflows/complete-source-head-metal.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: '945b2c676705460f97ba0d9e5c9d892f2a64390d'
          path: source-build
          persist-credentials: false
      - name: Locked official Blender and exact current author source
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "$GITHUB_SHA" > evidence/source-sha.txt
          curl -A 'LuanshiAssetRecovery/1.0 (+https://github.com/haohongfei2001-png/luanshi-game)' -fsSL https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo /tmp/blender-4.3.2-linux-x64 >> "$GITHUB_PATH"
      - name: Preserve full mothers and evaluate original full-nine reference
        env:
          HEAD_BUILD: ${{ runner.temp }}/head-source
          SOURCE_REPO: ${{ github.workspace }}/source-build
          ORACLE_REPO: ${{ github.workspace }}
        run: bash tools/art/soldier_runtime/rebuild_head.sh > evidence/source-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-head-editable-source-${{ github.sha }}
          path: evidence/
          retention-days: 30
  metal:
    needs: source
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: complete-head-editable-source-${{ github.sha }}
          path: .inputs/source
      - uses: actions/download-artifact@v4
        with:
          name: mobile-mutex-angle-template
          run-id: '43580708251'
          github-token: ${{ github.token }}
          path: .inputs/engine
      - name: Restore own verified source and fixed existing Metal engine
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/head-project"
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('.inputs/source/head-project.tar.gz');expected=pathlib.Path('.inputs/source/head-project.sha256').read_text().split()[0]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          PY
          tar -xzf .inputs/source/head-project.tar.gz -C "$RUNNER_TEMP/head-project"
          echo '9cb81197d4402a2b5b57719ba7f89616b90ebbb33e88dbb6dbab7c588fc036d3  .inputs/engine/godot.macos.template_release.arm64' | shasum -a 256 -c -
          { uname -a; sw_vers; system_profiler SPHardwareDataType SPDisplaysDataType; } > evidence/host.txt
      - name: Pinned official importer and strict checker
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip -o "$RUNNER_TEMP/editor.zip"
          echo "0155bbc8dcf179edab4ef08e3dbbd4480d7434ab1990cb3fb25517d453b1b65787c7fe6dfc8824b15ff25e1fdcec59e8584f765054106894fee00311868c3964  $RUNNER_TEMP/editor.zip" | shasum -a 512 -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/editor"
          echo "GODOT_EDITOR=$RUNNER_TEMP/editor/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/head-python"
          "$RUNNER_TEMP/head-python/bin/pip" install 'Pillow==11.1.0'
          clang -fobjc-arc -framework AppKit -o "$RUNNER_TEMP/head-focus" tools/metal_character_oracle/focus.m
      - name: Actual full-source reference and shared GPU, original strict gate
        run: |
          set -euo pipefail
          "$GODOT_EDITOR" --headless --editor --path "$RUNNER_TEMP/head-project" --import > evidence/import.log 2>&1
          python3 tools/representation_compare/assert_clean_logs.py evidence/import.log
          python3 tools/art/soldier_runtime/run_mac.py "$GODOT_EDITOR" "$RUNNER_TEMP/head-project" "$PWD/.inputs/engine" "$PWD/evidence" "$RUNNER_TEMP/head-focus"
          "$RUNNER_TEMP/head-python/bin/python" tools/art/soldier_runtime/check_gpu.py evidence/gpu evidence/actual-metal.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-head-actual-metal-${{ github.sha }}
          path: evidence/
          retention-days: 30
