name: Review painted cart wear and the objective in normal play
on:
  push:
    branches: ['codex/river-road-shoulders']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay the actual field input and regular follow camera on both revisions
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/engine.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/engine.zip' | sha512sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          g=/tmp/engine/Godot_v4.6.3-stable_linux.x86_64
          mkdir -p proof
          node tools/env_cartway.mjs --check
          ./tools/prepare-font.sh
          for side in before after; do
            rev=HEAD
            if [[ $side == before ]]; then rev=5e12030486991d259c344b038605a13a70308ec7; fi
            root=/tmp/river-road-$side
            mkdir -p "$root"
            git archive "$rev" | tar -x -C "$root"
            cp -a assets/fonts/. "$root/assets/fonts/"
            "$g" --headless --editor --path "$root" --import >"proof/$side-import.log" 2>&1
            if grep -E -A3 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side-import.log"; then "$g" --headless --path "$root" --check-only --script scripts/field/env_foothills.gd; exit 1; fi
            xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script tests/rc7_personal_contact.gd -- --field-size=512 2>&1 | tee "proof/$side.log"
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side.log"; then exit 1; fi
            grep -q '^RC7_PERSONAL_PASS' "proof/$side.log"
            mv "$root/artifacts/personal-contact" "proof/$side"
          done
          python3 -c 'from PIL import Image' || python3 -m pip install --user Pillow
          python3 tools/road_picture_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-road-shipping-cameras
          path: proof/
          retention-days: 14
