name: RC3 saddlery in-window smoke
on:
  push:
    branches: [codex/rc3-tail-lab]
    paths:
      - .github/workflows/rc3-saddlery-smoke.yml
      - tests/rc3_saddlery_smoke.gd
      - tools/rc3-saddlery-stage.py
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: bad1814f3c905d321dae5ca142d27bd5a9ca5e4e
          path: game
      - name: Reproduce baked art and import with Godot 4.6.3
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          if ! node tools/art/bake_mounts.mjs --check; then
            mkdir -p "$RUNNER_TEMP/saddlery"
            cp assets/art/mounts/mounts.bin "$RUNNER_TEMP/original.bin"
            cp assets/art/mounts/mount-atlas.png "$RUNNER_TEMP/original.png"
            node tools/art/bake_mounts.mjs
            python3 - <<'PY'
          from pathlib import Path
          import json,os
          d=Path(os.environ['RUNNER_TEMP'])
          for name,fn in [('bin','mounts.bin'),('png','mount-atlas.png')]:
              a=(d/('original.'+name)).read_bytes(); b=(Path('assets/art/mounts')/fn).read_bytes()
              delta=[(i,y) for i,(x,y) in enumerate(zip(a,b)) if x!=y]
              print('MOUNT_BAKE_DELTA',name,len(a),len(b),len(delta),json.dumps(delta[:100]))
          (d/'saddlery/bake-failed').touch()
          PY
            git restore assets/art/mounts
          fi
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/mount-editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/mount-editor.zip' | sha512sum -c -
          unzip -q /tmp/mount-editor.zip -d /tmp/mount-editor
          sudo install /tmp/mount-editor/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          python3 ../lab/tools/rc3-saddlery-stage.py
          cp ../lab/tests/rc3_saddlery_smoke.gd tests/rc3_saddlery_smoke.gd
          godot --headless --editor --import --path .
      - name: Deploy and ride both vehicles in a real X11 viewport
        working-directory: game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TAIL_ART_OUT: ${{ runner.temp }}/saddlery
        run: |
          set -euo pipefail
          mkdir -p "$TAIL_ART_OUT"
          timeout 150s xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --resolution 1040x650 --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 30 --script tests/rc3_saddlery_smoke.gd 2>&1 | tee "$TAIL_ART_OUT/render.log"
          grep -q MOUNT_ART_PASS "$TAIL_ART_OUT/render.log"
          if grep -Ei 'SHADER ERROR|SCRIPT ERROR|Error compiling|shader compilation failed' "$TAIL_ART_OUT/render.log"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import os,base64
          directory=os.environ['TAIL_ART_OUT']
          for name in ['saddle-near','cart-near']:
              data=base64.b64encode((Path(directory)/(name+'.jpg')).read_bytes()).decode()
              for i in range(0,len(data),4096): print('MOUNT_JPEG',name,i,data[i:i+4096])
          PY
          test ! -f "$TAIL_ART_OUT/bake-failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saddlery-game-window
          path: ${{ runner.temp }}/saddlery/
          retention-days: 45
