name: Read real camera frames at their original size
on:
  push:
    branches: ['codex/river-gate-art-screen']
permissions: { actions: read, contents: read }
jobs:
  view:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: figure-workshop
          run-id: 43260424575
          github-token: ${{ github.token }}
          path: frames
      - name: Read actor surfaces in the actual 1280 by 800 frame
        run: |
          python3 -c 'from PIL import Image' || python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          import pathlib, io, base64
          for name in ['hero','officer','contact']:
              p=next(pathlib.Path('frames').rglob('after/'+name+'.jpg'))
              im=Image.open(p)
              for label,box in [('full',(0,0,1280,800)),('centre',(350,140,895,651))]:
                  pic=im.crop(box)
                  if label=='full': pic.thumbnail((970,630))
                  b=io.BytesIO()
                  pic.save(b,'JPEG',quality=85)
                  print('TAILOR_READ',name,label,base64.b64encode(b.getvalue()).decode())
          PY
