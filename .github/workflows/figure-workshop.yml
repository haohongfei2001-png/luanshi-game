name: Display the actual RC4 window stills
on:
  push:
    branches: [codex/river-gate-figure-workshop]
permissions:
  actions: read
  contents: write
jobs:
  stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/river-gate-rc4-evidence
      - name: Copy the original resolved game-window frames from the finished visual job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43268026943 -R "$GITHUB_REPOSITORY" -n river-art-b0f44c491fb47634539e73571cabf2c73519575b -D "$RUNNER_TEMP/plates"
          frame=$(find "$RUNNER_TEMP/plates" -path "*/after/frames.json" -print -quit)
          test -s "$frame"
          plate=$(dirname "$(dirname "$frame")")
          dest=docs/evidence/river-gate-v1-rc4
          mkdir -p "$dest"
          for shot in hero contact gate; do
            cp "$plate/after/$shot.jpg" "$dest/$shot.jpg"
            cp "$plate/$shot-pair.jpg" "$dest/$shot-pair.jpg"
          done
          cp "$plate/battlefield-motion.mp4" "$dest/battlefield-motion.mp4"
          cp "$plate/footwork-pair.mp4" "$dest/footwork-pair.mp4"
          git add -- "$dest"
          git -c user.name="Luanshi acceptance archive" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Show the original RC4 window frames and the continuous take to the artist"
          git push origin HEAD:refs/heads/codex/river-gate-rc4-evidence
