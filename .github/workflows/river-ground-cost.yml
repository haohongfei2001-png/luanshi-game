name: Compare matching river-gate presentation costs
on:
  push:
    branches: ['codex/river-ground-cost']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run identical changing poses in alternating order on one renderer
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/engine.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/engine.zip' | sha512sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          g=/tmp/engine/Godot_v4.6.3-stable_linux.x86_64
          mkdir -p proof
          ./tools/prepare-font.sh
          for side in before after; do
            rev=HEAD
            if [[ $side == before ]]; then rev=15f765982a39a257b4e388f91a9fb8a168edf4be; fi
            root=/tmp/cost-$side
            mkdir -p "$root"
            git archive "$rev" | tar -x -C "$root"
            cp tests/company_render_cost.gd "$root/tests/"
            cp -a assets/fonts/. "$root/assets/fonts/"
            "$g" --headless --editor --path "$root" --import >"proof/$side-import.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$side-import.log"; then exit 1; fi
          done
          for pass in 1-before 2-after 3-after 4-before; do
            root=/tmp/cost-${pass#*-}
            timeout 180s xvfb-run -a -s '-screen 0 1280x800x24' "$g" --path "$root" --resolution 1280x800 --audio-driver Dummy --disable-vsync --fixed-fps 60 --script tests/company_render_cost.gd -- --field-size=512 2>&1 | tee "proof/$pass.log"
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "proof/$pass.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for seq in ("1-before","2-after","3-after","4-before"):
              report=[json.loads(l.split(" ",1)[1]) for l in Path("proof",seq+".log").read_text().splitlines() if l.startswith("COMPANY_RENDER_COST ")]
              assert len(report)==4
              rows.append(report)
          for i in range(4):
              for k in ("tick","seed","per_side","hits","dead","visible","draws","triangles","camera_size"):
                  assert all(r[i][k]==rows[0][i][k] for r in rows),[i,k,[r[i][k] for r in rows]]
          print("COST_COMPARE",json.dumps(rows,separators=(",",":")))
          Path("proof/costs.json").write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-frame-cost-comparison
          path: proof/
