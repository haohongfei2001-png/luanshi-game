name: Photograph river gate character and landscape changes
on:
  push:
    branches: ['codex/river-craft-final-window']
permissions:
  contents: read
  actions: read
jobs:
  bakes-and-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse the identical lossless baseline and match every input and visible ID
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: '43366685292'
          artifact-ids: '14011430610'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: prior
      - name: Bake and audit the actual game assets
        run: |
          set -euo pipefail
          python3 -m pip -q install Pillow==11.3.0 imageio-ffmpeg==0.6.0
          mkdir -p proof/bakes
          cp -a prior/before proof/before
          cp prior/before.mp4 proof/before.mp4
          node tools/env_assets.mjs --check-ram
          node tools/art/bake_field_garments.mjs --check
          node tools/art/bake_mounts.mjs --check
          python3 tools/art/check_field_carries.py | tee proof/bakes/hand-sockets.log
          python3 tools/art/check_company_motion.py | tee proof/bakes/all-kits.log
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,hashlib,shutil
          p=Path("proof/bakes"); marks={}
          for name in ("assets/environment/river_ram.gltf",):
              path=Path(name); raw=path.read_bytes()
              shutil.copyfile(path,p/path.name)
              enc=base64.b64encode(raw).decode()
              receipt=(len(raw),hashlib.sha256(raw).hexdigest(),hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest(),len(enc))
              print("CRAFT_ASSET_INFO",name,*receipt)
              marks[name]=receipt
              for at in range(0,len(enc),14000): print("CRAFT_ASSET_PART",name,at,enc[at:at+14000])
          (p/"receipts.json").write_text(json.dumps(marks,indent=2))
          PY
      - name: Compare two real game windows
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          g=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          ./tools/prepare-font.sh
          ffmpeg_bin=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          for side in after; do
            rev=d104143d48d6bf14405b540b3fec923c16f0edf7
            if [[ "$side" == after ]]; then rev=HEAD; fi
            root=/tmp/river-frame-$side
            mkdir -p "$root"
            git archive "$rev" | tar -x -C "$root"
            cp tests/river_craft_camera.gd "$root/tests/"
            cp -a assets/fonts/. "$root/assets/fonts/"
            if [[ "$side" == after ]]; then
              cp proof/bakes/river_ram.gltf "$root/assets/environment/"
            fi
            "$g" --headless --editor --path "$root" --import >"proof/$side-import.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "proof/$side-import.log"; then exit 1; fi
            for script in gatehouse_sightline river_craft_camera rc7_personal_contact; do
              timeout 245s xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script "tests/$script.gd" -- --field-size=512 2>&1 | tee "proof/$side-$script.log"
              if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "proof/$side-$script.log"; then exit 1; fi
            done
            cp -a "$root/artifacts/river-art" "proof/$side"
            cp -a "$root/artifacts/personal-contact" "proof/$side/normal"
            "$ffmpeg_bin" -nostdin -loglevel error -y -framerate 30 -i "proof/$side/play-%03d.jpg" -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart "proof/$side.mp4"
            python3 tools/check_playfield.py "proof/$side/field.png" "proof/$side/normal/personal-contact.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,io,base64,hashlib
          from PIL import Image,ImageDraw,ImageStat,ImageChops
          p=Path("proof")
          for name in ("frames.json","normal/input.json"):
              old,new=[json.loads((p/s/name).read_text()) for s in ("before","after")]
              assert old==new and len(new)>1,(name,old,new)
              print("CRAFT_RECEIPT",name,json.dumps(new,separators=(",",":")))
          def record(im,label,quality):
              out=io.BytesIO();im.save(out,"JPEG",quality=quality,subsampling=0); raw=out.getvalue()
              (p/(label+".jpg")).write_bytes(raw);enc=base64.b64encode(raw).decode()
              print("CRAFT_INFO",label,len(raw),hashlib.sha256(raw).hexdigest(),len(enc))
              for at in range(0,len(enc),12000): print("CRAFT_PART",label,at,enc[at:at+12000])
          for name in ("normal/personal-contact","field","foot","horse","gate","river","captain","ranks"):
              a,b=[Image.open(p/s/(name+".png")).convert("RGB") for s in ("before","after")]
              label=name.split("/")[-1]
              assert a.size==b.size==(1920,1200)
              delta=ImageStat.Stat(ImageChops.difference(a,b)).mean
              print("CRAFT_DELTA",label,delta)
              if label in ("personal-contact","field","foot","horse","captain"): assert max(delta)>.03
              if label in ("personal-contact","gate","river"): record(b.copy().resize((1440,900),Image.Resampling.LANCZOS),label+"-window",89)
              pair=Image.new("RGB",(1440,520))
              for i,im in enumerate((a,b)):pair.paste(im.crop((585,360,1305,880)),(720*i,0))
              record(pair,label+"-pair",90)
          PY
      - name: Keep lossless frames, videos and exact baked models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-craft-windows-and-models
          path: proof/
