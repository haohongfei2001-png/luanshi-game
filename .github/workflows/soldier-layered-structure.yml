name: Whole layered clothing structure oracle (not accepted)
on:
  push:
    branches: ['dot/soldier-layered-structure']
    paths: ['.github/workflows/soldier-layered-structure.yml', 'tools/art/sintel_guard/**', 'tools/art/soldier_controlled_probe/**']
  workflow_dispatch:
jobs:
  controlled-actor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p evidence
      - name: Install existing free software-render tools
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri ffmpeg
      - name: Pinned official Blender and Godot
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee evidence/tool-install.log) 2>&1
          UA='LuanshiAssetRecovery/1.0 (+https://github.com/haohongfei2001-png/luanshi-game)'
          printf 'Explicit public client: %s\n' "$UA"
          # Blender's listed RWTH mirror; exact same vendor archive, not a rebuild.
          curl -A "$UA" -fsSL https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /tmp;echo /tmp/blender-4.3.2-linux-x64 >> "$GITHUB_PATH"
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot;chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
      - name: Recover complete legal source and evaluate unified actor
        env:
          SOLDIER_WORK: ${{ runner.temp }}/controlled-soldier
        run: bash tools/art/soldier_controlled_probe/rebuild_layered.sh
      - name: Preserve complete oracle cache as independently downloadable parts
        run: CACHE_PART_LIMIT=20 python tools/art/soldier_controlled_probe/package_cache.py "${{ runner.temp }}/controlled-soldier/layered-cache" cache-transfer
      - name: Actual native2K4K whole-actor walk and thrust
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SOLDIER_CACHE: ${{ runner.temp }}/controlled-soldier/layered-cache
        shell: bash
        run: |
          set -euo pipefail
          uname -a > evidence/hardware.txt;lscpu >> evidence/hardware.txt
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          for CLIP in walk thrust hit_braced; do
            for SPEC in 'normal 2560x1440' 'near 3840x2160'; do
              read -r CAMERA SIZE <<< "$SPEC"
              SOLDIER_CLIP=$CLIP SOLDIER_CAMERA=$CAMERA SOLDIER_PHASE=0.5 SOLDIER_OUTPUT="$PWD/evidence/$CLIP-$CAMERA" timeout 180 xvfb-run -a -s '-screen 0 3840x2160x24' "$GODOT" --path tools/art/soldier_controlled_probe --resolution "$SIZE" --rendering-method gl_compatibility --audio-driver Dummy 2>&1 | tee "evidence/$CLIP-$CAMERA.log"
            done
            SOLDIER_CLIP=$CLIP SOLDIER_CAMERA=normal SOLDIER_RECORD=1 SOLDIER_OUTPUT="$PWD/evidence/$CLIP-motion" timeout 180 xvfb-run -a -s '-screen 0 2560x1440x24' "$GODOT" --path tools/art/soldier_controlled_probe --resolution 2560x1440 --rendering-method gl_compatibility --audio-driver Dummy 2>&1 | tee "evidence/$CLIP-motion.log"
            python tools/art/sintel_guard/encode_monotonic.py "evidence/$CLIP-motion"
          done
          SOLDIER_TURN=1 SOLDIER_CLIP=walk SOLDIER_CAMERA=normal SOLDIER_RECORD=1 SOLDIER_OUTPUT="$PWD/evidence/turn-root" timeout 180 xvfb-run -a -s '-screen 0 2560x1440x24' "$GODOT" --path tools/art/soldier_controlled_probe --resolution 2560x1440 --rendering-method gl_compatibility --audio-driver Dummy 2>&1 | tee evidence/turn-root.log
          python tools/art/sintel_guard/encode_monotonic.py evidence/turn-root
          SOLDIER_OUTPUT="$PWD/evidence/color-calibration" timeout 45 xvfb-run -a -s '-screen 0 1280x320x24' "$GODOT" --path tools/art/soldier_controlled_probe --resolution 1280x320 --rendering-method gl_compatibility --audio-driver Dummy --script res://color_probe.gd 2>&1 | tee evidence/color-calibration.log
          if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' evidence/walk-*.log evidence/thrust-*.log evidence/hit_braced-*.log evidence/turn-root.log evidence/color-calibration.log; then
            echo "Engine error found in actual probe logs" >&2; exit 1
          else
            status=$?; test "$status" -eq 1 || exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-whole-soldier-actual-software-Godot
          path: evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('cache-transfer/cache.part00') != ''
        with:
          name: controlled-cache-part00
          path: cache-transfer/cache.part00
          compression-level: 0
          retention-days: 14
