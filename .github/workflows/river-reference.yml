name: Inspect the design plates and the true-size crossing
on:
  push:
    branches: [codex/river-reference-native-uhd]
    paths: ['.github/workflows/river-reference.yml']
permissions:
  contents: write
jobs:
  crossing:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Register the source plates at a viewable size
        run: |
          set -eu
          dst=docs/evidence/river-gate-v1-rc23/reference
          mkdir -p "$dst"
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for file in Path('docs/art-direction/river-gate').glob('*.png'):
              im=Image.open(file)
              print(file,im.size)
              im.thumbnail((1500,1050))
              im.convert('RGB').save(Path('docs/evidence/river-gate-v1-rc23/reference')/(file.stem+'.jpg'),quality=91,subsampling=0)
          PY
          git add "$dst"
          git -c user.name='River Gate verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Register exact repository design plates for the matching camera comparison'
          git push origin HEAD:refs/heads/codex/river-reference-native-uhd
      - name: Prepare the pinned game runtime and real-input driver
        run: |
          set -eu
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 2 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/g
          if ! command -v xdotool >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xdotool; fi
          mkdir -p artifacts/bridge-window
          touch artifacts/.gdignore
          ./tools/prepare-font.sh
          /tmp/g/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import > /tmp/import.log 2>&1
          if grep -E 'ERROR:|Parse Error|SHADER ERROR' /tmp/import.log; then exit 1; fi
      - name: Play the same bridge charge at physical 1440p and 2160p
        run: |
          set -eu
          for dims in 2560x1440 3840x2160; do
            out="docs/evidence/river-gate-v1-rc23/reference/$dims"
            mkdir -p "$out"
            printf '[display]\nwindow/size/window_width_override=%s\nwindow/size/window_height_override=%s\n' "${dims%x*}" "${dims#*x}" > override.cfg
            xvfb-run -a -s "-screen 0 ${dims}x24" /tmp/g/Godot_v4.6.3-stable_linux.x86_64 --path . --display-driver x11 --resolution "$dims" --audio-driver Dummy --disable-vsync --fixed-fps 24 --script tests/bridgehead_window.gd -- --bridge-stills > "$out/window.log" 2>&1
            grep -F 'BRIDGE_WINDOW true' "$out/window.log"
            cp artifacts/bridge-window/input-and-camera.json "$out/"
            DIM="$dims" DST="$out" /usr/bin/python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from PIL import Image
          size=tuple(map(int,os.environ['DIM'].split('x')))
          dst=Path(os.environ['DST'])
          source=Path('artifacts/bridge-window')
          receipt=json.loads((dst/'input-and-camera.json').read_bytes())
          assert receipt['internal']==1. and receipt['ordinary']==[512,512] and not receipt['different_lens']
          for name in ['view-0050.jpg','view-0105.jpg','view-0145.jpg']:
              p=source/name
              im=Image.open(p)
              assert im.size==size,(p,im.size,size)
              shutil.copyfile(p,dst/name)
              im.thumbnail((1440,810))
              im.save(dst/(p.stem+'-preview.jpg'),quality=93,subsampling=0)
          print(size,receipt['last']['hits'],receipt['first_player_strike'])
          PY
            git add "$out"
            git -c user.name='River Gate verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Archive the physical $dims window and the corresponding battle inputs"
            git push origin HEAD:refs/heads/codex/river-reference-native-uhd
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-native-reference-frames
          path: docs/evidence/river-gate-v1-rc23/reference/
