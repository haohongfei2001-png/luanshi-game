name: Diagnose the complete authored horse hierarchy
on:
  push:
    branches: [codex/river-rc23-complete-remount]
    paths: ['tools/art/bake_native_remount.py','.github/workflows/native-remount-study.yml','scripts/field/mount_hide.gdshader']
permissions:
  contents: write
  actions: read
concurrency:
  group: native-remount-study
  cancel-in-progress: true
jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-remount-original-speed
          run-id: 43563632815
          github-token: ${{ github.token }}
          path: /tmp/completed-baseline
      - name: Install small offline source tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy python3-pil ffmpeg
      - name: Retain the completed original film and first support failure
        shell: bash
        run: |
          set -euo pipefail
          proof=docs/evidence/river-gate-v1-rc23/native-remount/motion
          mkdir -p "$proof" reports/remount
          cp /tmp/completed-baseline/docs/evidence/river-gate-v1-rc23/native-remount/motion/before* "$proof/"
          cp /tmp/completed-baseline/reports/remount/native.json "$proof/rejected-parent-freeze.json"
          sha256sum "$proof/"before*.mp4 >"$proof/baseline-video-sha256.txt"
          for view in normal close; do
            mkdir -p "artifacts/decoded/$view"
            ffmpeg -v error -i "$proof/before-$view.mp4" -start_number 0 "artifacts/decoded/$view/frame-%03d.png"
          done
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          out=Path("docs/evidence/river-gate-v1-rc23/native-remount/motion")
          for view in ("normal","close"):
              sheet=Image.new("RGB",(1280,1600))
              for n,k in enumerate((0,4,8,12,16,20,25,31)):
                  im=Image.open(Path("artifacts/decoded")/view/f"frame-{k:03d}.png").convert("RGB")
                  assert im.size==(2560,1600)
                  if k in (0,8,20,31): im.save(out/f"before-{view}-{k:03d}-video-preview.jpg",quality=78,subsampling=2)
                  sheet.paste(im.resize((640,400),Image.Resampling.LANCZOS),((n%2)*640,(n//2)*400))
              sheet.save(out/f"before-{view}-eight-times.jpg",quality=86)
          PY
      - name: Measure the full FK source registered at the saddle
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/art/bake_native_remount.py /tmp/native-remount | tee reports/remount/full-fk.log
          git add assets/third_party/wildfire_remounts/complete_remount.glb assets/third_party/wildfire_remounts/native_pose_*.png assets/third_party/wildfire_remounts/native_pose_*.png.import reports/remount docs/evidence/river-gate-v1-rc23/native-remount/motion
          git -c user.name='River Gate native remount proof' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve the completed baseline film and measure full horse spine-parent motion'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-remount-full-hierarchy
          path: |
            reports/remount
            docs/evidence/river-gate-v1-rc23/native-remount/motion
          retention-days: 7
