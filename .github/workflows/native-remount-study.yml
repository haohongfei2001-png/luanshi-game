name: Evaluate the complete authored horse and original joint gait
on:
  push:
    branches: [codex/river-rc23-complete-remount]
    paths: ['tools/art/bake_native_remount.py','.github/workflows/native-remount-study.yml']
permissions:
  contents: write
concurrency:
  group: native-remount-study
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the source converter dependencies
        run: |
          if ! /usr/bin/python3 -c 'import numpy,PIL'; then sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy python3-pil; fi
      - name: Bake the actual licensed surface and its original joint animation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/remount
          /usr/bin/python3 tools/art/bake_native_remount.py /tmp/native-remount | tee reports/remount/bake.log
          git add assets/third_party/wildfire_remounts/complete_remount.glb assets/third_party/wildfire_remounts/native_pose_*.png reports/remount
          git -c user.name='River Gate complete remount study' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake the complete authored horse and native shoulder wrist hock and hoof movement'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-remount-source-study
          path: reports/remount
          retention-days: 7
