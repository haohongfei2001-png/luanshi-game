name: River gate craft comparison
on:
  push:
    branches: [codex/rc3-river-craft-lab]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: river-gate-craft-gameplay
          path: proof
          run-id: 43225534315
          github-token: ${{ github.token }}
      - name: Inspect the verified same-tick captures from the rendering run
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          root=pathlib.Path('proof')
          samples=[]
          for phase in ('before','after'):
              text=(root/phase/'game.log').read_text()
              record=json.loads(next(line.partition(" ")[2] for line in text.splitlines() if line.startswith("RIVER_CRAFT ")))
              samples.append(record)
              for name in ('gate','river','battle','camp'):
                  p=root/phase/(name+'.jpg')
                  data=p.read_bytes()
                  assert data[:2]==b'\xff\xd8' and data[-2:]==b'\xff\xd9' and len(data)>8000
                  wire=base64.b64encode(data).decode()
                  for pos in range(0,len(wire),16000):
                      print('ENV_JPEG',phase,name,pos//16000,wire[pos:pos+16000])
          assert samples[0]==samples[1]
          print('MATCHED_GAME_VIEWS',json.dumps(samples[1],ensure_ascii=False))
          PY
