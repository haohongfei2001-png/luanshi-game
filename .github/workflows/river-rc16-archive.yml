name: Archive genuine river-gate captures and the exported battle movie
on:
  push:
    branches: ['codex/river-rc16-library-worker']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 591a616e15379d074cf0946d5972e83c4fb866f5
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: river-art-d0d665d6c61a7676ff8f4785c3f5be4bccb74b08
          path: /tmp/river-art
          run-id: 43488066137
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-verification-d0d665d6c61a7676ff8f4785c3f5be4bccb74b08
          path: /tmp/river-mac
          run-id: 43488066137
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: exported-game-window-d0d665d6c61a7676ff8f4785c3f5be4bccb74b08
          path: /tmp/river-film
          run-id: 43488066137
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-journey-d0d665d6c61a7676ff8f4785c3f5be4bccb74b08
          path: /tmp/field-journey
          run-id: 43488066137
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: checked-grove-game-windows
          path: /tmp/grove-images
          run-id: 43486379773
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-macOS-d0d665d6c61a7676ff8f4785c3f5be4bccb74b08
          path: /tmp/apple-app
          run-id: 43488066137
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Luanshi-Linux-d0d665d6c61a7676ff8f4785c3f5be4bccb74b08
          path: /tmp/linux-game
          run-id: 43488066137
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: rc16-first-metal-failure-and-native-window
          path: /tmp/failed-metal
          run-id: 43491339985
          github-token: ${{ github.token }}
      - name: Copy the original captures, match the app hash and publish only this evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, plistlib, shutil, struct, tarfile, zipfile
          from pathlib import Path
          d=Path("docs/evidence/river-gate-v1-rc16")
          d.mkdir(parents=True,exist_ok=True)
          ri=Path("/tmp/river-art")
          root=next(ri.rglob("before-22m")).parent
          mac=Path("/tmp/river-mac")
          mov=Path("/tmp/river-film")
          rec=json.loads(next(mov.rglob("export-recording.json")).read_bytes())
          include={
              "normal-camera-before-after/before.png":root/"before-22m/personal-contact.png",
              "normal-camera-before-after/after.png":root/"normal-22m/personal-contact.png",
              "normal-camera-before-after/windup-before.png":root/"before-22m/personal-windup.png",
              "groves/trees-pair.jpg":Path("/tmp/grove-images/trees-pair.jpg"),
              "groves/river-pair.jpg":Path("/tmp/grove-images/river-pair.jpg"),
              "groves/gate-pair.jpg":Path("/tmp/grove-images/gate-pair.jpg"),
              "groves/combat-pair.jpg":Path("/tmp/grove-images/combat-pair.jpg"),
              "startup/default-metal-1-before-scene.sample.txt":Path("/tmp/failed-metal/default-metal-1-before-scene.sample.txt"),
              "startup/default-metal-1.log":Path("/tmp/failed-metal/default-metal-1.log"),
              "startup/default-metal-1-focus.log":Path("/tmp/failed-metal/default-metal-1-focus.log"),
              "metal-renderer-comparison.json":next(mac.rglob("renderer-comparison.json")),
              "metal-window-frames.json":next(mac.rglob("shipping-metal-frames.json")),
              "normal-camera-before-after/windup.png":root/"normal-22m/personal-windup.png",
              "close.png":root/"after/hero.png","mid.png":root/"after/formation.png",
              "wide.png":root/"after/ranks.png",
              "metal-window.png":next(mac.rglob("shipping-metal.png")),
              "playthrough-review.mp4":next(Path("/tmp/field-journey").rglob("river-gate-review.mp4")),
              "playthrough-full.mp4":next(Path("/tmp/field-journey").rglob("river-gate-journey.mp4")),
              "journey-frames.jpg":next(Path("/tmp/field-journey").rglob("journey-frames.jpg")),
              "normal-review.jpg":root/"normal-22m/normal-review.jpg",
              "normal-native.jpg":root/"normal-22m/normal-full.jpg",
              "normal-pair.jpg":root/"normal-22m/normal-pair.jpg",
              "combat-normal-speed.mp4":next(mov.rglob("combat-normal-speed.mp4")),
              "export-sequence.jpg":next(mov.rglob("export-sequence.jpg")),
              "export-recording.json":next(mov.rglob("export-recording.json")),
          }
          assert rec["export"]=="d0d665d6c61a7676ff8f4785c3f5be4bccb74b08" and rec["package_sha256"]=="03648c05d20ae52a7f381e47b719dd5d1a1b3e3fa29d70c4ad4b35baede52d61"
          assert max(r["end_tick"] for r in rec["samples"])>=570
          native=json.loads(next(mac.rglob("renderer-comparison.json")).read_bytes())
          assert native["archive_sha256"]=="5ad3811dbbc8419a78fe3218a4ebd27b4fdebb20bc514efa2c68c63bcd7c81d0" and native["shipping_window"]["validated"]
          apple=next(Path("/tmp/apple-app").rglob("Luanshi-macOS.zip"))
          linux=next(Path("/tmp/linux-game").rglob("Luanshi-linux.tar.gz"))
          assert hashlib.sha256(apple.read_bytes()).hexdigest()==native["archive_sha256"]
          assert hashlib.sha256(linux.read_bytes()).hexdigest()==rec["package_sha256"]
          with zipfile.ZipFile(apple) as app:
              names=app.namelist()
              notes=app.read("THIRD_PARTY_NOTICES.txt")
              info=plistlib.loads(app.read(next(k for k in names if k.endswith(".app/Contents/Info.plist"))))
              assert str(info["CFBundleVersion"])=="16016" and info["CFBundleIdentifier"]=="com.luanshi.prototype"
              loader=next(k for k in names if k.endswith(".app/Contents/MacOS/"+info["CFBundleExecutable"]))
              assert len(app.read(loader))>1000000
          with tarfile.open(linux) as package:
              linux_notes=package.extractfile(next(k for k in package if k.name.endswith("THIRD_PARTY_NOTICES.txt"))).read()
          assert notes==linux_notes and all(k in notes for k in (b"Wildfire Games", b"Attribution-ShareAlike 3.0",b"creativecommons.org/licenses/by-sa/3.0/",b"Quaternius",b"MakeHuman"))
          provenance={"bundle_version":info["CFBundleVersion"],"identifier":info["CFBundleIdentifier"],"archive_sha256":native["archive_sha256"],"linux_archive_sha256":rec["package_sha256"],"equal_notices":True,"notices_sha256":hashlib.sha256(notes).hexdigest(),"export_commit":rec["export"]}
          (d/"shipping-packages.json").write_text(json.dumps(provenance,indent=2)+"\n")
          timings=json.loads(next(mac.rglob("shipping-metal-frames.json")).read_bytes())["raw_wall_ms"]
          assert len(timings)==native["shipping_window"]["frames"]
          assert abs(max(timings)-native["shipping_window"]["max_ms"])<.001
          (d/"native-frame-times.json").write_text(json.dumps(timings,separators=(",",":"))+"\n")
          before,after=[json.loads((root/k/"input.json").read_text()) for k in ("before-22m","normal-22m")]
          assert before==after and len(after)==2
          (d/"normal-camera-before-after").mkdir(exist_ok=True)
          (d/"normal-camera-before-after/input.json").write_text(json.dumps(after,ensure_ascii=False,indent=2)+"\n")
          sums={}
          for name,path in include.items():
              raw=path.read_bytes()
              if name.endswith(".png"):
                  assert raw[:8]==b"\x89PNG\r\n\x1a\n"
                  w,h=struct.unpack(">II",raw[16:24])
                  if name!="metal-window.png": assert (w,h)==(1920,1200),(name,w,h)
              dest=d/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path,dest)
              sums[name]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
          assert sums["combat-normal-speed.mp4"]["sha256"]==rec["movie_sha256"]
          assert sums["playthrough-full.mp4"]["sha256"]=="f8d4206367a2121346c02427490aa82786cdb388d683bf9512fc2370e7f3b00f"
          assert sums["playthrough-review.mp4"]["sha256"]=="389e0c96e1a3cdf66a9d190295fafe70f2a82e1f4d328b0b97f2ea27f2851be1"
          (d/"capture-files.json").write_text(json.dumps(sums,indent=2)+"\n")
          print("ARCHIVED_ORIGINALS",json.dumps(sums))
          import base64
          print("EXPORT_CONTACT_SHEET",base64.b64encode((d/"export-sequence.jpg").read_bytes()).decode())
          PY
          git add -- docs/evidence/river-gate-v1-rc16/
          git -c user.name='River Gate build evidence' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Archive native camera PNGs, Metal timings and the played export"
          git push origin HEAD:refs/heads/codex/river-rc16-original-windows
