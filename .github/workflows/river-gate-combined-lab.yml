name: River gate integration probe
on:
  push:
    branches: [codex/river-gate-combined-lab]
permissions:
  contents: read
concurrency:
  group: river-gate-combined-lab
  cancel-in-progress: true
jobs:
  field:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot* /usr/local/bin/godot
          ./tools/prepare-font.sh
          mkdir -p artifacts
          touch artifacts/.gdignore
          godot --headless --editor --path . --import
      - name: Integrated field tests
        run: |
          failed=0
          for name in field_officers field_simulation field_traffic field_mission_cases; do
            if [[ -e tests/$name.gd ]]; then
              godot --headless --path . --script tests/$name.gd > "artifacts/$name.log" 2>&1 || failed=1
              awk 'length($0)<9000' "artifacts/$name.log" | tail -32
              if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "artifacts/$name.log"; then failed=1; fi
            fi
          done
          exit "$failed"
