name: River gate integration probe
on:
  push:
    branches: [codex/river-gate-combined-lab]
permissions:
  contents: read
concurrency:
  group: river-gate-combined-lab
  cancel-in-progress: true
jobs:
  field:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Godot
        run: |
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          sudo install /tmp/godot/Godot* /usr/local/bin/godot
          ./tools/prepare-font.sh
          mkdir -p artifacts
          touch artifacts/.gdignore
          godot --headless --editor --path . --import
      - name: Original pre-v4 save and committed battlefield
        run: |
          ./tools/test-field-history.sh
          godot --headless --path . --script tests/field_simulation.gd | tee artifacts/field-sim.log
          grep '^FIELD_SIM_PASS' artifacts/field-sim.log
      - name: Actual graphical weapon input
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 timeout 200s xvfb-run -a -s '-screen 0 1280x800x24' godot --path . --disable-vsync --resolution 1280x800 --audio-driver Dummy --fixed-fps 30 --script tests/field_controls.gd -- --field-size=20 > artifacts/inputs.log 2>&1
          grep -E '^FIELD_WEAPON_INPUT|^FIELD_CONTROLS' artifacts/inputs.log
      - name: Show failed steps
        if: failure()
        run: |
          awk 'length($0)<1600' artifacts/*.log | tail -65
