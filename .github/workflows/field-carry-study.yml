name: Review alternate carried postures in the actual river battle
on:
  push:
    branches: ['codex/river-field-carry-study']
permissions:
  contents: read
jobs:
  live-picture:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Bake the carried animation; keep the 279 shipping strips and real impact unchanged
        run: |
          set -euo pipefail
          python3 -c 'from PIL import Image' || python3 -m pip install Pillow==11.3.0
          mkdir -p proof
          git show HEAD^:assets/river_gate/figures/company_motion.png > /tmp/rc8-bank.png
          python3 -c 'from pathlib import Path; import sys; sys.path.insert(0,"tools/art"); from company_motion import bake_motion; bake_motion(Path("assets/river_gate/figures"))'
          python3 tools/art/check_field_carries.py /tmp/rc8-bank.png | tee proof/animation.log
          cp assets/river_gate/figures/company_motion.png proof/baked-company-motion.png
          sha256sum proof/baked-company-motion.png
      - name: Film the same real soldiers at close, player and formation distances
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$BASE/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/editor.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/editor.zip' | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/godot
          g=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          ./tools/prepare-font.sh
          for side in before after; do
            if [[ "$side" == before ]]; then revision=HEAD^; else revision=HEAD; fi
            root=/tmp/carry-$side
            mkdir -p "$root"
            git archive "$revision" | tar -x -C "$root"
            if [[ "$side" == after ]]; then cp proof/baked-company-motion.png "$root/assets/river_gate/figures/company_motion.png"; fi
            cp -a assets/fonts/. "$root/assets/fonts/"
            cp tests/field_carry_camera.gd "$root/tests/"
            "$g" --headless --editor --path "$root" --import >"proof/$side-import.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "proof/$side-import.log"; then exit 1; fi
            for script in field_carry_camera rc7_personal_contact; do
              timeout 165s xvfb-run -a -s '-screen 0 1920x1200x24' "$g" --path "$root" --resolution 1920x1200 --audio-driver Dummy --disable-vsync --fixed-fps 30 --script "tests/$script.gd" -- --field-size=512 2>&1 | tee "proof/$side-$script.log"
              if grep -E 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' "proof/$side-$script.log"; then exit 1; fi
            done
            cp -a "$root/artifacts/river-art" "proof/$side"
            cp -a "$root/artifacts/personal-contact" "proof/$side/normal"
            ffmpeg -nostdin -loglevel error -y -framerate 30 -i "proof/$side/play-%03d.jpg" -c:v libx264 -crf 19 -pix_fmt yuv420p -movflags +faststart "proof/$side.mp4"
          done
          python3 - <<'PY'
          import json, io, hashlib, base64
          from pathlib import Path
          from PIL import Image
          p=Path("proof")
          for path in ("frames.json","normal/input.json"):
              a,b=[json.loads((p/s/path).read_text()) for s in ("before","after")]
              assert a==b and len(b)>=2,(path,a,b)
              print("CARRY_RECEIPT",path,json.dumps(b,separators=(",",":")))
          for label in ("close","field","ranks","normal/personal-contact"):
              ims=[Image.open(p/s/(label+".png")).convert("RGB") for s in ("before","after")]
              assert ims[0].size==ims[1].size==(1920,1200)
              assert ims[0].tobytes()!=ims[1].tobytes()
              name=label.split("/")[-1]
              pair=Image.new("RGB",(1440,520))
              for i,im in enumerate(ims):
                  pair.paste(im.crop((585,365,1305,885)),(i*720,0))
              capture=io.BytesIO(); pair.save(capture,"JPEG",quality=91,subsampling=0)
              data=capture.getvalue(); (p/(name+"-pair.jpg")).write_bytes(data)
              enc=base64.b64encode(data).decode()
              print("CARRY_INFO",name,len(data),hashlib.sha256(data).hexdigest(),len(enc))
              for at in range(0,len(enc),10000): print("CARRY_PART",name,at,enc[at:at+10000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carried-postures-real-frames-and-baked-texture
          path: proof/
