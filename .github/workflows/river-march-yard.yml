name: Time live terrain movement on two equal forces
on:
  push:
    branches: ['codex/river-march-ground-pair']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Run both battle scripts on the same unmodified engine
        run: |
          set -euo pipefail
          src=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL --retry 2 "$src" -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/engine
          sudo install /tmp/engine/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          ./tools/prepare-font.sh
          godot --headless --editor --path . --import > /tmp/march-import.txt 2>&1
          if grep -E 'SHADER ERROR|SCRIPT ERROR|Parse Error|ERROR:' /tmp/march-import.txt; then exit 1; fi
          python3 tools/compare-ground-pace.py
      - uses: actions/upload-artifact@v4
        with:
          name: alternating-full-battle-step-times
          path: measured/
