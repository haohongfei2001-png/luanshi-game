name: Measure the cost of the fitted hands in the same real battle views
on:
  push:
    branches: [codex/river-hm08-render-cost]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sample line, melee, gate and moving camera
        run: |
          set -euo pipefail
          src=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fsSL --retry 2 "$src/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/engine.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/engine.zip' | sha512sum -c -
          unzip -q /tmp/engine.zip -d /tmp/engine
          g=/tmp/engine/Godot_v4.6.3-stable_linux.x86_64
          dst="$PWD/artifacts/hand-cost"
          mkdir -p "$dst"
          ./tools/prepare-font.sh
          for side in before after; do
            rev=5174644f92908a887f4e2ba8d92077af26d5d263
            if test "$side" = after; then rev=25558957154c4fb9a878edf17179986acb33cf48; fi
            dir="$RUNNER_TEMP/cost-$side"
            git worktree add --quiet --detach "$dir" "$rev"
            cp -a assets/fonts/. "$dir/assets/fonts/"
            (
              cd "$dir"
              "$g" --headless --editor --path . --import >"$dst/$side-import.log" 2>&1
              if grep -E -A3 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$dst/$side-import.log"; then exit 1; fi
              timeout 270s xvfb-run -a -s '-screen 0 1280x800x24' "$g" --path . --resolution 1280x800 --disable-vsync --audio-driver Dummy --script tests/company_render_cost.gd -- --field-size=512 2>&1 | tee "$dst/$side.log"
              if test "$(grep -c '^COMPANY_RENDER_COST' "$dst/$side.log")" != 4; then exit 1; fi
              if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|ERROR:' "$dst/$side.log"; then exit 1; fi
            )
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-hm08-four-views
          path: artifacts/hand-cost/
