name: Review the recorded cavalry comparison
on:
  push:
    branches: [codex/river-cavalry-picture-probe]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 43390321420
          name: real-cavalry-512-before-after
          path: recorded
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read source pixels and produce the normal-speed paired movie
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python3 -m pip install -q Pillow
          python3 - <<'PY'
          import base64,io,json,math
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=next(Path("recorded").rglob("before/frames.json")).parent.parent
          Path("/tmp/horse-source").write_text(str(root))
          rows=[json.loads((root/s/'frames.json').read_text()) for s in ('before','after')]
          assert rows[0]==rows[1] and len(rows[0])==6
          out=Path('evidence')
          out.mkdir()
          observed=[]
          for f in rows[0]:
              name=f["label"]
              images=[Image.open(root/s/(name+".png")).convert('RGB') for s in ('before','after')]
              assert all(img.size==(1920,1200) for img in images)
              x,y=(round(n) for n in f["center_pixel"])
              rect=(x-220,y-170,x+220,y+170)
              crop=[im.crop(rect) for im in images]
              d=ImageChops.difference(*crop)
              assert d.getbbox() is not None
              pair=Image.new('RGB',(880,340)); pair.paste(crop[0],(0,0));pair.paste(crop[1],(440,0))
              pair.save(out/(name+"-pair.png"))
              raw={"view":name,"viewport_crop_mean_rgb":ImageStat.Stat(d).mean,"zoom":f["zoom"],"actor":f["actor"]}
              if f['actor']>=0:
                  # Nose coordinates from Camera3D projected into native saved image.
                  x,y=(round(n) for n in f["muzzle_pixel"])
                  half=math.ceil(1200*.17/f["zoom"])
                  head=(x-half,y-half,x+half+1,y+half+1)
                  dl=ImageChops.difference(images[0].crop(head),images[1].crop(head))
                  raw["muzzle_roi"]=head;raw["muzzle_mean_rgb"]=ImageStat.Stat(dl).mean
                  raw["changed_muzzle_pixels"]=sum(px!=(0,0,0) for px in dl.getdata())
                  assert raw["changed_muzzle_pixels"]>0, name
              observed.append(raw)
              print("HORSE_OBSERVATION",json.dumps(raw))
              jpg=io.BytesIO(); pair.save(jpg,"JPEG",quality=91)
              if name in ("moving-profile","moving-three-quarter","formation-22m","formation-42m"):print("HORSE_WINDOW_PAIR",name,base64.b64encode(jpg.getvalue()).decode())
          (out/'pixel-observations.json').write_text(json.dumps(observed,indent=2))
          (out/'frames.json').write_text(json.dumps(rows[0],indent=2))
          PY
          src=$(cat /tmp/horse-source)
          for side in before after; do
            probe=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames,width,height,r_frame_rate -of csv=p=0 "$src/$side.mp4")
            echo "$side $probe"
            test "$probe" = "1920,1200,20/1,100"
          done
          ffmpeg -v error -y -i "$src/before.mp4" -i "$src/after.mp4" -filter_complex '[0:v]scale=768:480[x];[1:v]scale=768:480[y];[x][y]hstack=inputs=2' -c:v libx264 -pix_fmt yuv420p -crf 17 -movflags +faststart evidence/cavalry-rc9-and-candidate.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavalry-comparison-same-rider
          path: evidence/
